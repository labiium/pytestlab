manufacturer: Keysight
model: DSOX1202G
device_type: oscilloscope
role: measurement
trigger:
  types:
  - HIGH
  - LOW
  modes:
  - EDGE
  - GLITch
  - PATTern
  - SHOLd
  - TRANsition
  - TV
  - SBUS1
  slopes:
  - POS
  - NEG
  - EITH
  - ALT
channels:
- description: Analog Channel 1
  channel_range:
    min_val: -5
    max_val: 5
  input_coupling:
  - DC
  - AC
  input_impedance: 1000000.0
  probe_attenuation:
  - 1
  - 10
  timebase:
    range:
      min_val: 5.0e-09
      max_val: 50
    horizontal_resolution: 1e-12
- description: Analog Channel 2
  channel_range:
    min_val: -5
    max_val: 5
  input_coupling:
  - DC
  - AC
  input_impedance: 1000000.0
  probe_attenuation:
  - 1
  - 10
  timebase:
    range:
      min_val: 5.0e-09
      max_val: 50
    horizontal_resolution: 1e-12
bandwidth: 70000000.0
sampling_rate: 2000000000.0
memory: 2000000.0
waveform_update_rate: 200000.0
fft:
  window_types:
  - RECTangular
  - HANNing
  - FLATtop
  - BHARris
  units:
  - DECibel
  - VRMS
function_generator:
  waveform_types:
  - SIN
  - SQUare
  - RAMp
  - PULse
  - NOISe
  - DC
  supported_states:
  - 'ON'
  - 'OFF'
  offset:
    min_val: -5
    max_val: 5
  frequency:
    min_val: 0.1
    max_val: 20000000.0
  amplitude:
    min_val: 0.002
    max_val: 9
franalysis:
  sweep_points:
    min_val: 1
    max_val: 1000.0
  load:
  - ONEMeg
  - FIFTy
  trace:
  - NONE
  - ALL
  - GAIN
  - PHASe
  mode:
  - SWE
scpi:
  commands:
    identify:
      template: '*IDN?'
    reset:
      template: '*RST'
    clear:
      template: '*CLS'
    opc:
      template: '*OPC'
    panel_lock:
      template: SYSTem:LOCK
    panel_local:
      template: SYSTem:LOCal
    fft_display:
      template: :FFT:DISPlay {state}
    fft_source:
      template: :FFT:SOURce1 CHANnel{channel}
      validators:
        channel:
          min: 1
          max: 2
    fft_window:
      template: :FFT:WINDow {window}
    fft_span:
      template: :FFT:SPAn {span}
    fft_vtype:
      template: :FFT:VTYPe {units}
    fft_scale:
      template: :FFT:SCALe {scale}
    fft_offset:
      template: :FFT:OFFSet {offset}
    function_display:
      template: :FUNCtion:DISPlay {state}
    system_lock:
      template: :SYSTem:LOCK {state}
    auto_scale:
      template: :AUToscale
    probe_set:
      template: :CHANnel{channel}:PROBe {scale}
      validators:
        channel:
          min: 1
          max: 2
    timebase_main_range:
      template: :TIMebase:MAIN:RANGe {time}
    acquire_set_rate:
      template: ACQuire:SRATe {rate}
    channel_bandwidth:
      template: CHANnel{channel}:BANDwidth {bandwidth}
      validators:
        channel:
          min: 1
          max: 2
    acq_set_type:
      template: :ACQuire:TYPE {value}
      parameters:
        value:
          kind: raw
          allow_raw: true
          description: Instrument-accepted acquisition type SCPI token.
    acq_set_mode:
      template: :ACQuire:MODE {value}
      parameters:
        value:
          kind: raw
          allow_raw: true
          description: Instrument-accepted acquisition mode SCPI token.
    acq_set_count:
      template: :ACQuire:COUNt {count}
      parameters:
        count:
          kind: raw
          allow_raw: true
          description: Acquisition count numeric value.
    seg_set_count:
      template: :ACQuire:SEGMented:COUNt {count}
    seg_set_index:
      template: :ACQuire:SEGMented:INDex {index}
    seg_analyze:
      template: :ACQuire:SEGMented:ANALyze
    set_time_axis:
      sequence:
      - :TIMebase:SCALe {scale}
      - :TIMebase:POSition {position}
      parameters:
        scale:
          kind: raw
          allow_raw: true
          description: Horizontal timebase scale value in seconds/division.
        position:
          kind: raw
          allow_raw: true
          description: Horizontal timebase position value in seconds.
    set_channel_axis:
      sequence:
      - :CHANnel{channel}:SCALe {scale}
      - :CHANnel{channel}:OFFSet {offset}
      validators:
        channel:
          min: 1
          max: 2
      parameters:
        scale:
          kind: raw
          allow_raw: true
          description: Vertical scale value for the selected channel.
        offset:
          kind: raw
          allow_raw: true
          description: Vertical offset value for the selected channel.
    configure_trigger:
      sequence:
      - :TRIG:SOUR {source}
      - :TRIGger:LEVel {level}, CHANnel{channel}
      - :TRIGger:SLOPe {slope}
      - :TRIGger:MODE {mode}
      validators:
        channel:
          min: 1
          max: 2
      enums:
        mode:
          edge: EDGE
          glitch: GLITch
          pattern: PATTern
          shold: SHOLd
          transition: TRANsition
          tv: TV
          sbus1: SBUS1
      parameters:
        mode:
          kind: raw
          allow_raw: true
          description: Instrument-accepted trigger mode SCPI token.
        source:
          kind: raw
          allow_raw: true
          description: Instrument-accepted trigger source SCPI token.
        level:
          kind: raw
          allow_raw: true
          description: Trigger level numeric value.
        slope:
          kind: raw
          allow_raw: true
          description: Instrument-accepted trigger slope SCPI token.
    set_trigger_coupling:
      template: :TRIGger:{mode}:COUPling {coupling}
      enums:
        mode:
          edge: EDGE
          glitch: GLITch
          pattern: PATTern
          shold: SHOLd
          transition: TRANsition
          tv: TV
          sbus1: SBUS1
        coupling:
          ac: AC
          dc: DC
    display_channel:
      template: CHANnel{channel}:DISPlay {state}
      validators:
        channel:
          min: 1
          max: 2
      enums:
        state:
          'on': 'ON'
          'off': 'OFF'
          'true': 'ON'
          'false': 'OFF'
          '1': 'ON'
          '0': 'OFF'
    set_channel_coupling:
      template: :CHANnel{channel}:COUPling {coupling}
      validators:
        channel:
          min: 1
          max: 2
    set_wave_source:
      template: :WAVeform:SOURce {source}
      parameters:
        source:
          kind: raw
          allow_raw: true
          description: Instrument-accepted waveform source SCPI token.
    set_wave_points_max:
      template: :WAVeform:POINts MAX
    set_wave_format_byte:
      template: :WAVeform:FORMat BYTE
    set_wave_points_mode_raw:
      template: :WAVeform:POINts:MODE RAW
    digitize:
      template: DIGitize {sources}
      parameters:
        sources:
          kind: raw
          allow_raw: true
          description: Instrument-accepted digitize source list or token.
    run:
      template: RUN
    stop:
      template: STOP
    wgen_output:
      template: WGEN:OUTP {state}
    wgen_set_func:
      template: WGEN:FUNC {func}
    wgen_set_freq:
      template: WGEN:FREQ {frequency}
    wgen_set_volt:
      template: WGEN:VOLT {amplitude}
    wgen_set_offset:
      template: WGEN:VOLT:OFFSet {offset}
    wgen_set_low:
      template: :WGEN:VOLTage:LOW {value}
    wgen_set_high:
      template: :WGEN:VOLTage:HIGH {value}
    wgen_set_square_duty:
      template: :WGEN:FUNCtion:SQUare:DCYCle {duty}
    wgen_set_ramp_symmetry:
      template: :WGEN:FUNCtion:RAMP:SYMMetry {symmetry}
    wgen_set_period:
      template: :WGEN:PERiod {period}
    wgen_set_pulse_width:
      template: :WGEN:FUNCtion:PULSe:WIDTh {width}
    fran_enable:
      template: :FUNCtion:FRANalysis
    fran_input_source:
      template: :FRANalysis:SOURce:INPut CHANnel{channel}
      validators:
        channel:
          min: 1
          max: 2
    fran_output_source:
      template: :FRANalysis:SOURce:OUTPut CHANnel{channel}
      validators:
        channel:
          min: 1
          max: 2
    fran_start:
      template: :FREQuency:START {value}
    fran_stop:
      template: :FREQuency:STOP {value}
    fran_amplitude:
      template: :AMPLitude {value}
    fran_points:
      template: :POINTS {value}
    fran_trace:
      template: :TRACe:FEED {value}
    fran_load:
      template: :LOAD {value}
    fran_disable:
      template: :DISABLE
  queries:
    self_test: {template: "*TST?"}
    opc_query:
      template: '*OPC?'
    esr_query:
      template: '*ESR?'
    get_error:
      template: SYSTem:ERRor?
    get_timebase_scale:
      template: :TIMebase:SCALe?
      response:
        type: float
    get_timebase_position:
      template: :TIMebase:POSition?
      response:
        type: float
    get_channel_scale:
      template: :CHANnel{channel}:SCALe?
      validators:
        channel:
          min: 1
          max: 2
      response:
        type: float
    get_channel_offset:
      template: :CHANnel{channel}:OFFSet?
      validators:
        channel:
          min: 1
          max: 2
      response:
        type: float
    measure_vpp:
      template: MEAS:VPP? CHAN{channel}
      validators:
        channel:
          min: 1
          max: 2
      response:
        type: float
    measure_phase:
      template: MEAS:PHAS? CHAN{channel}
      validators:
        channel:
          min: 1
          max: 2
      response:
        type: float
    measure_vrms:
      template: MEAS:VRMS? CHAN{channel}
      validators:
        channel:
          min: 1
          max: 2
      response:
        type: float
    get_sampling_rate:
      template: :ACQuire:SRATe?
      response:
        type: float
    wave_data:
      template: :WAVeform:DATA?
      response:
        type: binblock
    wave_source:
      template: :WAVeform:SOURce?
      response:
        type: str
    wave_format:
      template: :WAVeform:FORMat?
      response:
        type: str
    wave_byteorder:
      template: :WAVeform:BYTeorder?
      response:
        type: str
    wave_preamble:
      template: :WAVeform:PREamble?
      response:
        type: csv
    channel_display:
      template: CHANnel{channel}:DISPlay?
      validators:
        channel:
          min: 1
          max: 2
      response:
        type: str
    trigger_source:
      template: :TRIGger:SOURce?
      response:
        type: str
    trigger_level:
      template: :TRIGger:LEVel?
      response:
        type: str
    trigger_slope:
      template: :TRIGger:SLOPe?
      response:
        type: str
    fran_fetch:
      template: :FETCH:FRANalysis?
      response:
        type: str
    probe_get:
      template: :CHANnel{channel}:PROBe?
      validators:
        channel:
          min: 1
          max: 2
      response:
        type: float
    acquire_points:
      template: :ACQuire:POINts?
      response:
        type: int
    acquire_sample_rate:
      template: :ACQuire:SRATe?
      response:
        type: float
    acquire_setup:
      template: :ACQuire?
      response:
        type: str
    acq_get_type:
      template: :ACQuire:TYPE?
      response:
        type: str
    acq_get_mode:
      template: :ACQuire:MODE?
      response:
        type: str
    acq_get_count:
      template: :ACQuire:COUNt?
      response:
        type: int
    seg_get_count:
      template: :ACQuire:SEGMented:COUNt?
      response:
        type: int
    seg_get_index:
      template: :ACQuire:SEGMented:INDex?
      response:
        type: int
    screenshot:
      template: :DISPlay:DATA? PNG, COLor
      response:
        type: binblock
operation_options:
  run_self_test:
    transport:
      self_test: self_test
    parameters:
      timeout_ms: {kind: range, unit: ms, integer: true, min: 1, max: 600000, default: 240000, required: false, transport_parameter: false}
  reset:
    transport:
      write: reset
  channel_axis:
    transport:
      write: set_channel_axis
    parameters:
      channel:
        kind: range
        min: 1
        max: 2
        bindings:
        - alias: write
          parameter: channel
      scale:
        kind: range
        min: 1.0e-06
        max: 1000
        bindings:
        - alias: write
          parameter: scale
      offset:
        kind: open_string
        bindings:
        - alias: write
          parameter: offset
  channel_setup:
    transport:
      coupling: set_channel_coupling
      probe: probe_set
      bandwidth: channel_bandwidth
    parameters:
      channel:
        kind: range
        min: 1
        max: 2
        bindings:
        - alias: coupling
          parameter: channel
        - alias: probe
          parameter: channel
        - alias: bandwidth
          parameter: channel
      coupling:
        kind: enum
        options:
        - value: ac
          aliases:
          - AC
          transport:
            value: AC
        - value: dc
          aliases:
          - DC
          transport:
            value: DC
        bindings:
        - alias: coupling
          parameter: coupling
      probe_attenuation:
        kind: range
        min: 1
        max: 1000
        bindings:
        - alias: probe
          parameter: scale
      bandwidth_limit:
        kind: range
        min: 0
        max: 1000000000
        bindings:
        - alias: bandwidth
          parameter: bandwidth
  auto_scale:
    transport:
      write: auto_scale
  run:
    transport:
      write: run
  stop:
    transport:
      write: stop
  measure_phase:
    transport:
      read: measure_phase
    parameters:
      channel:
        kind: range
        min: 1
        max: 2
        bindings:
        - alias: read
          parameter: channel
      uncertainty:
        kind: bool
        strict: false
        default: true
        transport_parameter: false
  fft_display:
    transport:
      write: fft_display
    parameters:
      state:
        kind: bool
        options:
        - value: true
          aliases:
          - 'on'
          transport:
            value: true
        - value: false
          aliases:
          - 'off'
          transport:
            value: false
        bindings:
        - alias: write
          parameter: state
  configure_trigger:
    transport:
      write: configure_trigger
    parameters:
      source:
        kind: enum
        options:
        - value: channel_1
          label: Channel 1
          aliases:
          - ch1
          - chan1
          transport:
            value: CHANnel1
        - value: channel_2
          label: Channel 2
          aliases:
          - ch2
          - chan2
          transport:
            value: CHANnel2
        - value: channel_3
          label: Channel 3
          aliases:
          - ch3
          - chan3
          transport:
            value: CHANnel3
        - value: channel_4
          label: Channel 4
          aliases:
          - ch4
          - chan4
          transport:
            value: CHANnel4
        - value: external
          label: External
          aliases:
          - ext
          transport:
            value: EXTERNAL
        - value: line
          label: Line
          transport:
            value: LINE
        - value: wgen
          label: Waveform generator
          aliases:
          - generator
          transport:
            value: WGEN
        bindings:
        - alias: write
          parameter: source
      mode:
        kind: enum
        options:
        - value: edge
          label: Edge
          transport:
            value: EDGE
        - value: glitch
          label: Glitch
          transport:
            value: GLITch
        - value: pattern
          label: Pattern
          transport:
            value: PATTern
        - value: delay
          label: Delay
          transport:
            value: DELay
        - value: or
          label: Or
          transport:
            value: OR
        - value: runt
          label: Runt
          transport:
            value: RUNT
        - value: setup_hold
          label: Setup and hold
          aliases:
          - shold
          transport:
            value: SHOLd
        - value: transition
          label: Rise/fall transition
          transport:
            value: TRANsition
        - value: window
          label: Window
          transport:
            value: WINDow
        bindings:
        - alias: write
          parameter: mode
      slope:
        kind: enum
        options:
        - value: positive
          label: Positive
          aliases:
          - pos
          - rising
          transport:
            value: POS
        - value: negative
          label: Negative
          aliases:
          - neg
          - falling
          transport:
            value: NEG
        - value: alternating
          label: Alternating
          aliases:
          - alt
          transport:
            value: ALT
        - value: either
          label: Either
          aliases:
          - eith
          transport:
            value: EITH
        bindings:
        - alias: write
          parameter: slope
      channel:
        kind: range
        min: 1
        max: 2
        bindings:
        - alias: write
          parameter: channel
      level:
        kind: range
        min: -1000
        max: 1000
        bindings:
        - alias: write
          parameter: level
  waveform_readout:
    transport:
      source: set_wave_source
      points_max: set_wave_points_max
      format_byte: set_wave_format_byte
      points_raw: set_wave_points_mode_raw
    parameters:
      channel:
        kind: enum
        options:
        - value: channel_1
          label: Channel 1
          aliases:
          - ch1
          - chan1
          transport:
            value: CHANnel1
        - value: channel_2
          label: Channel 2
          aliases:
          - ch2
          - chan2
          transport:
            value: CHANnel2
        bindings:
        - alias: source
          parameter: source
      mode:
        kind: enum
        required: false
        default: controlled
        transport_parameter: false
        options:
        - value: controlled
        - value: read_only
      format:
        kind: enum
        required: false
        default: byte
        transport_parameter: false
        options:
        - value: byte
        - value: word
        - value: auto
      points:
        kind: range
        required: false
        min: 1
        transport_parameter: false
      uncertainty:
        kind: bool
        required: false
        default: true
        transport_parameter: false
        options:
        - value: true
        - value: false
      restore_state:
        kind: bool
        required: false
        default: false
        transport_parameter: false
        options:
        - value: true
        - value: false
      timeout_ms:
        kind: range
        required: false
        min: 1
        transport_parameter: false
  wave_generator_basic:
    transport:
      write: wgen_output
    parameters:
      state:
        kind: bool
        options:
        - value: true
          aliases:
          - 'on'
          transport:
            value: 'ON'
        - value: false
          aliases:
          - 'off'
          transport:
            value: 'OFF'
        bindings:
        - alias: write
          parameter: state
  set_acquisition_type:
    transport:
      write: acq_set_type
    parameters:
      acq_type:
        kind: enum
        options:
        - value: normal
          aliases:
          - norm
          transport:
            value: NORMal
        - value: average
          aliases:
          - aver
          transport:
            value: AVERage
        - value: peak
          aliases: []
          transport:
            value: PEAK
        - value: high_resolution
          aliases:
          - high_res
          - hres
          transport:
            value: HRESolution
        bindings:
        - alias: write
          parameter: value
  set_acquisition_mode:
    transport:
      write: acq_set_mode
    parameters:
      mode:
        kind: enum
        options:
        - value: real_time
          aliases:
          - rtim
          - rtime
          transport:
            value: RTIMe
        - value: segmented
          aliases:
          - segm
          transport:
            value: SEGMented
        bindings:
        - alias: write
          parameter: value
  set_wave_gen_func:
    transport:
      write: wgen_set_func
    parameters:
      func_type:
        kind: enum
        options:
        - value: sine
          aliases:
          - sin
          transport:
            value: SIN
        - value: square
          aliases:
          - square
          transport:
            value: SQUare
        - value: ramp
          aliases:
          - ramp
          transport:
            value: RAMp
        - value: pulse
          aliases:
          - pulse
          transport:
            value: PULse
        - value: noise
          aliases:
          - noise
          transport:
            value: NOISe
        - value: dc
          aliases:
          - dc
          transport:
            value: DC
        bindings:
        - alias: write
          parameter: func
  time_axis:
    transport:
      write: set_time_axis
    parameters:
      scale:
        kind: range
        min: 1.0e-15
        max: 1000
        bindings:
        - alias: write
          parameter: scale
      position:
        kind: range
        min: -1000
        max: 1000
        bindings:
        - alias: write
          parameter: position
  measure_vpp:
    transport:
      read: measure_vpp
    parameters:
      channel:
        kind: range
        min: 1
        max: 2
        bindings:
        - alias: read
          parameter: channel
      uncertainty:
        kind: bool
        strict: false
        default: true
        transport_parameter: false
  measure_vrms:
    transport:
      read: measure_vrms
    parameters:
      channel:
        kind: range
        min: 1
        max: 2
        bindings:
        - alias: read
          parameter: channel
      uncertainty:
        kind: bool
        strict: false
        default: true
        transport_parameter: false
  trigger_setup_edge:
    transport:
      configure: configure_trigger
      coupling: set_trigger_coupling
    parameters:
      source:
        kind: enum
        bindings:
        - alias: configure
          parameter: source
        options:
        - value: channel_1
          transport:
            value: CHANnel1
      level:
        kind: range
        bindings:
        - alias: configure
          parameter: level
        min: -1000
        max: 1000
      slope:
        kind: enum
        bindings:
        - alias: configure
          parameter: slope
        options:
        - value: positive
          transport:
            value: POS
      coupling:
        kind: enum
        bindings:
        - alias: coupling
          parameter: coupling
        options:
        - value: dc
          transport:
            value: DC
      mode:
        kind: enum
        bindings:
        - alias: configure
          parameter: mode
        options:
        - value: edge
          transport:
            value: EDGE
  acquisition:
    transport:
      set_type: acq_set_type
      get_type: acq_get_type
      set_mode: acq_set_mode
      get_mode: acq_get_mode
      set_count: acq_set_count
      get_count: acq_get_count
      points: acquire_points
      sample_rate: acquire_sample_rate
  segmented_acquisition:
    transport:
      set_count: seg_set_count
      get_count: seg_get_count
      set_index: seg_set_index
      get_index: seg_get_index
      analyze: seg_analyze
  digitize:
    transport:
      write: digitize
    parameters:
      channels:
        kind: enum
        transport_parameter: false
        options:
        - value:
          - 1
          label: Channel 1
        - value:
          - 2
          label: Channel 2
        - value:
          - 1
          - 2
          label: Channels 1, 2
      run_after:
        kind: bool
        required: false
        default: true
        transport_parameter: false
        options:
        - value: true
        - value: false
      timebase:
