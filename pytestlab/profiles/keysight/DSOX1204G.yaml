manufacturer: Keysight
model: DSOX1204G
device_type: oscilloscope
role: measurement
trigger:
  sources:
    channel_1: CHANnel1
    channel_2: CHANnel2
    channel_3: CHANnel3
    channel_4: CHANnel4
    external: EXTernal
    line: LINE
    wgen: WGEN
  types:
    - HIGH
    - LOW
  modes:
    - EDGE
    - GLITch
    - PATTern
    - SHOLd
    - TRANsition
    - TV
    - SBUS1
  slopes:
    - POS
    - NEG
    - EITH
    - ALT
  level_range:
    min_val: -5
    max_val: 5
channels:
  - description: Analog Channel 1
    channel_range:
      min_val: -5
      max_val: 5
    input_coupling:
      - DC
      - AC
    input_impedance: 1.e+6
    probe_attenuation:
      - 1
      - 10
    timebase:
      range:
        min_val: 2.e-9
        max_val: 50
      horizontal_resolution: 1e-12
  - description: Analog Channel 2
    channel_range:
      min_val: -5
      max_val: 5
    input_coupling:
      - DC
      - AC
    input_impedance: 1.e+6
    probe_attenuation:
      - 1
      - 10
    timebase:
      range:
        min_val: 2.e-9
        max_val: 50
      horizontal_resolution: 1e-12
  - description: Analog Channel 3
    channel_range:
      min_val: -5
      max_val: 5
    input_coupling:
      - DC
      - AC
    input_impedance: 1.e+6
    probe_attenuation:
      - 1
      - 10
    timebase:
      range:
        min_val: 2.e-9
        max_val: 50
      horizontal_resolution: 1e-12
  - description: Analog Channel 4
    channel_range:
      min_val: -5
      max_val: 5
    input_coupling:
      - DC
      - AC
    input_impedance: 1.e+6
    probe_attenuation:
      - 1
      - 10
    timebase:
      range:
        min_val: 2.e-9
        max_val: 50
      horizontal_resolution: 1e-12
bandwidth: 7.e+7
sampling_rate: 2.e+9
memory: 2.e+6
waveform_update_rate: 2.e+5
waveform_source_separator: ", "
fft:
  window_types:
    - RECTangular
    - HANNing
    - FLATtop
    - BHARris
  units:
    - DECibel
    - VRMS
function_generator:
  waveform_types:
    - SIN
    - SQUare
    - RAMp
    - PULse
    - NOISe
    - DC
  supported_states:
    - "ON"
    - "OFF"
  offset:
    min_val: -11
    max_val: 11
  frequency:
    min_val: 0.1
    max_val: 2.e+20
  amplitude:
    min_val: 0
    max_val: 9
franalysis:
  sweep_points:
    min_val: 1
    max_val: 1.e+3
  load:
    - ONEMeg
    - FIFTy
  trace:
    - NONE
    - ALL
    - GAIN
    - PHASe
  mode:
    - SWE

operation_options:
  run_self_test:
    transport:
      self_test: self_test
    parameters:
      timeout_ms: {kind: range, unit: ms, integer: true, min: 1, max: 600000, default: 240000, required: false, transport_parameter: false}
  reset:
    transport:
      write: reset
  channel_axis:
    transport:
      write: set_channel_axis
      scale_only: set_channel_scale
      offset_only: set_channel_offset
    context_queries:
      probe_attenuation: probe_get
      current_offset: get_channel_offset
      current_scale: get_channel_scale
    parameters:
      channel:
        kind: range
        min: 1
        max: 4
        bindings:
        - alias: write
          parameter: channel
      scale:
        kind: range
        unit: V/div
        dependencies: [probe_attenuation, input_impedance]
        multiplier_parameter: probe_attenuation
        description: >-
          Displayed probe-corrected volts per division. The 1:1 limits are 0.0005 to 10 V/div;
          the driver multiplies both limits by the current positive finite probe
          attenuation before writing. Discovery requires current probe attenuation
          and input impedance context.
        contextual_ranges:
        - when: {input_impedance: 1000000}
          min: 0.0005
          max: 10
        bindings:
        - alias: write
          parameter: scale
      offset:
        kind: range
        unit: V
        description: >-
          Probe-corrected offset limits depend on the effective scale. The driver
          validates the requested pair, then checks the instrument's scale readback
          before writing a nonzero offset because scale values can be quantized.
        constraints:
          neutralize_offset_on_scale_change: true
        dependencies: [scale, probe_attenuation, input_impedance]
        multiplier_parameter: probe_attenuation
        contextual_ranges:
        - when:
            input_impedance: 1000000
            scale: {max: 0.2, multiplier_parameter: probe_attenuation}
          min: -2
          max: 2
        - when:
            input_impedance: 1000000
            scale: {exclusive_min: 0.2, multiplier_parameter: probe_attenuation}
          min: -100
          max: 100
        bindings:
        - alias: write
          parameter: offset
      probe_attenuation:
        kind: range
        required: false
        transport_parameter: false
        positive: true
        unit: ratio
      input_impedance:
        kind: enum
        required: false
        transport_parameter: false
        options:
        - value: 1000000
  channel_setup:
    transport:
      coupling: set_channel_coupling
      probe: probe_set
      bandwidth: channel_bandwidth
    parameters:
      channel:
        kind: range
        min: 1
        max: 4
        bindings:
        - alias: coupling
          parameter: channel
        - alias: probe
          parameter: channel
        - alias: bandwidth
          parameter: channel
      coupling:
        kind: enum
        options:
        - value: ac
          constraints: {input_impedance: 1000000}
          aliases:
          - AC
          transport:
            value: AC
        - value: dc
          constraints: {input_impedance: 1000000}
          aliases:
          - DC
          transport:
            value: DC
        bindings:
        - alias: coupling
          parameter: coupling
      probe_attenuation:
        kind: range
        min: 0.1
        max: 10000
        bindings:
        - alias: probe
          parameter: scale
      bandwidth_limit:
        kind: enum
        options:
        - value: 25MHz
          aliases: [25M, 25E6, "25000000"]
          unit: Hz
          transport:
            value: 25E6
        - value: full
          aliases: [FULL, "OFF", "0"]
          transport:
            value: 'OFF'
        bindings:
        - alias: bandwidth
          parameter: bandwidth
  auto_scale:
    transport:
      write: auto_scale
  run:
    transport:
      write: run
  stop:
    transport:
      write: stop
  measure_phase:
    transport:
      read: measure_phase
    parameters:
      channel:
        kind: range
        min: 1
        max: 4
        bindings:
        - alias: read
          parameter: channel
      uncertainty:
        kind: bool
        strict: false
        default: true
        transport_parameter: false
  fft_display:
    transport:
      write: fft_display
    parameters:
      state:
        kind: bool
        options:
        - value: true
          aliases:
          - 'on'
          transport:
            value: true
        - value: false
          aliases:
          - 'off'
          transport:
            value: false
        bindings:
        - alias: write
          parameter: state
  configure_trigger:
    transport:
      write: configure_trigger
    parameters:
      source:
        kind: enum
        options:
        - value: channel_1
          label: Channel 1
          aliases:
          - ch1
          - chan1
          transport:
            value: CHANnel1
        - value: channel_2
          label: Channel 2
          aliases:
          - ch2
          - chan2
          transport:
            value: CHANnel2
        - value: channel_3
          label: Channel 3
          aliases:
          - ch3
          - chan3
          transport:
            value: CHANnel3
        - value: channel_4
          label: Channel 4
          aliases:
          - ch4
          - chan4
          transport:
            value: CHANnel4
        - value: external
          label: External
          aliases:
          - ext
          transport:
            value: EXTERNAL
        - value: line
          label: Line
          transport:
            value: LINE
        - value: wgen
          label: Waveform generator
          aliases:
          - generator
          transport:
            value: WGEN
        bindings:
        - alias: write
          parameter: source
      mode:
        kind: enum
        options:
        - value: edge
          label: Edge
          transport:
            value: EDGE
        - value: glitch
          label: Glitch
          transport:
            value: GLITch
        - value: pattern
          label: Pattern
          transport:
            value: PATTern
        - value: delay
          label: Delay
          transport:
            value: DELay
        - value: or
          label: Or
          transport:
            value: OR
        - value: runt
          label: Runt
          transport:
            value: RUNT
        - value: setup_hold
          label: Setup and hold
          aliases:
          - shold
          transport:
            value: SHOLd
        - value: transition
          label: Rise/fall transition
          transport:
            value: TRANsition
        - value: window
          label: Window
          transport:
            value: WINDow
        bindings:
        - alias: write
          parameter: mode
      slope:
        kind: enum
        options:
        - value: positive
          label: Positive
          aliases:
          - pos
          - rising
          transport:
            value: POS
        - value: negative
          label: Negative
          aliases:
          - neg
          - falling
          transport:
            value: NEG
        - value: alternating
          label: Alternating
          aliases:
          - alt
          transport:
            value: ALT
        - value: either
          label: Either
          aliases:
          - eith
          transport:
            value: EITH
        bindings:
        - alias: write
          parameter: slope
      channel:
        kind: range
        min: 1
        max: 4
        bindings:
        - alias: write
          parameter: channel
      level:
        kind: range
        min: -1000
        max: 1000
        bindings:
        - alias: write
          parameter: level
  waveform_readout:
    transport:
      source: set_wave_source
      points_max: set_wave_points_max
      points: set_wave_points
      format_byte: set_wave_format_byte
      points_raw: set_wave_points_mode_raw
      points_normal: set_wave_points_mode_normal
      points_mode_for_average: set_wave_points_mode_normal
      points_mode_for_peak: set_wave_points_mode_normal
      timebase_mode_query: timebase_mode_query
    parameters:
      channel:
        kind: enum
        options:
        - value: channel_1
          label: Channel 1
          aliases:
          - ch1
          - chan1
          transport:
            value: CHANnel1
        - value: channel_2
          label: Channel 2
          aliases:
          - ch2
          - chan2
          transport:
            value: CHANnel2
        - value: channel_3
          label: Channel 3
          aliases:
          - ch3
          - chan3
          transport:
            value: CHANnel3
        - value: channel_4
          label: Channel 4
          aliases:
          - ch4
          - chan4
          transport:
            value: CHANnel4
        bindings:
        - alias: source
          parameter: source
      mode:
        kind: enum
        required: false
        default: controlled
        transport_parameter: false
        options:
        - value: controlled
        - value: read_only
      format:
        kind: enum
        required: false
        default: byte
        transport_parameter: false
        options:
        - value: byte
        - value: word
        - value: auto
      points:
        kind: range
        required: false
        min: 100
        max: 2000000
        description: Device-side transfer count; effective count depends on the selected record.
        constraints:
          values: [100, 250, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000, 1000000, 2000000]
          values_by_record:
            normal: [100, 250, 500, 1000]
        transport_parameter: false
      uncertainty:
        kind: bool
        required: false
        default: true
        transport_parameter: false
        options:
        - value: true
        - value: false
      restore_state:
        kind: bool
        required: false
        default: false
        transport_parameter: false
        options:
        - value: true
        - value: false
      timeout_ms:
        kind: range
        required: false
        min: 1
        transport_parameter: false
  wave_generator_basic:
    transport:
      write: wgen_output
    parameters:
      state:
        kind: bool
        options:
        - value: true
          aliases:
          - 'on'
          transport:
            value: 'ON'
        - value: false
          aliases:
          - 'off'
          transport:
            value: 'OFF'
        bindings:
        - alias: write
          parameter: state
  set_acquisition_type:
    transport:
      write: acq_set_type
    parameters:
      acq_type:
        kind: enum
        options:
