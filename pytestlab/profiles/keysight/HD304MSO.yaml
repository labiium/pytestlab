manufacturer: Keysight
model: HD304MSO
device_type: oscilloscope
role: measurement
measurement_accuracy:
  waveform_ch1: &id001
    model: linear
    reading_percent: 1.0
    offset: 0.005
    offset_unit: V
    distribution: rectangular
  waveform_ch2: *id001
  waveform_ch3: *id001
  waveform_ch4: *id001
trigger:
  types:
  - Zone
  - Edge
  - Edge-then-Edge
  - Pulse width
  - Runt
  - Setup and hold
  - Rise/fall time
  - Pattern
  - Or
  - I2C
  - SPI
  - RS-232/422/485/UART
  - CAN, CAN FD, CAN XL
  - LIN
  - SENT
  modes:
  - Normal
  - Auto
  - Single
  - Force
  slopes:
  - Rising
  - Falling
  - Alternating
  - Either
channels:
- description: Analog Channel 1
  channel_range:
    min_val: 0.0001
    max_val: 10
  input_coupling:
  - AC
  - DC
  input_impedance: 1000000
  probe_attenuation:
  - 1
  - 10
  timebase:
    range:
      min_val: 5.0e-10
      max_val: 50
    horizontal_resolution: 3200000000.0
- description: Analog Channel 2
  channel_range:
    min_val: 0.0001
    max_val: 10
  input_coupling:
  - AC
  - DC
  input_impedance: 1000000
  probe_attenuation:
  - 1
  - 10
  timebase:
    range:
      min_val: 5.0e-10
      max_val: 50
    horizontal_resolution: 3200000000.0
- description: Analog Channel 3
  channel_range:
    min_val: 0.0001
    max_val: 10
  input_coupling:
  - AC
  - DC
  input_impedance: 1000000
  probe_attenuation:
  - 1
  - 10
  timebase:
    range:
      min_val: 5.0e-10
      max_val: 50
    horizontal_resolution: 3200000000.0
- description: Analog Channel 4
  channel_range:
    min_val: 0.0001
    max_val: 10
  input_coupling:
  - AC
  - DC
  input_impedance: 1000000
  probe_attenuation:
  - 1
  - 10
  timebase:
    range:
      min_val: 5.0e-10
      max_val: 50
    horizontal_resolution: 3200000000.0
bandwidth: 200000000
sampling_rate: 3200000000
memory: 100000000
waveform_update_rate: 1300000
fft:
  window_types:
  - Hanning
  - Flat Top
  - Rectangular
  - Blackman-Harris
  - Bartlett
  units:
  - dBm
  - dBV
function_generator:
  waveform_types:
  - Sine
  - Square
  - Ramp
  - Pulse
  - DC
  - Noise
  - Sine Cardinal (Sinc)
  - Exponential Rise
  - Exponential Fall
  - Cardiac
  - Gaussian Pulse
  - Arbitrary
  supported_states:
  - Normal
  - Single shot
  offset:
    min_val: -8.0
    max_val: 8.0
  frequency:
    min_val: 0.01
    max_val: 100000000
  amplitude:
    min_val: 0.002
    max_val: 10.0
franalysis:
  sweep_points:
    min_val: 10
    max_val: 1000
  load:
  - 50 Ohm
  - 1 MOhm
  trace:
  - Gain
  - Phase
  mode:
  - Logarithmic
  - Linear
scpi:
  commands:
    identify:
      template: '*IDN?'
    clear:
      template: '*CLS'
    reset:
      template: '*RST'
    opc:
      template: '*OPC'
    auto_scale:
      template: :AUToscale
    measure_vpp:
      template: :MEASure:VPP? CHANnel{channel}
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    measure_vrms:
      template: :MEASure:VRMS? CYCLe,AC,CHANnel{channel}
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    set_time_axis:
      sequence:
      - :TIMebase:SCALe {scale}
      - :TIMebase:POSition {position}
      parameters:
        scale:
          kind: raw
          allow_raw: true
          description: Horizontal timebase scale value in seconds/division.
          examples:
          - 1.0
        position:
          kind: raw
          allow_raw: true
          description: Horizontal timebase position value in seconds.
          examples:
          - 0.0
    timebase_main_range:
      template: :TIMebase:RANGe {time}
      parameters:
        time:
          kind: raw
          allow_raw: true
          description: Time value example in seconds used for command-build smoke validation.
          examples:
          - 0.001
    set_channel_axis:
      sequence:
      - :CHANnel{channel}:SCALe {scale}
      - :CHANnel{channel}:OFFSet {offset}
      validators:
        channel:
          min: 1
          max: 4
      parameters:
        scale:
          kind: raw
          allow_raw: true
          description: Vertical scale value for the selected channel.
          examples:
          - 1.0
        offset:
          kind: raw
          allow_raw: true
          description: Vertical offset value for the selected channel.
          examples:
          - 0.0
    set_channel_range:
      template: :CHANnel{channel}:RANGe {range}
      validators:
        channel:
          min: 1
          max: 4
      parameters:
        range:
          kind: raw
          allow_raw: true
          description: Numeric range example used for command-build smoke validation.
          examples:
          - 1.0
    display_channel:
      template: :CHANnel{channel}:DISPlay {state}
      validators:
        channel:
          min: 1
          max: 4
      enums:
        state:
          'on': 'ON'
          'off': 'OFF'
          'true': 'ON'
          'false': 'OFF'
          '1': 'ON'
          '0': 'OFF'
      parameters:
        state:
          kind: enum
          strict: true
          choices: &id002
          - token: 'ON'
            label: 'ON'
            aliases:
            - 'on'
            - 'true'
            - '1'
          - token: 'OFF'
            label: 'OFF'
            aliases:
            - 'off'
            - 'false'
            - '0'
          description: Instrument-accepted state token used for command-build smoke validation.
    probe_set:
      template: :CHANnel{channel}:PROBe {scale}
      validators:
        channel:
          min: 1
          max: 4
      parameters:
        scale:
          kind: raw
          allow_raw: true
          description: Numeric scale example used for command-build smoke validation.
          examples:
          - 1.0
    channel_bandwidth:
      template: :CHANnel{channel}:BANDwidth {bandwidth}
      validators:
        channel:
          min: 1
          max: 4
      parameters:
        bandwidth:
          kind: raw
          allow_raw: true
          description: Bandwidth example in Hz used for command-build smoke validation.
          examples:
          - 20000000
    configure_trigger:
      sequence:
      - :TRIGger:MODE {mode}
      - :TRIGger:EDGE:SOURce {source}
      - :TRIGger:EDGE:LEVel {level}
      - :TRIGger:EDGE:SLOPe {slope}
      parameters:
        mode:
          kind: raw
          allow_raw: true
          description: Instrument-accepted trigger mode SCPI token.
          examples:
          - EDGE
        source:
          kind: raw
          allow_raw: true
          description: Instrument-accepted trigger source SCPI token.
          examples:
          - CHAN1
        level:
          kind: raw
          allow_raw: true
          description: Trigger level numeric value.
          examples:
          - 0.0
        slope:
          kind: raw
          allow_raw: true
          description: Instrument-accepted trigger slope SCPI token.
          examples:
          - POS
    trigger_sweep:
      template: :TRIGger:SWEep {sweep}
      enums:
        sweep:
          auto: AUTO
          normal: NORMal
          norm: NORMal
      parameters:
        sweep:
          kind: raw
          allow_raw: true
          description: Instrument-accepted trigger sweep token used for command-build smoke validation.
          examples:
          - AUTO
    trigger_force:
      template: :TRIGger:FORCe
    acq_set_type:
      template: :ACQuire:TYPE {value}
      parameters:
        value:
          kind: raw
          allow_raw: true
          description: Instrument-accepted acquisition type SCPI token.
          examples:
          - NORM
    acq_set_mode:
      template: :ACQuire:MODE {value}
      parameters:
        value:
          kind: raw
          allow_raw: true
          description: Instrument-accepted acquisition mode SCPI token.
          examples:
          - NORM
    acq_set_count:
      template: :ACQuire:COUNt {count}
      parameters:
        count:
          kind: raw
          allow_raw: true
          description: Acquisition count numeric value.
          examples:
          - 1
    acquire_set_points:
      template: :ACQuire:POINts:ANALog {points}
      parameters:
        points:
          kind: raw
          allow_raw: true
          description: Integer point-count example used for command-build smoke validation.
          examples:
          - 1000
    acquire_set_rate:
      template: :ACQuire:SRATe:ANALog {rate}
      parameters:
        rate:
          kind: raw
          allow_raw: true
          description: Sample-rate example in samples per second used for command-build smoke validation.
          examples:
          - 1000000
    set_wave_source:
      template: :WAVeform:SOURce {source}
      parameters:
        source:
          kind: raw
          allow_raw: true
          description: Instrument-accepted waveform source SCPI token.
          examples:
          - CHAN1
    set_wave_points_max:
      template: :WAVeform:POINts MAX
    set_wave_points:
      template: :WAVeform:POINts {points}
      parameters:
        points:
          kind: raw
          allow_raw: true
          description: Integer point-count example used for command-build smoke validation.
          examples:
          - 1000
    set_wave_format_byte:
      template: :WAVeform:FORMat BYTE
    set_wave_format_word:
      template: :WAVeform:FORMat WORD
    set_wave_format_ascii:
      template: :WAVeform:FORMat ASCii
    set_wave_points_mode_raw:
      template: :WAVeform:POINts:MODE RAW
    digitize:
      template: :DIGitize {sources}
      parameters:
        sources:
          kind: raw
          allow_raw: true
          description: Instrument-accepted digitize source list or token.
          examples:
          - CHAN1
    wgen_output:
      template: :WGEN{generator}:OUTPut {state}
      validators:
        generator:
          min: 1
          max: 2
      enums:
        state:
          'on': 'ON'
          'off': 'OFF'
          'true': 'ON'
          'false': 'OFF'
          '1': 'ON'
          '0': 'OFF'
      parameters:
        state:
          kind: enum
          strict: true
          choices: *id002
          description: Instrument-accepted state token used for command-build smoke validation.
    wgen_set_func:
      template: :WGEN{generator}:FUNCtion {function}
      validators:
        generator:
          min: 1
          max: 2
      parameters:
        function:
          kind: raw
          allow_raw: true
          description: Waveform function token used for command-build smoke validation.
          examples:
          - SIN
    wgen_set_amplitude:
      template: :WGEN{generator}:VOLTage {amplitude}
      validators:
        generator:
          min: 1
          max: 2
      parameters:
        amplitude:
          kind: raw
          allow_raw: true
          description: Amplitude example used for command-build smoke validation.
          examples:
          - 1.0
    wgen_set_offset:
      template: :WGEN{generator}:VOLTage:OFFSet {offset}
      validators:
        generator:
          min: 1
          max: 2
      parameters:
        offset:
          kind: raw
          allow_raw: true
          description: Numeric offset example used for command-build smoke validation.
          examples:
          - 0.0
    wgen_set_period:
      template: :WGEN{generator}:PERiod {period}
      validators:
        generator:
          min: 1
          max: 2
      parameters:
        period:
          kind: raw
          allow_raw: true
          description: Period example in seconds used for command-build smoke validation.
          examples:
          - 0.001
    wgen_output_mode:
      template: :WGEN{generator}:OUTPut:MODE {mode}
      validators:
        generator:
          min: 1
          max: 2
      parameters:
        mode:
          kind: raw
          allow_raw: true
          description: Instrument-accepted mode token used for command-build smoke validation.
          examples:
          - EDGE
    wgen_output_load:
      template: :WGEN{generator}:OUTPut:LOAD {load}
      validators:
        generator:
          min: 1
          max: 2
      parameters:
        load:
          kind: raw
          allow_raw: true
          description: Instrument-accepted output-load token used for command-build smoke validation.
          examples:
          - FIFTY
  queries:
    opc_query:
      template: '*OPC?'
      response:
        type: int
    esr_query:
      template: '*ESR?'
      response:
        type: int
    get_error:
      template: :SYSTem:ERRor?
      response:
        type: str
    scpi_version:
      template: :SYSTem:VERSion?
      response:
        type: str
    get_timebase_scale:
      template: :TIMebase:SCALe?
      response:
        type: scpi_float
    get_timebase_position:
      template: :TIMebase:POSition?
      response:
        type: scpi_float
    get_channel_scale:
      template: :CHANnel{channel}:SCALe?
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    get_channel_offset:
      template: :CHANnel{channel}:OFFSet?
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    get_channel_range:
      template: :CHANnel{channel}:RANGe?
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    probe_get:
      template: :CHANnel{channel}:PROBe?
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    trigger_mode:
      template: :TRIGger:MODE?
      response:
        type: str
    trigger_sweep_query:
      template: :TRIGger:SWEep?
      response:
        type: str
    trigger_source:
      template: :TRIGger:EDGE:SOURce?
      response:
        type: str
    trigger_slope:
      template: :TRIGger:EDGE:SLOPe?
      response:
        type: str
    trigger_level:
      template: :TRIGger:EDGE:LEVel?
      response:
        type: scpi_float
    acquire_points:
      template: :ACQuire:POINts:ANALog?
      response:
        type: int
    acquire_sample_rate:
      template: :ACQuire:SRATe:ANALog?
      response:
        type: scpi_float
    acquire_setup:
      template: :ACQuire?
      response:
        type: str
    acq_get_type:
      template: :ACQuire:TYPE?
      response:
        type: str
    acq_get_mode:
      template: :ACQuire:MODE?
      response:
        type: str
    acq_get_count:
      template: :ACQuire:COUNt?
      response:
        type: int
    wave_source:
      template: :WAVeform:SOURce?
      response:
        type: str
    wave_points:
      template: :WAVeform:POINts?
      response:
        type: int
    wave_points_mode:
      template: :WAVeform:POINts:MODE?
      response:
        type: str
    wave_format:
      template: :WAVeform:FORMat?
      response:
        type: str
    wave_data:
      template: :WAVeform:DATA?
      response:
        type: binblock
    wave_preamble:
      template: :WAVeform:PREamble?
      response:
        type: csv
    wgen_output_query:
      template: :WGEN{generator}:OUTPut?
      validators:
        generator:
          min: 1
          max: 2
      response:
        type: str
    wgen_function:
      template: :WGEN{generator}:FUNCtion?
      validators:
        generator:
          min: 1
          max: 2
      response:
        type: str
    wgen_amplitude:
      template: :WGEN{generator}:VOLTage?
      validators:
        generator:
          min: 1
          max: 2
      response:
        type: scpi_float
    wgen_offset:
      template: :WGEN{generator}:VOLTage:OFFSet?
      validators:
        generator:
          min: 1
          max: 2
      response:
        type: scpi_float
    wgen_period:
      template: :WGEN{generator}:PERiod?
      validators:
        generator:
          min: 1
          max: 2
      response:
        type: scpi_float
