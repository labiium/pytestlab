device_type: multimeter
role: measurement
manufacturer: keysight
model: EDU34450A
description: 5.5-digit dual-display digital multimeter
display:
  size_inch: 7.0
  type: dual-measurement color TFT
  digits_resolution: 5.5
memory:
  logged_points: 5000
interfaces:
- USB
- LAN
software:
  name: PathWave BenchVue DMM
  included: true
resolution_modes:
- SLOW
- MEDIUM
- FAST
limits:
  voltage_V: 1000
  current_A: 3
  resistance_ohm: 1e8
  capacitance_F: 1e-5
  frequency_Hz: 1e6
measurement_functions:
  dc_voltage:
    label: DC voltage
    description: Measure direct voltage at the DMM input.
    aliases:
    - voltage
    - voltage_dc
    unit: V
    transport:
      function_token: VOLT:DC
      response_tokens:
      - DCV
      - VOLT
      measure_alias: measure
    input_impedance_Mohm:
      default: 10
      high_Z_for_ranges_V:
      - 0.1
      - 1
    ranges:
    - nominal_V: 0.1
      accuracy:
        reading_percent: 0.018
        range_percent: 0.008
      temp_coeff_per_C:
        reading_percent: 0.002
        range_percent: 0.0008
    - nominal_V: 1
      accuracy:
        reading_percent: 0.015
        range_percent: 0.005
      temp_coeff_per_C:
        reading_percent: 0.0015
        range_percent: 0.0008
    - nominal_V: 10
      accuracy:
        reading_percent: 0.025
        range_percent: 0.005
      temp_coeff_per_C:
        reading_percent: 0.002
        range_percent: 0.0008
    - nominal_V: 100
      accuracy:
        reading_percent: 0.025
        range_percent: 0.005
      temp_coeff_per_C:
        reading_percent: 0.002
        range_percent: 0.0008
    - nominal_V: 1000
      accuracy:
        reading_percent: 0.027
        range_percent: 0.005
      temp_coeff_per_C:
        reading_percent: 0.002
        range_percent: 0.0008
  resistance:
    label: 2-wire resistance
    description: Measure resistance using the two-wire technique.
    aliases:
    - ohms
    - resistance_2wire
    unit: Ω
    transport:
      function_token: RES
      measure_alias: measure
  resistance_4wire:
    label: 4-wire resistance
    description: Measure resistance using the four-wire technique.
    aliases:
    - four_wire_resistance
    unit: Ω
    transport:
      function_token: FRES
      measure_alias: measure
    open_circuit_voltage_V: 2.8
    ranges:
    - nominal_ohm: 1e2
      test_current_A: 1e-3
      accuracy:
        reading_percent: 0.065
        range_percent: 0.01
      temp_coeff_per_C:
        reading_percent: 0.008
        range_percent: 0.0008
    - nominal_ohm: 1e3
      test_current_A: 5e-4
      accuracy:
        reading_percent: 0.065
        range_percent: 0.008
      temp_coeff_per_C:
        reading_percent: 0.008
        range_percent: 0.0005
    - nominal_ohm: 1e4
      test_current_A: 1e-4
      accuracy:
        reading_percent: 0.065
        range_percent: 0.005
      temp_coeff_per_C:
        reading_percent: 0.008
        range_percent: 0.0005
    - nominal_ohm: 1e5
      test_current_A: 1e-5
      accuracy:
        reading_percent: 0.065
        range_percent: 0.005
      temp_coeff_per_C:
        reading_percent: 0.008
        range_percent: 0.0005
    - nominal_ohm: 1e6
      test_current_A: 1e-6
      accuracy:
        reading_percent: 0.065
        range_percent: 0.005
      temp_coeff_per_C:
        reading_percent: 0.008
        range_percent: 0.0005
    - nominal_ohm: 1e7
      test_current_A: 1e-7
      accuracy:
        reading_percent: 0.3
        range_percent: 0.005
      temp_coeff_per_C:
        reading_percent: 0.025
        range_percent: 0.0005
    - nominal_ohm: 1e8
      test_current_A: 1e-7
      accuracy:
        reading_percent: 2.0
        range_percent: 0.005
      temp_coeff_per_C:
        reading_percent: 0.3
        range_percent: 0.0005
  dc_current:
    label: DC current
    description: Measure direct current through the DMM input.
    aliases:
    - current
    - current_dc
    unit: A
    transport:
      function_token: CURR:DC
      measure_alias: measure
    burden_voltage_V:
    - range_A: 0.01
      max_V: 0.02
    - range_A: 0.1
      max_V: 0.2
    - range_A: 1
      max_V: 0.3
    - range_A: 3
      max_V: 0.9
    ranges:
    - nominal_A: 0.01
      accuracy:
        reading_percent: 0.1
        range_percent: 0.015
      temp_coeff_per_C:
        reading_percent: 0.008
        range_percent: 0.0015
    - nominal_A: 0.1
      accuracy:
        reading_percent: 0.1
        range_percent: 0.007
      temp_coeff_per_C:
        reading_percent: 0.008
        range_percent: 0.001
    - nominal_A: 1
      accuracy:
        reading_percent: 0.3
        range_percent: 0.015
      temp_coeff_per_C:
        reading_percent: 0.019
        range_percent: 0.0015
    - nominal_A: 3
      accuracy:
        reading_percent: 0.3
        range_percent: 0.007
      temp_coeff_per_C:
        reading_percent: 0.019
        range_percent: 0.001
  ac_voltage:
    label: AC voltage
    description: Measure alternating voltage at the DMM input.
    aliases:
    - voltage_ac
    unit: V
    transport:
      function_token: VOLT:AC
      measure_alias: measure
    bandwidth_Hz: 100000
    crest_factor_max: 3.0
    input_impedance_Mohm: 1.1
    ranges:
    - nominal_V: 0.1
      accuracy_45Hz_10kHz:
        reading_percent: 0.2
        range_percent: 0.1
    - nominal_V: 1
      accuracy_45Hz_10kHz:
        reading_percent: 0.2
        range_percent: 0.1
    - nominal_V: 10
      accuracy_45Hz_10kHz:
        reading_percent: 0.2
        range_percent: 0.1
    - nominal_V: 100
      accuracy_45Hz_10kHz:
        reading_percent: 0.2
        range_percent: 0.1
    - nominal_V: 750
      accuracy_45Hz_10kHz:
        reading_percent: 0.2
        range_percent: 0.1
  ac_current:
    label: AC current
    description: Measure alternating current through the DMM input.
    aliases:
    - current_ac
    unit: A
    transport:
      function_token: CURR:AC
      measure_alias: measure
    bandwidth_Hz: 10000
    ranges:
    - nominal_A: 0.01
      accuracy_45Hz_1kHz:
        reading_percent: 0.5
        range_percent: 0.1
    - nominal_A: 0.1
      accuracy_45Hz_1kHz:
        reading_percent: 0.5
        range_percent: 0.1
    - nominal_A: 1
      accuracy_45Hz_1kHz:
        reading_percent: 0.5
        range_percent: 0.1
    - nominal_A: 3
      accuracy_45Hz_1kHz:
        reading_percent: 0.5
        range_percent: 0.1
  frequency:
    label: Frequency
    description: Measure frequency of an input voltage or current.
    aliases:
    - frequency_hz
    unit: Hz
    transport:
      function_token: FREQ
      measure_alias: measure
    input_voltage_V:
      min: 0.1
      max: 750
    input_current_A:
      min: 0.01
      max: 3
    range_Hz:
      min: 20
      max: 1000000
    accuracy:
      reading_percent: 0.025
      counts: 3
    resolution:
    - span_Hz: 12-119.999
      resolution_Hz: 0.001
    - span_kHz: 0.12-1.19999
      resolution_kHz: 1e-5
    - span_kHz: 1.2-11.9999
      resolution_kHz: 1e-4
    - span_kHz: 12-119.999
      resolution_kHz: 0.001
    - span_MHz: 0.12-1.19999
      resolution_MHz: 1e-5
  temperature:
    label: Temperature
    description: Measure temperature with the supported thermistor sensor.
    aliases:
    - temperature_c
    unit: °C
    transport:
      function_token: TEMP
      measure_alias: measure_no_args
    sensor: YSI 44007 thermistor
    range_C:
      min: -80
      max: 150
    added_error_C: 0.2
  capacitance:
    label: Capacitance
    description: Measure capacitance.
    aliases:
    - capacitance_measurement
    unit: F
    transport:
      function_token: CAP
      measure_alias: measure
    ranges:
    - nominal_F: 1e-9
      typical_accuracy:
        reading_percent: 1
        range_percent: 1.5
    - nominal_F: 1e-8
      typical_accuracy:
        reading_percent: 1
        range_percent: 0.5
    - nominal_F: 1e-7
      typical_accuracy:
        reading_percent: 1
        range_percent: 0.5
    - nominal_F: 1e-6
      typical_accuracy:
        reading_percent: 1
        range_percent: 0.5
    - nominal_F: 1e-5
      typical_accuracy:
        reading_percent: 1
        range_percent: 0.5
    - nominal_F: 1e-4
      typical_accuracy:
        reading_percent: 1
        range_percent: 0.5
    - nominal_F: 1e-3
      typical_accuracy:
        reading_percent: 1
        range_percent: 0.5
    - nominal_F: 1e-2
      typical_accuracy:
        reading_percent: 2
        range_percent: 0.5
  diode:
    label: Diode test
    description: Perform a diode forward-voltage test.
    aliases:
    - diode_test
    unit: V
    transport:
      function_token: DIOD
      measure_alias: measure_no_args
  continuity:
    label: Continuity
    description: Check electrical continuity.
    aliases:
    - continuity_test
    unit: Ω
    transport:
      function_token: CONT
      measure_alias: measure_no_args
math_functions:
- 'NULL'
- dBm
- dB
- Min
- Max
- Avg
- Hold
- Limit_Test
sampling_rates_rps:
  ac_voltage:
    SLOW: 1.9
    MEDIUM: 19
    FAST: 90
  dc_voltage:
    SLOW: 1.3
    MEDIUM: 49
    FAST: 110
  resistance_2w:
    SLOW: 1.4
    MEDIUM: 49
    FAST: 110
  resistance_4w:
    SLOW: 1.0
    MEDIUM: 5.2
    FAST: 5.9
  frequency:
    SLOW: 0.9
    MEDIUM: 9.0
  ac_current:
    SLOW: 1.9
    MEDIUM: 19
    FAST: 90
  dc_current:
    SLOW: 1.7
    MEDIUM: 49
    FAST: 110
  diode:
    FAST: 110
  continuity:
    FAST: 110
  temperature:
    MEDIUM: 4.5
scpi:
  commands:
    set_function:
      template: SENSe:FUNCtion "{function}"
      parameters:
        function:
          kind: raw
          allow_raw: true
          examples:
          - VOLT:DC
          description: DMM measurement function SCPI token such as VOLT:DC or RES.
    set_range_auto:
      template: '{function}:RANGe:AUTO {state}'
      enums:
        state:
          true: 'ON'
          false: 'OFF'
      parameters:
        function:
          kind: raw
          allow_raw: true
          examples:
          - VOLT:DC
          description: DMM measurement function SCPI token such as VOLT:DC or RES.
    set_resolution:
      template: '{function}:RESolution {resolution}'
      parameters:
        function:
          kind: raw
          allow_raw: true
          examples:
          - VOLT:DC
          description: DMM measurement function SCPI token such as VOLT:DC or RES.
        resolution:
          kind: raw
          allow_raw: true
          examples:
          - DEF
          description: DMM resolution token or numeric resolution accepted by the
            instrument.
    configure:
      template: CONFigure:{function} {range},{resolution}
      parameters:
        function:
          kind: raw
          allow_raw: true
          examples:
          - VOLT:DC
          description: DMM measurement function SCPI token such as VOLT:DC or RES.
        range:
          kind: raw
          allow_raw: true
          examples:
          - AUTO
          description: DMM range token or numeric range accepted by the instrument.
        resolution:
          kind: raw
          allow_raw: true
          examples:
          - DEF
          description: DMM resolution token or numeric resolution accepted by the
            instrument.
    set_trigger_source:
      template: TRIG:SOUR {source}
      enums:
        source:
          imm: IMM
          ext: EXT
          bus: BUS
    panel_lock:
      template: :SYSTem:LOCK
    panel_local:
      template: :SYSTem:LOCal
    reset:
      template: '*RST'
    clear:
      template: '*CLS'
    opc:
      template: '*OPC'
  queries:
    read:
      template: READ?
      response:
        type: str
    measure:
      template: MEASURE:{function}? {range},{resolution}
      response:
        type: str
      parameters:
        function:
          kind: raw
          allow_raw: true
          examples:
          - VOLT:DC
          description: DMM measurement function SCPI token such as VOLT:DC or RES.
        range:
          kind: raw
          allow_raw: true
          examples:
          - AUTO
          description: DMM range token or numeric range accepted by the instrument.
        resolution:
          kind: raw
          allow_raw: true
          examples:
          - DEF
          description: DMM resolution token or numeric resolution accepted by the
            instrument.
    get_config:
      template: CONFigure?
      response:
        type: str
    identify:
      template: '*IDN?'
      response:
        type: str
    self_test:
      template: '*TST?'
      response:
        type: str
    opc_query:
      template: '*OPC?'
      response:
        type: str
    esr_query:
      template: '*ESR?'
      response:
        type: str
    get_error:
      template: :SYSTem:ERRor?
      response:
        type: str
    scpi_version:
      template: SYSTem:VERSion?
      response:
        type: str
    measure_no_args:
      template: MEASURE:{function}?
      parameters:
        function:
          kind: raw
          allow_raw: true
          examples:
          - TEMP
          description: DMM measurement function token declared by the profile.
      response:
        type: str
simulation:
  identification: Keysight Technologies,EDU34450A,SIM,1.0
  initial_state:
    trigger_source: IMM
  scpi:
    '*IDN?': Keysight Technologies,EDU34450A,SIM,1.0
    '*RST':
      set:
        '': ''
    ':?TRIG(?:GER)?:SOUR(?:CE)?\s+(IMM|EXT|BUS)':
      set:
        trigger_source: '$1'
    ':?TRIG(?:GER)?:SOUR(?:CE)?\?$':
      get: trigger_source
    CONFigure?: VOLT:DC 10,DEF
    READ?: '0.0'
    MEASURE:.*\? .*: '0.0'
    MEASURE:(TEMP|DIOD|CONT)\?$: '0.0'
operation_options:
  measure:
    transport:
      measure: measure
    parameters:
      nplc:
        kind: range
        required: false
        supported: false
        transport_parameter: false
        reason: This profile does not declare integration-time control.
      function:
        kind: enum
        source: measurement_functions
        description: Profile-supported measurement function ID or alias.
      range_val:
        transport_parameter: false
        kind: enum
        required: false
        source: measurement_functions.ranges
        dependencies:
        - function
        default: AUTO
        strict: false
      resolution:
        transport_parameter: false
        kind: open_string
        required: false
        source: measurement_functions.resolution
        dependencies:
        - function
        default: DEF
        strict: false
      uncertainty:
        transport_parameter: false
        kind: bool
        options:
        - value: true
          label: Apply uncertainty
          transport:
            value: true
        - value: false
          label: Nominal value
          transport:
            value: false
        default: true
  identify:
    transport:
      command: identify
  get_config:
    transport:
      query: get_config
  reset:
    transport:
      command: reset
  set_trigger_source:
    transport:
      command: set_trigger_source
    source:
      kind: enum
      bindings:
      - alias: command
        parameter: source
      options:
      - value: imm
        label: Immediate
        transport:
          value: IMM
      - value: ext
        label: External
        transport:
          value: EXT
      - value: bus
        label: Bus
        transport:
          value: BUS
