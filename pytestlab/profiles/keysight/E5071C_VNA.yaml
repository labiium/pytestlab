# pytestlab/profiles/keysight/E5071C_VNA.yaml
manufacturer: Keysight
model: E5071C
device_type: vna
role: measurement

# Optional fields from VNAConfig with example values
s_parameters: ["S11", "S21"]
start_frequency: 100e3 # 100 kHz
stop_frequency: 8.5e9 # 8.5 GHz
num_points: 201
if_bandwidth: 10e3 # 10 kHz
power_level: -5 # -5 dBm

# Enable the shared resource transaction lock without adding command pacing.
transport:
  min_command_interval_s: 0

readback:
  channel: 1
  minimum_firmware: A.09.60
  max_traces: 16
  max_points: 20001

scpi:
  commands:
    reset:
      template: "*RST"
    clear:
      template: "*CLS"
    opc:
      template: "*OPC"
    define_sparameter:
      template: ':CALC{channel}:PAR{index}:DEF {s_parameter}'
      validators:
        channel: {min: 1, max: 36}
        index: {min: 1, max: 16}
      parameters:
        s_parameter:
          kind: enum
          strict: true
          choices:
            - {value: s11, token: "S11", label: "S11", aliases: [S11]}
            - {value: s12, token: "S12", label: "S12", aliases: [S12]}
            - {value: s21, token: "S21", label: "S21", aliases: [S21]}
            - {value: s22, token: "S22", label: "S22", aliases: [S22]}
    set_sweep_type:
      template: ":SENS{channel}:SWE:TYPE {mode}"
      validators:
        channel: {min: 1, max: 36}
      parameters:
        mode:
          kind: enum
          strict: true
          choices:
            - {value: linear, token: LIN}
            - {value: log, token: LOG}
    set_start_frequency:
      template: ":SENS{channel}:FREQ:STAR {frequency}"
      validators:
        channel: {min: 1, max: 36}
        frequency: {min: 9e3, max: 20e9}
    set_stop_frequency:
      template: ":SENS{channel}:FREQ:STOP {frequency}"
      validators:
        channel: {min: 1, max: 36}
        frequency: {min: 9e3, max: 20e9}
    set_points:
      template: ":SENS{channel}:SWE:POIN {points}"
      validators:
        channel: {min: 1, max: 36}
        points: {min: 2, max: 20001}
    set_if_bandwidth:
      template: ":SENS{channel}:BWID {bandwidth}"
      validators:
        channel: {min: 1, max: 36}
        bandwidth: {min: 10, max: 1.5e6}
    set_power_level:
      template: ":SOUR{channel}:POW {power}"
      validators:
        channel: {min: 1, max: 36}
        power: {min: -85, max: 10}
    set_vna_trace_count:
      template: ":CALC{channel}:PAR:COUN {count}"
      validators:
        channel: {min: 1, max: 36}
        count: {min: 1, max: 16}
    fresh_arm:
      template: ":INIT1"
    fresh_trigger:
      template: ":TRIG:SING"
    fresh_abort:
      template: ":ABOR"
  queries:
    inventory_channels: {template: ":SERV:CHAN:COUN?"}
    inventory_traces: {template: ":SERV:CHAN:TRAC:COUN?"}
    inventory_points: {template: ":SERV:SWE:POIN?"}
    inventory_active_channel: {template: ":SERV:CHAN:ACT?"}
    segment_table: {template: ":SENS{channel}:SEGM:DATA?", validators: {channel: {min: 1, max: 36}}}
    segment_state_control: {template: ":SENS{channel}:SEGM:LIST:CONT:STAT?", validators: {channel: {min: 1, max: 36}}}
    segment_row_states: {template: ":SENS{channel}:SEGM:LIST:CONT:DATA?", validators: {channel: {min: 1, max: 36}}}
    segment_arbitrary: {template: ":SENS{channel}:SEGM:ARB:STAT?", validators: {channel: {min: 1, max: 36}}}
    marker_state: {template: ":CALC{channel}:TRAC{trace}:MARK{marker}:STAT?", validators: {channel: {min: 1, max: 36}, trace: {min: 1, max: 16}, marker: {min: 1, max: 9}}}
    marker_format: {template: ":CALC{channel}:TRAC{trace}:FORM?", validators: {channel: {min: 1, max: 36}, trace: {min: 1, max: 16}}}
    marker_display_data: {template: ":DISP:WIND{channel}:TRAC{trace}:STAT?", validators: {channel: {min: 1, max: 36}, trace: {min: 1, max: 16}}}
    marker_display_memory: {template: ":DISP:WIND{channel}:TRAC{trace}:MEM?", validators: {channel: {min: 1, max: 36}, trace: {min: 1, max: 16}}}
    marker_time_transform: {template: ":CALC{channel}:TRAC{trace}:TRAN:TIME:STAT?", validators: {channel: {min: 1, max: 36}, trace: {min: 1, max: 16}}}
    marker_conversion: {template: ":CALC{channel}:TRAC{trace}:CONV:STAT?", validators: {channel: {min: 1, max: 36}, trace: {min: 1, max: 16}}}
    marker_reference: {template: ":CALC{channel}:TRAC{trace}:MARK:REF:STAT?", validators: {channel: {min: 1, max: 36}, trace: {min: 1, max: 16}}}
    marker_equation: {template: ":CALC{channel}:TRAC{trace}:EQU:STAT?", validators: {channel: {min: 1, max: 36}, trace: {min: 1, max: 16}}}
    marker_data: {template: ":CALC{channel}:TRAC{trace}:MARK{marker}:DATA?", validators: {channel: {min: 1, max: 36}, trace: {min: 1, max: 16}, marker: {min: 1, max: 9}}}
    context_port_extension: {template: ":SENS{channel}:CORR:EXT:STAT?", validators: {channel: {min: 1, max: 36}}}
    context_identify: {template: "*IDN?"}
    context_ports: {template: ":SERV:PORT:COUN?"}
    context_continuous: {template: ":INIT{channel}:CONT?", validators: {channel: {min: 1, max: 36}}}
    context_sweep_type: {template: ":SENS{channel}:SWE:TYPE?", validators: {channel: {min: 1, max: 36}}}
    context_start_hz: {template: ":SENS{channel}:FREQ:STAR?", validators: {channel: {min: 1, max: 36}}}
    context_stop_hz: {template: ":SENS{channel}:FREQ:STOP?", validators: {channel: {min: 1, max: 36}}}
    context_points: {template: ":SENS{channel}:SWE:POIN?", validators: {channel: {min: 1, max: 36}}}
    context_if_bandwidth: {template: ":SENS{channel}:BWID?", validators: {channel: {min: 1, max: 36}}}
    context_average: {template: ":SENS{channel}:AVER?", validators: {channel: {min: 1, max: 36}}}
    context_average_count: {template: ":SENS{channel}:AVER:COUN?", validators: {channel: {min: 1, max: 36}}}
    context_frequency_offset: {template: ":SENS{channel}:OFFS:STAT?", validators: {channel: {min: 1, max: 36}}}
    context_fixture_simulator: {template: ":CALC{channel}:FSIM:STAT?", validators: {channel: {min: 1, max: 36}}}
    context_trace_count: {template: ":CALC{channel}:PAR:COUN?", validators: {channel: {min: 1, max: 36}}}
    context_trace_identity: {template: ":CALC{channel}:PAR{index}:DEF?", validators: {channel: {min: 1, max: 36}, index: {min: 1, max: 16}}}
    context_trace_correction: {template: ":SENS{channel}:CORR:TYPE{index}?", validators: {channel: {min: 1, max: 36}, index: {min: 1, max: 16}}}
    context_status: {template: "*STB?"}
    context_condition: {template: ":STAT:OPER:COND?"}
    context_format: {template: ":FORM:DATA?"}
    context_options: {template: "*OPT?"}
    context_reference_ohms: {template: ":SENS:CORR:IMP:INP:MAGN?"}
    fresh_shift_lo:
      template: ":SENS1:SWE:SLOC:STAT?"
    fresh_trace_live:
      template: ":DISP:WIND1:TRAC{trace}:STAT?"
      validators:
        trace: {min: 1, max: 4}
    fresh_trace_conversion:
      template: ":CALC1:TRAC{trace}:CONV:STAT?"
      validators:
        trace: {min: 1, max: 4}
    fresh_trace_gating:
      template: ":CALC1:TRAC{trace}:FILT:GATE:TIME:STAT?"
      validators:
        trace: {min: 1, max: 4}
    fresh_identify:
      template: "*IDN?"
    fresh_options:
      template: "*OPT?"
    fresh_status:
      template: "*STB?"
    fresh_condition:
      template: ":STAT:OPER:COND?"
    fresh_points:
      template: ":SENS1:SWE:POIN?"
    fresh_trace_count:
      template: ":CALC1:PAR:COUN?"
    fresh_trace_identity:
      template: ":CALC1:PAR{trace}:DEF?"
      validators:
        trace: {min: 1, max: 4}
    fresh_trace_correction:
      template: ":SENS1:CORR:TYPE{trace}?"
      validators:
        trace: {min: 1, max: 4}
    fresh_trace_time_transform:
      template: ":CALC1:TRAC{trace}:TRAN:TIME:STAT?"
      validators:
        trace: {min: 1, max: 4}
    fresh_trace_equation:
      template: ":CALC1:TRAC{trace}:EQU:STAT?"
      validators:
        trace: {min: 1, max: 4}
    fresh_trace_hold:
      template: ":CALC1:TRAC{trace}:HOLD:TYPE?"
      validators:
        trace: {min: 1, max: 4}
    fresh_trace_math:
      template: ":CALC1:TRAC{trace}:MATH:FUNC?"
      validators:
        trace: {min: 1, max: 4}
    fresh_frequency_stimulus:
      template: ":SENS1:FREQ:DATA?"
    fresh_start_frequency:
      template: ":SENS1:FREQ:STAR?"
    fresh_stop_frequency:
      template: ":SENS1:FREQ:STOP?"
    fresh_source_power:
      template: ":SOUR1:POW?"
    fresh_completion:
      template: "*OPC?"
    fresh_port_count:
      template: ":SERV:PORT:COUN?"
    fresh_channel_limit:
      template: ":SERV:CHAN:COUN?"
    fresh_continuous:
      template: ":INIT1:CONT?"
    fresh_trigger_source:
      template: ":TRIG:SOUR?"
    fresh_point_trigger:
      template: ":TRIG:POIN?"
    fresh_trigger_output:
      template: ":TRIG:OUTP:STAT?"
    fresh_averaging_trigger:
      template: ":TRIG:AVER?"
    fresh_averaging:
      template: ":SENS1:AVER?"
    fresh_rf_output:
      template: ":OUTP?"
    fresh_format:
      template: ":FORM:DATA?"
    fresh_sweep_type:
      template: ":SENS1:SWE:TYPE?"
    fresh_sweep_generation:
      template: ":SENS1:SWE:GEN?"
    fresh_fixture_simulator:
      template: ":CALC1:FSIM:STAT?"
    fresh_frequency_offset:
