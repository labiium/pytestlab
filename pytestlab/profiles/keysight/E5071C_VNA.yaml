      validators:
        channel: {min: 1, max: 36}
    readback_data_format:
      template: ":FORM:DATA?"
    readback_sweep_type:
      template: ":SENS{channel}:SWE:TYPE?"
      validators:
        channel: {min: 1, max: 36}
    readback_frequency_span:
      template: ":SENS{channel}:FREQ:SPAN?"
      validators:
        channel: {min: 1, max: 36}
    readback_frequency_offset:
