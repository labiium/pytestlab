operation_options:
  operations:
    sparameter_sweep_setup:
      transport:
        trace_count: set_vna_trace_count
        set_sweep_type: set_sweep_type
        set_start_frequency: set_start_frequency
        set_stop_frequency: set_stop_frequency
        set_points: set_points
        set_if_bandwidth: set_if_bandwidth
        set_power_level: set_power_level
        define_sparameter: define_sparameter
      parameters:
        sweep_type:
          kind: enum
          bindings:
          - alias: set_sweep_type
            parameter: mode
          options:
          - value: linear
            label: Linear
            transport: {value: LIN}
          - value: log
            label: Logarithmic
            transport: {value: LOG}
        num_points:
          kind: range
          min: 2
          max: 20001
          bindings:
          - alias: set_points
            parameter: points
        if_bandwidth:
          kind: range
          min: 10
          max: 1.5e6
          bindings:
          - alias: set_if_bandwidth
            parameter: bandwidth
        power_level:
          kind: range
          min: -85
          max: 10
          bindings:
          - alias: set_power_level
            parameter: power
        s_params:
          kind: enum
          bindings:
          - alias: define_sparameter
            parameter: s_parameter
          options:
          - value: s11
            label: S11
            aliases:
            - S11
            transport:
              value: S11
          - value: s12
            label: S12
            aliases:
            - S12
            transport:
              value: S12
          - value: s21
            label: S21
            aliases:
            - S21
            transport:
              value: S21
          - value: s22
            label: S22
            aliases:
            - S22
            transport:
              value: S22
        start_freq:
          kind: range
          min: 9e3
          max: 20e9
          bindings:
          - alias: set_start_frequency
            parameter: frequency
        stop_freq:
          kind: range
          min: 9e3
          max: 20e9
          bindings:
          - alias: set_stop_frequency
            parameter: frequency
    sparameter_data:
      transport:
        identify: identify
        status_byte: readback_status_byte
        condition: readback_condition
        continuous: readback_continuous
        data_format: readback_data_format
        sweep_type: readback_sweep_type
        frequency_span: readback_frequency_span
        frequency_offset: readback_frequency_offset
        fixture_simulator: readback_fixture_simulator
        points: readback_points
        trace_count: readback_trace_count
        trace_identity: readback_trace_identity
        trace_equation: readback_trace_equation
        trace_time_transform: readback_trace_time_transform
        trace_axis: readback_trace_axis
        trace_data: readback_trace_data
      parameters:
        include_context: {kind: bool, default: false, required: false, transport_parameter: false, options: [{value: false}, {value: true}], description: Observe per-port reference impedance and indexed trace correction}
    sparameter_sweep_settings:
      transport:
        start_freq: sweep_start_frequency
        stop_freq: sweep_stop_frequency
        if_bandwidth: sweep_if_bandwidth
        power_coupled: sweep_power_coupled
        power_level: sweep_power_level
        rf_output: sweep_rf_output
        correction: sweep_error_correction
    sparameter_sweep_acquire:
      transport:
        identify: fresh_identify
        options: fresh_options
        status: fresh_status
        condition: fresh_condition
        points: fresh_points
        trace_count: fresh_trace_count
        trace_identity: fresh_trace_identity
        trace_correction: fresh_trace_correction
        trace_time_transform: fresh_trace_time_transform
        trace_equation: fresh_trace_equation
        trace_hold: fresh_trace_hold
        trace_math: fresh_trace_math
        start_frequency: fresh_start_frequency
        frequency_stimulus: fresh_frequency_stimulus
        stop_frequency: fresh_stop_frequency
        source_power: fresh_source_power
        completion: fresh_completion
        port_count: fresh_port_count
        channel_limit: fresh_channel_limit
        continuous: fresh_continuous
        trigger_source: fresh_trigger_source
        point_trigger: fresh_point_trigger
        trigger_output: fresh_trigger_output
        averaging_trigger: fresh_averaging_trigger
        averaging: fresh_averaging
        rf_output: fresh_rf_output
        format: fresh_format
        sweep_type: fresh_sweep_type
        sweep_generation: fresh_sweep_generation
        fixture_simulator: fresh_fixture_simulator
        frequency_offset: fresh_frequency_offset
        external_lo: fresh_external_lo
        external_source_control: fresh_external_source_control
        external_test_set: fresh_external_test_set
        multiplexer_1: fresh_multiplexer_1
        multiplexer_2: fresh_multiplexer_2
        coupled_power: fresh_coupled_power
        power_slope: fresh_power_slope
        port_1_source_correction: fresh_port_1_source_correction
        port_1_loss_compensation: fresh_port_1_loss_compensation
        port_2_source_correction: fresh_port_2_source_correction
        port_2_loss_compensation: fresh_port_2_loss_compensation
        arm: fresh_arm
        trigger: fresh_trigger
        abort: fresh_abort
        trace_gating: fresh_trace_gating
        trace_conversion: fresh_trace_conversion
        trace_live: fresh_trace_live
        shift_lo: fresh_shift_lo
    vna_inventory:
      transport:
        identify: context_identify
        continuous: context_continuous
        ports: context_ports
        max_channels: inventory_channels
        max_traces: inventory_traces
        max_points: inventory_points
        active_channel: inventory_active_channel
        trace_count: context_trace_count
        status: context_status
        condition: context_condition
        options: context_options
      parameters: {}
    sparameter_segment_table:
      transport:
        identify: context_identify
        continuous: context_continuous
        sweep_type: context_sweep_type
        table: segment_table
        status: context_status
        condition: context_condition
        format: context_format
        state_control: segment_state_control
        row_states: segment_row_states
        arbitrary: segment_arbitrary
      parameters: {}
    sparameter_channel_context:
      transport:
        port_extension: context_port_extension
        identify: context_identify
        ports: context_ports
        continuous: context_continuous
        sweep_type: context_sweep_type
        start_hz: context_start_hz
        stop_hz: context_stop_hz
        points: context_points
        if_bandwidth: context_if_bandwidth
        average: context_average
        average_count: context_average_count
        frequency_offset: context_frequency_offset
        fixture_simulator: context_fixture_simulator
        trace_count: context_trace_count
        trace_identity: context_trace_identity
        trace_correction: context_trace_correction
        status: context_status
        condition: context_condition
        format: context_format
        options: context_options
        reference_ohms: context_reference_ohms
      parameters: {}
    sparameter_frequency_marker:
      transport:
        state: marker_state
        format: marker_format
        display_data: marker_display_data
        display_memory: marker_display_memory
        time_transform: marker_time_transform
        conversion: marker_conversion
        reference: marker_reference
        equation: marker_equation
        data: marker_data
      parameters:
        trace: {kind: range, integer: true, min: 1, max: 16, transport_parameter: false}
        marker: {kind: range, integer: true, min: 1, max: 9, default: 1, required: false, transport_parameter: false}
