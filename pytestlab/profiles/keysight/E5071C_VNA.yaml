    sweep_start_frequency:
      template: ":SENS{channel}:FREQ:STAR?"
      validators:
        channel: {min: 1, max: 36}
    sweep_stop_frequency:
      template: ":SENS{channel}:FREQ:STOP?"
      validators:
        channel: {min: 1, max: 36}
    sweep_if_bandwidth:
      template: ":SENS{channel}:BWID?"
      validators:
