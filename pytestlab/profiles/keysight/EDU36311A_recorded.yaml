manufacturer: Keysight
model: EDU36311A
device_type: power_supply
role: stimulus
measurement_accuracy:
  read_voltage_ch1:
    model: linear
    reading_percent: 0.1
    offset: 0.005
    offset_unit: V
    source: Keysight EDU36311A 12-month readback specification
  read_current_ch1:
    model: linear
    reading_percent: 0.1
    offset: 0.010
    offset_unit: A
    source: Keysight EDU36311A 12-month readback specification
  read_voltage_ch2:
    model: linear
    reading_percent: 0.05
    offset: 0.010
    offset_unit: V
    source: Keysight EDU36311A 12-month readback specification
  read_current_ch2:
    model: linear
    reading_percent: 0.2
    offset: 0.005
    offset_unit: A
    source: Keysight EDU36311A 12-month readback specification
  read_voltage_ch3:
    model: linear
    reading_percent: 0.05
    offset: 0.010
    offset_unit: V
    source: Keysight EDU36311A 12-month readback specification
  read_current_ch3:
    model: linear
    reading_percent: 0.2
    offset: 0.005
    offset_unit: A
    source: Keysight EDU36311A 12-month readback specification
channels:
  - channel_id: 1
    description: Channel 1
    voltage_range:
      min_val: 0
      max_val: 6
    current_limit_range:
      min_val: 0
      max_val: 5
  - channel_id: 2
    description: Channel 2
    voltage_range:
      min_val: 0
      max_val: 30
    current_limit_range:
      min_val: 0
      max_val: 1
  - channel_id: 3
    description: Channel 3
    voltage_range:
      min_val: 0
      max_val: 30
    current_limit_range:
      min_val: 0
      max_val: 1
total_power: 90
line_regulation: 0.01
load_regulation: 0.01
scpi:
  commands:
    set_voltage:
      template: "VOLT {voltage}, (@{channel})"
      defaults: { channel: 1 }
      validators:
        voltage: { min: 0, max: 30 }
        channel: { min: 1, max: 3 }
    set_current:
      template: "CURR {current}, (@{channel})"
      defaults: { channel: 1 }
      validators:
        current: { min: 0, max: 5 }
        channel: { min: 1, max: 3 }
    set_output:
      template: "OUTP:STAT {state}, (@{channel})"
      defaults: { channel: 1 }
      enums:
        state:
          { "on": "ON", "off": "OFF", "true": "ON", "false": "OFF", "1": "ON", "0": "OFF" }
      validators:
        channel: { min: 1, max: 3 }
    reset:
      template: "*RST"
    clear:
      template: "*CLS"
    opc:
      template: "*OPC"
  queries:
    opc_query:
      template: "*OPC?"
      response: {type: str}
    esr_query:
      template: "*ESR?"
      response: {type: str}
    get_error:
      template: "SYST:ERR?"
      response: {type: str}
    identify:
      template: "*IDN?"
      response:
        type: str
    measure_voltage:
      template: "MEAS:VOLT? (@{channel})"
      defaults: { channel: 1 }
      validators:
        channel: { min: 1, max: 3 }
      response:
        type: float
    measure_current:
      template: "MEAS:CURR? (@{channel})"
      defaults: { channel: 1 }
      validators:
        channel: { min: 1, max: 3 }
      response:
        type: float
    get_output_state:
      template: "OUTP:STAT? (@{channel})"
      defaults: { channel: 1 }
      validators:
        channel: { min: 1, max: 3 }
      response:
        type: str
simulation:
  initial_state:
    voltage:
      "1": 0.0
      "2": 0.0
      "3": 0.0
    current:
      "1": 0.0
      "2": 0.0
      "3": 0.0
    output:
      "1": "OFF"
      "2": "OFF"
      "3": "OFF"
  scpi:
    "*IDN?": "Simulated,PyTestLab,EDU36311A-RECORDED,1.0"
    ":SYSTem:ERRor?": '+0,"No error"'
    "SYST:ERR?": '+0,"No error"'
    'VOLT (.*), \(@([1-3])\)':
      set:
        "voltage.$2": "$1"
    'CURR (.*), \(@([1-3])\)':
      set:
        "current.$2": "$1"
    'OUTP:STAT (.*), \(@([1-3])\)':
      set:
        "output.$2": "$1"
    'MEAS:VOLT\? \(@([1-3])\)':
      get: "voltage.$1"
    'MEAS:CURR\? \(@([1-3])\)':
      get: "current.$1"
    'OUTP:STAT\? \(@([1-3])\)':
      get: "output.$1"
# Semantic operation metadata.  Transport aliases remain private profile data.
operation_options:
  operations:
    identify:
      transport: {main: identify}
    reset:
      transport: {main: reset}
    set_voltage:
      transport: {main: set_voltage}
      parameters:
        channel:
          kind: enum
          transport_identity: true
          options:
            - {value: 1, label: Channel 1}
            - {value: 2, label: Channel 2}
            - {value: 3, label: Channel 3}
          bindings: [{alias: main, parameter: channel}]
        voltage:
          kind: range
          min: 0
          max: 30
          unit: V
          dependencies: [channel]
          bindings: [{alias: main, parameter: voltage}]
    set_current:
      transport: {main: set_current}
      parameters:
        channel:
          kind: enum
          transport_identity: true
          options:
            - {value: 1, label: Channel 1}
            - {value: 2, label: Channel 2}
            - {value: 3, label: Channel 3}
          bindings: [{alias: main, parameter: channel}]
        current:
          kind: range
          min: 0
          max: 5
          unit: A
          dependencies: [channel]
          bindings: [{alias: main, parameter: current}]
    set_slew_rate:
      transport: {main: set_slew_rate}
      parameters:
        channel:
          kind: enum
          transport_identity: true
          options:
            - {value: 1, label: Channel 1}
            - {value: 2, label: Channel 2}
            - {value: 3, label: Channel 3}
          bindings: [{alias: main, parameter: channel}]
        duration_s:
          kind: range
          min: 0
          max: 30
          unit: s
          dependencies: [channel]
          bindings: [{alias: main, parameter: duration_ms}]
    set_output:
      transport: {main: set_output}
      parameters:
        channel:
          kind: enum
          transport_identity: true
          options:
            - {value: 1, label: Channel 1}
            - {value: 2, label: Channel 2}
            - {value: 3, label: Channel 3}
          bindings: [{alias: main, parameter: channel}]
        state:
          kind: bool
          options:
            - {value: true, label: "On", aliases: ["on"] , transport: {value: ON}}
            - {value: false, label: "Off", aliases: ["off"], transport: {value: OFF}}
          bindings: [{alias: main, parameter: state}]
    set_display:
      transport: {main: set_display}
      parameters:
        state:
          kind: bool
          options:
            - {value: true, label: "On", aliases: ["on"], transport: {value: ON}}
            - {value: false, label: "Off", aliases: ["off"], transport: {value: OFF}}
          bindings: [{alias: main, parameter: state}]
    measure_voltage:
      transport: {main: measure_voltage}
      parameters:
        channel:
          kind: enum
          transport_identity: true
          options:
            - {value: 1, label: Channel 1}
            - {value: 2, label: Channel 2}
            - {value: 3, label: Channel 3}
          bindings: [{alias: main, parameter: channel}]
    measure_current:
      transport: {main: measure_current}
      parameters:
        channel:
          kind: enum
          transport_identity: true
          options:
            - {value: 1, label: Channel 1}
            - {value: 2, label: Channel 2}
            - {value: 3, label: Channel 3}
          bindings: [{alias: main, parameter: channel}]
    get_output_state:
      transport: {main: get_output_state}
      parameters:
        channel:
          kind: enum
          transport_identity: true
          options:
            - {value: 1, label: Channel 1}
            - {value: 2, label: Channel 2}
            - {value: 3, label: Channel 3}
          bindings: [{alias: main, parameter: channel}]
    enable_slew_rate:
      transport:
        enable: enable_slew_rate
        disable: disable_slew_rate
      parameters:
        channel:
          kind: enum
          transport_identity: true
          options:
            - {value: 1, label: Channel 1}
            - {value: 2, label: Channel 2}
            - {value: 3, label: Channel 3}
          bindings: [{alias: enable, parameter: channel}]
        state:
          kind: bool
          transport_parameter: false
          options:
            - {value: true, label: "Enabled", transport: {value: ON}}
            - {value: false, label: "Disabled", transport: {value: OFF}}
    get_configuration:
      transport: {}
