# Programming reference: https://www.keysight.com/me/en/assets/9018-06099/user-manuals/9018-06099.pdf
# Measurement specifications: https://www.keysight.com/us/en/assets/9018-04769/technical-specifications/9018-04769.pdf
# The 3 GHz variation defines portable, conservative configuration limits for N9000A.
manufacturer: Keysight
model: N9000A
device_type: spectrum_analyzer
role: measurement
trace_readback:
  layout: interleaved_xy
  mode_values: [SAN, SANALYZER]
  max_points: 40001

single_sweep:
  sweep_guard: active_trace_types

rf_input:
  preamp_options: [P03, P07, P13, P26, N9000A-P03, N9000A-P07, N9000A-P13, N9000A-P26]
sweep_control: keysight
trace_setup: true
markers: keysight

scpi:
  commands:
    reset:
      template: "*RST"
    clear:
      template: "*CLS"
    opc:
      template: "*OPC"
    set_center_frequency:
      template: "FREQ:CENT {frequency}"
      validators:
        frequency: {min: 9000, max: 3e9}
    set_span:
      template: "FREQ:SPAN {span}"
      validators:
        span: {min: 0, max: 3e9}
    set_rbw:
      template: "BAND {bandwidth}"
      validators:
        bandwidth: {min: 1, max: 1e6}
    set_vbw:
      template: "BAND:VID {bandwidth}"
      validators:
        bandwidth: {min: 1, max: 1e6}
    set_sweep_points:
      template: "SWE:POIN {points}"
      validators:
        points: {min: 1, max: 40001}
    initiate_single:
      template: "INIT:IMM"
    select_normal_view:
      template: "DISP:VIEW NORM"
    set_reference_level: {template: "DISP:WIND:TRAC:Y:RLEV {value}DBM"}
    set_attenuation: {template: "POW:ATT {value}"}
    set_attenuation_auto: {template: "POW:ATT:AUTO {value}"}
    set_preamp: {template: "POW:GAIN:STAT {value}"}
    set_sweep_time: {template: "SWE:TIME {value}"}
    set_sweep_time_auto: {template: "SWE:TIME:AUTO {value}"}
    set_trigger_source: {template: "TRIG:SOUR {value}"}
    set_continuous: {template: "INIT:CONT {value}"}
    set_trace_mode: {template: "TRAC{channel}:TYPE {value}"}
    set_detector: {template: "DET:TRAC{channel} {value}"}
    set_detector_auto: {template: "DET:TRAC{channel}:AUTO {value}"}
    set_accumulation_count: {template: "AVER:COUN {value}"}
    activate_marker: {template: "CALC:MARK{marker}:MODE POS"}
    assign_marker: {template: "CALC:MARK{marker}:TRAC {channel}"}
    position_marker: {template: "CALC:MARK{marker}:X {frequency}HZ"}
    peak_marker: {template: "CALC:MARK{marker}:MAX"}
    next_marker: {template: "CALC:MARK{marker}:MAX:NEXT"}
    disable_marker_function: {template: "CALC:MARK{marker}:FUNC OFF"}
    frequency_marker_readout: {template: "CALC:MARK{marker}:X:READ FREQ"}
    set_channel_power_setting: {template: "CHP:BAND:INT {value}"}
    initiate_channel_power: {template: "INIT:CHP"}
    set_occupied_bandwidth_setting: {template: "OBW:PERC {value}"}
    initiate_occupied_bandwidth: {template: "INIT:OBW"}
    set_acp_carrier_bandwidth_hz: {template: "ACP:CARR:LIST:BAND:INT {value}"}
    set_acp_adjacent_bandwidth_hz: {template: "ACP:OFFS:LIST:BAND:INT {value}"}
    set_acp_spacing_hz: {template: "ACP:OFFS:LIST:FREQ {value}"}
    initiate_acp: {template: "INIT:ACP"}
    set_external_level: {template: "TRIG:EXT{port}:LEV {value}"}
    set_external_edge: {template: "TRIG:EXT{port}:SLOP {value}"}
    prepare_single_sweep: {template: "INIT:CONT OFF"}
    prepare_ascii_trace: {template: "FORM:DATA ASC"}
  queries:
    get_center:
      template: "FREQ:CENT?"
      response: {type: float}
    get_rbw:
      template: "BAND?"
      response: {type: float}
    get_vbw:
      template: "BAND:VID?"
      response: {type: float}
    source_mode:
      template: "INST:SOUR?"
      response: {type: str}
    normalization:
      template: "CALC:NTD?"
      response: {type: str}
    get_trace_type:
      template: "TRAC{channel}:TYPE?"
      validators:
        channel: {min: 1, max: 6}
      response: {type: str}
    trace_update:
      template: "TRAC{channel}:UPD?"
      validators:
        channel: {min: 1, max: 6}
      response: {type: str}
    trace_math:
      template: "CALC:MATH? TRACE{channel}"
      validators:
        channel: {min: 1, max: 6}
      response: {type: str}
    identify:
      template: "*IDN?"
      response: {type: str}
    get_error:
      template: "SYST:ERR?"
      response: {type: str}
    esr_query:
      template: "*ESR?"
      response: {type: str}
    trace_mode:
      template: "CONF?"
      response: {type: str}
    trace_continuous:
      template: "INIT:CONT?"
      response: {type: str}
    opc_query:
      template: "*OPC?"
      response: {type: str}
    trace_format:
      template: "FORM:DATA?"
      response: {type: str}
    trace_span:
      template: "FREQ:SPAN?"
      response: {type: float}
    trace_points:
      template: "SWE:POIN?"
      response: {type: int}
    trace_unit:
      template: "UNIT:POW?"
      response: {type: str}
    trace_data:
      template: "FETC:SAN{channel}?"
      validators:
        channel: {min: 1, max: 6}
      response: {type: csv_float}
    get_reference_level: {template: "DISP:WIND:TRAC:Y:RLEV?", response: {type: str}}
    get_attenuation: {template: "POW:ATT?", response: {type: str}}
    get_attenuation_auto: {template: "POW:ATT:AUTO?", response: {type: str}}
    get_preamp: {template: "POW:GAIN:STAT?", response: {type: str}}
    installed_options: {template: "*OPT?", response: {type: str}}
    get_sweep_time: {template: "SWE:TIME?", response: {type: str}}
    get_sweep_time_auto: {template: "SWE:TIME:AUTO?", response: {type: str}}
    get_sweep_type: {template: "SWE:TYPE?", response: {type: str}}
    get_trigger_source: {template: "TRIG:SOUR?", response: {type: str}}
    get_detector: {template: "DET:TRAC{channel}?", response: {type: str}}
    get_detector_auto: {template: "DET:TRAC{channel}:AUTO?", response: {type: str}}
    get_accumulation_count: {template: "AVER:COUN?", response: {type: str}}
    get_marker_frequency: {template: "CALC:MARK{marker}:X?", response: {type: str}}
    get_marker_amplitude: {template: "CALC:MARK{marker}:Y?", response: {type: str}}
    numeric_application: {template: "INST:NSEL?", response: {type: str}}
    get_channel_power_setting: {template: "CHP:BAND:INT?", response: {type: str}}
    get_channel_power_result: {template: "FETC:CHP:CHP?", response: {type: str}}
    channel_power_average: {template: "CHP:AVER:STAT?", response: {type: str}}
    get_occupied_bandwidth_setting: {template: "OBW:PERC?", response: {type: str}}
    get_occupied_bandwidth_result: {template: "FETC:OBW:OBW?", response: {type: str}}
    occupied_bandwidth_average: {template: "OBW:AVER:STAT?", response: {type: str}}
    get_acp_carrier_bandwidth_hz: {template: "ACP:CARR:LIST:BAND:INT?", response: {type: str}}
    get_acp_adjacent_bandwidth_hz: {template: "ACP:OFFS:LIST:BAND:INT?", response: {type: str}}
    get_acp_spacing_hz: {template: "ACP:OFFS:LIST:FREQ?", response: {type: str}}
    get_acp_result: {template: "FETC:ACP?", response: {type: str}}
    acp_span: {template: "ACP:FREQ:SPAN?", response: {type: str}}
    acp_carrier_count: {template: "ACP:CARR:COUN?", response: {type: str}}
    acp_averaging: {template: "ACP:AVER:STAT?", response: {type: str}}
    acp_radio_standard: {template: "RAD:STAN?", response: {type: str}}
    acp_reference_type: {template: "ACP:TYPE?", response: {type: str}}
    acp_power_reference: {template: "ACP:CARR:PREF:TYPE?", response: {type: str}}
    acp_method: {template: "ACP:METH?", response: {type: str}}
    acp_offset_enabled: {template: "ACP:OFFS:LIST:STAT?", response: {type: str}}
    acp_offset_side: {template: "ACP:OFFS:LIST:SIDE?", response: {type: str}}
    acp_offset_type: {template: "ACP:OFFS:TYPE?", response: {type: str}}
    get_external_level: {template: "TRIG:EXT{port}:LEV?", response: {type: str}}
    get_external_edge: {template: "TRIG:EXT{port}:SLOP?", response: {type: str}}
    prepare_operation_condition: {template: "STAT:OPER:COND?", response: {type: str}}

operation_options:
  operations:
    configure_measurement:
      transport:
        set_center_frequency: set_center_frequency
        set_span: set_span
        set_rbw: set_rbw
        set_vbw: set_vbw
        set_sweep_points: set_sweep_points
      parameters:
        span:
          kind: range
          unit: Hz
          min: 0
          max: 3e9
          bindings:
          - alias: set_span
            parameter: span
        rbw:
          kind: range
          unit: Hz
          min: 1
          max: 1e6
          bindings:
          - alias: set_rbw
            parameter: bandwidth
        center_freq:
          kind: range
          unit: Hz
          min: 9000
          max: 3e9
          bindings:
          - alias: set_center_frequency
            parameter: frequency
        vbw:
          kind: range
          min: 1
          max: 1e6
          unit: Hz
          bindings:
          - alias: set_vbw
            parameter: bandwidth
        sweep_points:
          kind: range
          integer: true
          min: 1
          max: 40001
          bindings:
          - alias: set_sweep_points
            parameter: points
    get_sweep_settings:
      transport:
        trace_mode: trace_mode
        center: get_center
        trace_span: trace_span
        rbw: get_rbw
        vbw: get_vbw
        trace_points: trace_points
        trace_unit: trace_unit
    acquire_trace:
      transport:
        accumulation_count: get_accumulation_count
        initiate: initiate_single
        trace_mode: trace_mode
        error_queue: get_error
        trace_type: get_trace_type
        source_mode: source_mode
        normalization: normalization
        normal_view: select_normal_view
        trace_update: trace_update
        trace_math: trace_math
      parameters:
        accumulation_count:
          kind: range
          min: 2
          max: 10000
          integer: true
          required: false
          transport_parameter: false
        timeout_ms:
          kind: range
          min: 1
          max: 3600000
          integer: true
          unit: ms
          required: false
          default: 10000
          transport_parameter: false
        channel:
          kind: range
          integer: true
          min: 1
          max: 6
          bindings:
          - alias: trace_type
            parameter: channel
          - alias: trace_update
            parameter: channel
          - alias: trace_math
            parameter: channel
    get_trace:
      transport:
        trace_mode: trace_mode
        trace_continuous: trace_continuous
        trace_complete: opc_query
        trace_format: trace_format
        trace_span: trace_span
        trace_points: trace_points
        trace_unit: trace_unit
        trace_data: trace_data
      parameters:
        channel:
          kind: range
          integer: true
          min: 1
          max: 6
          bindings:
          - alias: trace_data
            parameter: channel
    configure_rf_input:
      transport:
        set_reference_level: set_reference_level
        set_attenuation: set_attenuation
        set_attenuation_auto: set_attenuation_auto
        set_preamp: set_preamp
        unit: trace_unit
        preamp_options: installed_options
      parameters:
        reference_level_dbm:
          kind: range
          required: false
          min: -100
          max: 30
          unit: dBm
          bindings:
          - alias: set_reference_level
            parameter: value
        attenuation_db:
          kind: range
          required: false
          min: 0
          max: 60
          unit: dB
          bindings:
          - alias: set_attenuation
            parameter: value
        attenuation_auto:
          kind: bool
          required: false
          options:
          - value: true
            transport:
              value: 'ON'
          - value: false
            transport:
              value: 'OFF'
          bindings:
          - alias: set_attenuation_auto
            parameter: value
        preamp:
          kind: bool
          required: false
          options:
          - value: true
            transport:
              value: 'ON'
          - value: false
            transport:
              value: 'OFF'
          bindings:
          - alias: set_preamp
            parameter: value
    get_rf_input:
      transport:
        trace_mode: trace_mode
        error_queue: get_error
        unit: trace_unit
        reference_level: get_reference_level
        attenuation: get_attenuation
        attenuation_auto: get_attenuation_auto
        preamp_options: installed_options
        preamp: get_preamp
    configure_sweep_control:
      transport:
        span: trace_span
        sweep_type: get_sweep_type
        set_sweep_time: set_sweep_time
        set_sweep_time_auto: set_sweep_time_auto
        set_trigger_source: set_trigger_source
        set_continuous: set_continuous
      parameters:
        sweep_time_s:
          kind: range
          required: false
          min: 1.0e-06
          max: 4000
          unit: s
          bindings:
          - alias: set_sweep_time
            parameter: value
        sweep_time_auto:
          kind: bool
          required: false
          options:
          - value: true
            transport:
              value: 'ON'
          - value: false
            transport:
              value: 'OFF'
          bindings:
          - alias: set_sweep_time_auto
            parameter: value
        trigger_source:
          kind: enum
          required: false
          options:
          - value: free_run
            transport:
              value: IMM
            aliases:
            - IMMEDIATE
          - value: external_1
            transport:
              value: EXT1
            aliases:
            - EXTERNAL1
          - value: external_2
            supported: false
            reason: The N9000A CXA has only the Trigger 1 input.
            transport:
              value: EXT2
            aliases:
            - EXTERNAL2
          - value: video
            transport:
              value: VID
            aliases:
            - VIDEO
          - value: rf_burst
            transport:
              value: RFB
            aliases:
            - RFBURST
          - value: if_power
            transport:
              value: IF
            aliases: []
          bindings:
          - alias: set_trigger_source
            parameter: value
        continuous:
          kind: bool
          required: false
          options:
          - value: true
            transport:
              value: 'ON'
          - value: false
            transport:
              value: 'OFF'
          bindings:
          - alias: set_continuous
            parameter: value
    get_sweep_control:
      transport:
        trace_mode: trace_mode
        error_queue: get_error
        span: trace_span
        sweep_type: get_sweep_type
        sweep_time: get_sweep_time
        sweep_time_auto: get_sweep_time_auto
        trigger_source: get_trigger_source
        continuous: trace_continuous
    configure_trace:
      transport:
        set_trace_mode: set_trace_mode
        set_detector: set_detector
        set_detector_auto: set_detector_auto
        set_accumulation_count: set_accumulation_count
      parameters:
        channel:
          kind: range
          integer: true
          min: 1
          max: 6
          bindings:
          - alias: set_trace_mode
            parameter: channel
          - alias: set_detector
            parameter: channel
          - alias: set_detector_auto
            parameter: channel
        mode:
          kind: enum
          required: false
          options:
          - value: clear_write
            transport:
              value: WRIT
            aliases:
            - WRITE
          - value: average
            transport:
              value: AVER
            aliases:
            - AVERAGE
          - value: max_hold
            transport:
              value: MAXH
            aliases:
            - MAXHOLD
          - value: min_hold
            transport:
              value: MINH
            aliases:
            - MINHOLD
          bindings:
          - alias: set_trace_mode
            parameter: value
        detector:
          kind: enum
          required: false
          options:
          - value: auto_peak
            transport:
              value: NORM
            aliases:
            - NORMAL
          - value: positive_peak
            transport:
              value: POS
            aliases:
            - POSITIVE
          - value: negative_peak
            transport:
              value: NEG
            aliases:
            - NEGATIVE
          - value: sample
            transport:
              value: SAMP
            aliases:
            - SAMPLE
          - value: average
            transport:
              value: AVER
            aliases:
            - AVERAGE
          bindings:
          - alias: set_detector
            parameter: value
        detector_auto:
          kind: bool
          required: false
          options:
          - value: true
            transport:
              value: 'ON'
          - value: false
            transport:
              value: 'OFF'
          bindings:
          - alias: set_detector_auto
            parameter: value
        accumulation_count:
          kind: range
          required: false
          min: 1
          max: 10000
          integer: true
          bindings:
          - alias: set_accumulation_count
            parameter: value
    get_trace_settings:
      transport:
        trace_mode: trace_mode
        error_queue: get_error
        trace_type: get_trace_type
        detector: get_detector
        detector_auto: get_detector_auto
        count: get_accumulation_count
        updating: trace_update
      parameters:
        channel:
          kind: range
          integer: true
          min: 1
          max: 6
          bindings:
          - alias: trace_type
            parameter: channel
          - alias: detector
            parameter: channel
          - alias: detector_auto
            parameter: channel
          - alias: updating
            parameter: channel
    set_marker:
      transport:
        trace_mode: trace_mode
        continuous: trace_continuous
        complete: opc_query
        span: trace_span
        unit: trace_unit
        error_queue: get_error
        activate: activate_marker
        assign: assign_marker
        frequency: get_marker_frequency
        amplitude: get_marker_amplitude
        disable_function: disable_marker_function
        frequency_readout: frequency_marker_readout
        position: position_marker
      parameters:
        marker:
          kind: range
          min: 1
          max: 12
          integer: true
          bindings:
          - alias: activate
            parameter: marker
          - alias: assign
            parameter: marker
          - alias: frequency
            parameter: marker
          - alias: amplitude
            parameter: marker
          - alias: disable_function
            parameter: marker
          - alias: frequency_readout
            parameter: marker
          - alias: position
            parameter: marker
        channel:
          kind: range
          min: 1
          max: 6
          integer: true
          bindings:
          - alias: assign
            parameter: channel
        frequency_hz:
          kind: range
          min: 0
          max: 3000000000.0
          unit: Hz
          bindings:
          - alias: position
            parameter: frequency
    find_marker_peak:
      transport:
        trace_mode: trace_mode
        continuous: trace_continuous
        complete: opc_query
        span: trace_span
        unit: trace_unit
        error_queue: get_error
        activate: activate_marker
        assign: assign_marker
        frequency: get_marker_frequency
        amplitude: get_marker_amplitude
        disable_function: disable_marker_function
        frequency_readout: frequency_marker_readout
        peak: peak_marker
        next: next_marker
      parameters:
        marker:
          kind: range
          min: 1
          max: 12
          integer: true
          bindings:
          - alias: activate
            parameter: marker
          - alias: assign
            parameter: marker
          - alias: frequency
            parameter: marker
          - alias: amplitude
            parameter: marker
          - alias: disable_function
            parameter: marker
          - alias: frequency_readout
            parameter: marker
          - alias: peak
            parameter: marker
          - alias: next
            parameter: marker
        channel:
          kind: range
          min: 1
          max: 6
          integer: true
          bindings:
          - alias: assign
            parameter: channel
    measure_marker_delta:
      transport:
        trace_mode: trace_mode
        continuous: trace_continuous
        complete: opc_query
        span: trace_span
        unit: trace_unit
        error_queue: get_error
      parameters:
        reference_marker:
          kind: range
          integer: true
          min: 1
          max: 12
          transport_parameter: false
        marker:
          kind: range
          integer: true
          min: 1
          max: 12
          transport_parameter: false
        channel:
          kind: range
          integer: true
          min: 1
          max: 6
          transport_parameter: false
        reference_hz:
          kind: range
          min: 0
          max: 3000000000.0
          unit: Hz
          transport_parameter: false
        target_hz:
          kind: range
          min: 0
          max: 3000000000.0
          unit: Hz
          transport_parameter: false
    measure_channel_power:
      transport:
        trace_mode: trace_mode
        continuous: trace_continuous
        complete: opc_query
        error_queue: get_error
        source_mode: source_mode
        application: numeric_application
        setting: get_channel_power_setting
        result: get_channel_power_result
        set_setting: set_channel_power_setting
        initiate: initiate_channel_power
        averaging: channel_power_average
      parameters:
        bandwidth_hz:
          kind: range
          min: 100
          max: 100000000.0
          unit: Hz
          required: false
          bindings:
          - alias: set_setting
            parameter: value
        timeout_ms:
          kind: range
          min: 1
          max: 3600000
          unit: ms
          integer: true
          required: false
          default: 10000
          transport_parameter: false
    measure_occupied_bandwidth:
      transport:
        trace_mode: trace_mode
        continuous: trace_continuous
        complete: opc_query
        error_queue: get_error
        source_mode: source_mode
        application: numeric_application
        setting: get_occupied_bandwidth_setting
        result: get_occupied_bandwidth_result
        set_setting: set_occupied_bandwidth_setting
        initiate: initiate_occupied_bandwidth
        averaging: occupied_bandwidth_average
      parameters:
        power_percent:
          kind: range
          min: 10
          max: 99.9
          unit: '%'
          required: false
          bindings:
          - alias: set_setting
            parameter: value
        timeout_ms:
          kind: range
          min: 1
          max: 3600000
          unit: ms
          integer: true
          required: false
          default: 10000
          transport_parameter: false
    measure_adjacent_channel_power:
      transport:
        trace_mode: trace_mode
        source_mode: source_mode
        error_queue: get_error
        continuous: trace_continuous
        complete: opc_query
        result: get_acp_result
        initiate: initiate_acp
        span: acp_span
        carrier_count: acp_carrier_count
        application: numeric_application
        averaging: acp_averaging
        radio_standard: acp_radio_standard
        reference_type: acp_reference_type
        power_reference: acp_power_reference
        method: acp_method
        offset_enabled: acp_offset_enabled
        offset_side: acp_offset_side
        offset_type: acp_offset_type
        carrier_bandwidth_hz: get_acp_carrier_bandwidth_hz
        set_carrier_bandwidth_hz: set_acp_carrier_bandwidth_hz
        adjacent_bandwidth_hz: get_acp_adjacent_bandwidth_hz
        set_adjacent_bandwidth_hz: set_acp_adjacent_bandwidth_hz
        spacing_hz: get_acp_spacing_hz
        set_spacing_hz: set_acp_spacing_hz
      parameters:
        carrier_bandwidth_hz:
          kind: range
          min: 100
          max: 100000000.0
          unit: Hz
          required: false
          bindings:
          - alias: set_carrier_bandwidth_hz
            parameter: value
        adjacent_bandwidth_hz:
          kind: range
          min: 100
          max: 100000000.0
          unit: Hz
          required: false
          bindings:
          - alias: set_adjacent_bandwidth_hz
            parameter: value
        spacing_hz:
          kind: range
          min: 100
          max: 100000000.0
          unit: Hz
          required: false
          bindings:
          - alias: set_spacing_hz
            parameter: value
        timeout_ms:
          kind: range
          min: 1
          max: 3600000
          unit: ms
          integer: true
          required: false
          default: 10000
          transport_parameter: false
