manufacturer: Keysight
model: EDU33212A
device_type: waveform_generator
role: stimulus
channels:
    - description: Channel 1
      offset_range:
          min_val: -10
          max_val: 10
          special_values: [MIN, MAX, DEF]
      amplitude_range:
          min_val: 1.e-3
          max_val: 20
          special_values: [MIN, MAX, DEF]
          accuracy:
              model: linear
              reading_percent: 2.0
              source: Keysight EDU33212A specifications
      frequency_range:
          min_val: 1.e-6
          max_val: 20.e+6
          special_values: [MIN, MAX, DEF]
          accuracy:
              model: linear
              reading_ppm: 1.0
              source: Keysight EDU33212A specifications
    - description: Channel 2
      offset_range:
          min_val: -10
          max_val: 10
          special_values: [MIN, MAX, DEF]
      amplitude_range:
          min_val: 1.e-3
          max_val: 20
          special_values: [MIN, MAX, DEF]
          accuracy:
              model: linear
              reading_percent: 2.0
              source: Keysight EDU33212A specifications
      frequency_range:
          min_val: 1.e-6
          max_val: 20.e+6
          special_values: [MIN, MAX, DEF]
          accuracy:
              model: linear
              reading_ppm: 1.0
              source: Keysight EDU33212A specifications
waveforms:
    built_in:
        - SIN
        - SQU
        - RAMP
        - PULS
        - NOIS
        - PRBS
        - DC
        # - CARdiac
        # - exponential_fall
        # - exponential_rise
        # - gaussian_pulse
        # - haversine
        # - lorentz
        # - dlorentz
    arbitrary:
        memory: 8.e+6
        max_length: 1.e+6
        sampling_rate:
            min_val: 1.e+3
            max_val: 1.e+6
        resolution: 16

scpi:
    commands:
        identify:
            template: "*IDN?"
        reset:
            template: "*RST"
        clear:
            template: "*CLS"
        opc:
            template: "*OPC"
        panel_lock:
            template: "SYSTem:LOCK"
        panel_local:
            template: "SYSTem:LOCal"
        set_function:
            template: "SOUR{channel}:FUNC {function}"
            defaults: { channel: 1 }
            validators:
                channel: { min: 1, max: 2 }

            parameters:
                function:
                    kind: enum
                    strict: true
                    description: Built-in waveform function SCPI token.
                    choices:
                      - value: sine
                        token: SIN
                        label: Sine
                        aliases: [sin, sinusoid]
                      - value: square
                        token: SQU
                        label: Square
                        aliases: [squ]
                      - value: ramp
                        token: RAMP
                        label: Ramp
                        aliases: []
                      - value: pulse
                        token: PULS
                        label: Pulse
                        aliases: [puls]
                      - value: noise
                        token: NOIS
                        label: Noise
                        aliases: [nois]
                      - value: prbs
                        token: PRBS
                        label: PRBS
                        aliases: []
                      - value: dc
                        token: DC
                        label: DC
                        aliases: []
                      - value: arbitrary
                        token: ARB
                        label: Arbitrary
                        aliases: [arb]
        set_frequency:
            template: "SOUR{channel}:FREQ {frequency}"
            defaults: { channel: 1 }
            validators:
                channel: { min: 1, max: 2 }

            parameters:
                frequency:
                    kind: raw
                    allow_raw: true
                    description: Output frequency numeric value in Hz.
                    examples: [1000]
        set_amplitude:
            template: "SOUR{channel}:VOLTage {amplitude}"
            defaults: { channel: 1 }
            validators:
                channel: { min: 1, max: 2 }

            parameters:
                amplitude:
                    kind: raw
                    allow_raw: true
                    description: Output amplitude numeric value.
                    examples: [1.0]
        set_offset:
            template: "SOUR{channel}:VOLTage:OFFSet {offset}"
            defaults: { channel: 1 }
            validators:
                channel: { min: 1, max: 2 }

            parameters:
                offset:
                    kind: raw
                    allow_raw: true
                    description: Output DC offset numeric value.
                    examples: [0]
        apply_waveform_settings:
            template: "SOUR{channel}:APPLy:{function} {frequency},{amplitude},{offset}"
            defaults: { channel: 1 }
            validators:
                channel: { min: 1, max: 2 }
            parameters:
                function:
                    kind: enum
                    strict: true
                    description: Applied waveform function selected by the profile.
                    choices:
                      - { value: sine, token: SINusoid, label: Sine, aliases: [sin, sinusoid] }
                      - { value: square, token: SQUare, label: Square, aliases: [squ] }
                      - { value: ramp, token: RAMP, label: Ramp, aliases: [] }
                      - { value: pulse, token: PULSe, label: Pulse, aliases: [puls] }
                      - { value: noise, token: NOISe, label: Noise, aliases: [nois] }
                      - { value: arbitrary, token: ARBitrary, label: Arbitrary, aliases: [arb] }
                      - { value: dc, token: DC, label: DC, aliases: [] }
                frequency:
                    kind: raw
                    allow_raw: true
                    examples: [1000]
                amplitude:
                    kind: raw
                    allow_raw: true
                    examples: [1]
                offset:
                    kind: raw
                    allow_raw: true
                    examples: [0]
        set_square_duty_cycle:
            template: "SOUR{channel}:FUNC:SQUare:DCYCle {duty_cycle}"
            defaults: {channel: 1}
            validators: {channel: {min: 1, max: 2}}
            parameters: {duty_cycle: {kind: raw, allow_raw: true, description: "Numeric percent; vendor-specific limits are not specified here.", examples: [50]}}
        set_ramp_symmetry:
            template: "SOUR{channel}:FUNC:RAMP:SYMMetry {symmetry}"
            defaults: {channel: 1}
            validators: {channel: {min: 1, max: 2}}
            parameters: {symmetry: {kind: raw, allow_raw: true, description: "Numeric percent; vendor-specific limits are not specified here.", examples: [50]}}
        set_pulse_period:
            template: "SOUR{channel}:FUNC:PULS:PERiod {period}"
            defaults: {channel: 1}
            validators: {channel: {min: 1, max: 2}}
            parameters: {period: {kind: raw, allow_raw: true, description: "Numeric seconds; vendor-specific limits are not specified here.", examples: [0.001]}}
        set_pulse_width:
            template: "SOUR{channel}:FUNC:PULS:WIDTh {width}"
            defaults: {channel: 1}
            validators: {channel: {min: 1, max: 2}}
            parameters: {width: {kind: raw, allow_raw: true, description: "Numeric seconds; vendor-specific limits are not specified here.", examples: [0.0001]}}
        set_pulse_duty_cycle:
            template: "SOUR{channel}:FUNC:PULS:DCYCle {duty_cycle}"
            defaults: {channel: 1}
            validators: {channel: {min: 1, max: 2}}
            parameters: {duty_cycle: {kind: raw, allow_raw: true, description: "Numeric percent; vendor-specific limits are not specified here.", examples: [50]}}
        set_pulse_transition_both:
            template: "SOUR{channel}:FUNC:PULS:TRANsition:BOTH {transition_both}"
            defaults: {channel: 1}
            validators: {channel: {min: 1, max: 2}}
            parameters: {transition_both: {kind: raw, allow_raw: true, description: "Numeric seconds; vendor-specific limits are not specified here.", examples: [0.000001]}}
        set_phase:
            template: "SOUR{channel}:PHASe {phase}"
            defaults: {channel: 1}
            validators: {channel: {min: 1, max: 2}}
            parameters: {phase: {kind: raw, allow_raw: true, description: "Numeric phase in the current instrument angle unit; vendor-specific limits are not specified here.", examples: [0]}}
        set_output_state:
            template: "OUTPut{channel}:STATe {state}"
            defaults: { channel: 1 }
            validators:
                channel: { min: 1, max: 2 }
            parameters:
                state:
                    kind: enum
                    strict: true
                    choices:
                      - {value: "on", token: "ON", label: "On", aliases: ["true", "1"]}
                      - {value: "off", token: "OFF", label: "Off", aliases: ["false", "0"]}
        set_output_load_impedance:
            template: "OUTPut{channel}:LOAD {impedance}"
            defaults: { channel: 1 }
            validators:
                channel: { min: 1, max: 2 }
            parameters:
                impedance:
                    kind: raw
                    allow_raw: true
                    examples: [50]

        set_phase_reference:
            template: "SOUR{channel}:PHASe:REFerence"
            defaults: { channel: 1 }
        synchronize_phase_all_channels:
            template: "PHASe:SYNChronize"
        set_phase_unlock_error_state:
            template: "SOUR{channel}:PHASe:UNLock:ERRor:STATe {state}"
            defaults: { channel: 1, state: ON }
        set_output_polarity:
            template: "OUTPut{channel}:POLarity {polarity}"
            defaults: { channel: 1, polarity: NORM }
            parameters:
                polarity:
                    kind: enum
                    choices:
                      - {value: normal, token: NORMal, label: Normal, aliases: [norm]}
                      - {value: inverted, token: INVerted, label: Inverted, aliases: [inv]}
        set_voltage_unit:
            template: "SOUR{channel}:VOLTage:UNIT {unit}"
            defaults: { channel: 1, unit: VPP }
            parameters:
                unit:
                    kind: enum
                    choices:
                      - {value: vpp, token: VPP, label: Vpp, aliases: [peak_to_peak]}
                      - {value: vrms, token: VRMS, label: Vrms, aliases: [rms]}
                      - {value: dbm, token: DBM, label: dBm, aliases: []}
        set_voltage_limits_state:
            template: "SOUR{channel}:VOLTage:LIMit:STATe {state}"
            defaults: { channel: 1, state: ON }
        set_voltage_limit_high:
            template: "SOUR{channel}:VOLTage:LIMit:HIGH {voltage}"
            defaults: { channel: 1, voltage: 1.0 }
        set_voltage_limit_low:
            template: "SOUR{channel}:VOLTage:LIMit:LOW {voltage}"
            defaults: { channel: 1, voltage: 0.0 }
        set_voltage_autorange_state:
            template: "SOUR{channel}:VOLTage:RANGe:AUTO {state}"
            defaults: { channel: 1, state: ON }
        set_sync_output_state:
            template: "OUTPut:SYNC:STATe {state}"
            defaults: { state: ON }
        set_sync_output_mode:
            template: "OUTPut{channel}:SYNC:MODE {mode}"
            defaults: { channel: 1, mode: NORM }
            parameters:
                mode:
                    kind: enum
                    choices:
                      - {value: normal, token: NORMal, label: Normal, aliases: [norm]}
                      - {value: carrier, token: CARRier, label: Carrier, aliases: [carr]}
                      - {value: marker, token: MARKer, label: Marker, aliases: [mark]}
        set_sync_output_polarity:
            template: "OUTPut{channel}:SYNC:POLarity {polarity}"
            defaults: { channel: 1, polarity: NORM }
            parameters:
                polarity:
                    kind: enum
                    choices:
                      - {value: normal, token: NORMal, label: Normal, aliases: [norm]}
                      - {value: inverted, token: INVerted, label: Inverted, aliases: [inv]}
        set_sync_output_source:
            template: "OUTPut:SYNC:SOURce CH{channel}"
            defaults: { channel: 1 }
        select_arbitrary_waveform:
            template: "SOUR{channel}:FUNC:ARBitrary {arb_name}"
            defaults: { channel: 1, arb_name: TEST }
        set_arbitrary_waveform_sample_rate:
            template: "SOUR{channel}:FUNC:ARB:SRATe {sample_rate}"
            defaults: { channel: 1, sample_rate: 1000 }
        clear_volatile_arbitrary_waveforms:
            template: "SOUR{channel}:DATA:VOLatile:CLEar"
            defaults: { channel: 1 }
        enable_modulation:
            template: "SOUR{channel}:{mod_type}:STATe {state}"
            defaults: { channel: 1, mod_type: AM, state: ON }
        set_am_depth:
            template: "SOUR{channel}:AM:DEPTh {depth}"
            defaults: { channel: 1, depth: 50 }
        set_am_source:
            template: "SOUR{channel}:AM:SOURce {source}"
            defaults: { channel: 1, source: INT }
        set_fm_deviation:
            template: "SOUR{channel}:FM:DEViation {deviation}"
            defaults: { channel: 1, deviation: 1000 }
        enable_sweep:
            template: "SOUR{channel}:SWEep:STATe {state}"
            defaults: { channel: 1, state: ON }
        set_sweep_time:
            template: "SOUR{channel}:SWEep:TIME {time}"
            defaults: { channel: 1, time: 1.0 }
        set_sweep_start_frequency:
            template: "SOUR{channel}:FREQuency:STARt {frequency}"
            defaults: { channel: 1, frequency: 1000 }
        set_sweep_stop_frequency:
            template: "SOUR{channel}:FREQuency:STOP {frequency}"
            defaults: { channel: 1, frequency: 2000 }
        set_sweep_spacing:
            template: "SOUR{channel}:SWEep:SPACing {spacing}"
            defaults: { channel: 1, spacing: LIN }
            parameters:
                spacing:
                    kind: enum
                    choices:
                      - {value: linear, token: LINear, label: Linear, aliases: [lin]}
                      - {value: logarithmic, token: LOGarithmic, label: Logarithmic, aliases: [log]}
        enable_burst:
            template: "SOUR{channel}:BURSt:STATe {state}"
            defaults: { channel: 1, state: ON }
        set_burst_mode:
            template: "SOUR{channel}:BURSt:MODE {mode}"
            defaults: { channel: 1, mode: TRIG }
            parameters:
                mode:
                    kind: enum
                    choices:
                      - {value: triggered, token: TRIGgered, label: Triggered, aliases: [trig]}
                      - {value: gated, token: GATed, label: Gated, aliases: [gate]}
        set_burst_cycles:
            template: "SOUR{channel}:BURSt:NCYCles {cycles}"
            defaults: { channel: 1, cycles: 1 }
        set_burst_period:
            template: "SOUR{channel}:BURSt:INTernal:PERiod {period}"
            defaults: { channel: 1, period: 1.0 }
        set_trigger_source:
            template: "TRIGger{channel}:SOURce {source}"
            defaults: { channel: 1 }
            parameters:
                source:
                    kind: enum
                    choices:
                      - {value: immediate, token: IMMediate, label: Immediate, aliases: [imm]}
                      - {value: external, token: EXTernal, label: External, aliases: [ext]}
                      - {value: timer, token: TIMer, label: Timer, aliases: [tim]}
                      - {value: bus, token: BUS, label: Bus, aliases: []}
        set_trigger_slope:
            template: "TRIGger{channel}:SLOPe {slope}"
            defaults: { channel: 1 }
            parameters:
                slope:
                    kind: enum
                    choices:
                      - {value: positive, token: POSitive, label: Positive, aliases: [pos]}
                      - {value: negative, token: NEGative, label: Negative, aliases: [neg]}
                      - {value: either, token: EITHer, label: Either, aliases: [eith]}
                      - {value: alternating, token: ALTernating, label: Alternating, aliases: [alt]}
        trigger_now:
            template: "TRIGger{channel}"
            defaults: { channel: 1 }
        trigger_now_global:
            template: "*TRG"
        set_angle_unit:
            template: "UNIT:ANGLe {unit}"
            defaults: { unit: DEGREE }
        set_dual_arbitrary_format:
            template: "SOUR{channel}:DATA:{node}:FORMat {format}"
            defaults: { channel: 1, node: ARBitrary2, format: AABB }
        binary_arbitrary_prefix:
            template: "SOUR{channel}:DATA:{node}{suffix} {arb_name},"
            defaults: { channel: 1, node: ARBitrary, suffix: ":DAC", arb_name: TEST }
        download_arbitrary_waveform_data_csv:
            template: "SOUR{channel}:DATA:ARBitrary{data_type} {arb_name},{formatted_data}"
            defaults: { channel: 1 }
            validators:
                channel: { min: 1, max: 2 }
            parameters:
                data_type:
                    kind: enum
                    strict: true
                    choices:
                      - { value: dac, token: ":DAC", label: DAC, aliases: [DAC] }
                      - { value: norm, token: "", label: Normalized, aliases: [NORM, normalized] }
                arb_name:
                    kind: raw
                    allow_raw: true
                    examples: [ARB1]
                formatted_data:
                    kind: raw
                    allow_raw: true
                    examples: ["0,0"]
        list_directory:
            template: "MMEMory:CATalog:ALL?{path}"
            defaults: { path: "INT:" }
        delete_file_or_folder:
            template: "MMEMory:DELete {path}"
            defaults: { path: "INT:/TEST" }

    queries:
        opc_query:
            template: "*OPC?"
        esr_query:
            template: "*ESR?"
        get_error:
            template: "SYSTem:ERRor?"
        self_test:
            template: "*TST?"
            response:
                type: int
        get_angle_unit:
            template: "UNIT:ANGLe?"
            response:
                type: str
        get_function:
            template: "SOUR{channel}:FUNC?"
            defaults: { channel: 1 }
            validators:
                channel: { min: 1, max: 2 }
            response:
                type: str

        get_frequency:
            template: "SOUR{channel}:FREQ?"
            defaults: { channel: 1 }
            validators:
                channel: { min: 1, max: 2 }
            response:
                type: float

        get_amplitude:
            template: "SOUR{channel}:VOLTage?"
            defaults: { channel: 1 }
            validators:
                channel: { min: 1, max: 2 }
            response:
                type: float

        get_offset:
            template: "SOUR{channel}:VOLTage:OFFSet?"
            defaults: { channel: 1 }
            validators:
                channel: { min: 1, max: 2 }
            response:
                type: float

        get_output_state:
            template: "OUTPut{channel}:STATe?"
            defaults: { channel: 1 }
            validators:
                channel: { min: 1, max: 2 }
            response:
                type: str
        get_output_load_impedance:
            template: "OUTPut{channel}:LOAD?"
            defaults: { channel: 1 }
            validators:
                channel: { min: 1, max: 2 }
            response:
                type: str

        get_phase:
            template: "SOUR{channel}:PHASe?"
            defaults: { channel: 1 }
        get_phase_unlock_error_state:
            template: "SOUR{channel}:PHASe:UNLock:ERRor:STATe?"
            defaults: { channel: 1 }
        get_output_polarity:
            template: "OUTPut{channel}:POLarity?"
            defaults: { channel: 1 }
        get_voltage_unit:
            template: "SOUR{channel}:VOLTage:UNIT?"
            defaults: { channel: 1 }
        get_voltage_limits_state:
            template: "SOUR{channel}:VOLTage:LIMit:STATe?"
            defaults: { channel: 1 }
        get_voltage_limit_high:
            template: "SOUR{channel}:VOLTage:LIMit:HIGH?"
            defaults: { channel: 1 }
        get_voltage_limit_low:
            template: "SOUR{channel}:VOLTage:LIMit:LOW?"
            defaults: { channel: 1 }
        get_voltage_autorange_state:
            template: "SOUR{channel}:VOLTage:RANGe:AUTO?"
            defaults: { channel: 1 }
        get_sync_output_state:
            template: "OUTPut:SYNC:STATe?"
        get_sync_output_mode:
            template: "OUTPut{channel}:SYNC:MODE?"
            defaults: { channel: 1 }
        get_sync_output_polarity:
            template: "OUTPut{channel}:SYNC:POLarity?"
            defaults: { channel: 1 }
        get_sync_output_source:
            template: "OUTPut:SYNC:SOURce?"
        get_selected_arbitrary_waveform_name:
            template: "SOUR{channel}:FUNC:ARBitrary?"
            defaults: { channel: 1 }
        get_arbitrary_waveform_points:
            template: "SOUR{channel}:FUNC:ARB:POINts?"
            defaults: { channel: 1 }
            validators:
                channel: { min: 1, max: 2 }
            response:
                type: int
        get_arbitrary_waveform_sample_rate:
            template: "SOUR{channel}:FUNC:ARB:SRATe?"
            defaults: { channel: 1 }
        get_free_volatile_arbitrary_memory:
            template: "SOUR{channel}:DATA:VOLatile:FREE?"
            defaults: { channel: 1 }
        get_channel_configuration_summary:
            template: "SOUR{channel}:APPLy?"
            defaults: { channel: 1 }
            validators:
                channel: { min: 1, max: 2 }
            response:
                type: str
        get_pulse_duty_cycle:
            template: "SOUR{channel}:FUNC:PULS:DCYCle?"
            defaults: { channel: 1 }
        get_pulse_period:
            template: "SOUR{channel}:FUNC:PULS:PERiod?"
            defaults: { channel: 1 }
        get_pulse_width:
            template: "SOUR{channel}:FUNC:PULS:WIDTh?"
            defaults: { channel: 1 }
        get_pulse_transition_leading:
            template: "SOUR{channel}:FUNC:PULS:TRANsition:LEADing?"
            defaults: { channel: 1 }
        get_pulse_transition_trailing:
            template: "SOUR{channel}:FUNC:PULS:TRANsition:TRAiling?"
            defaults: { channel: 1 }
        get_pulse_hold_mode:
            template: "SOUR{channel}:FUNC:PULS:HOLD?"
            defaults: { channel: 1 }
        get_square_duty_cycle:
            template: "SOUR{channel}:FUNC:SQUare:DCYCle?"
            defaults: { channel: 1 }
        get_square_period:
            template: "SOUR{channel}:FUNC:SQUare:PERiod?"
            defaults: { channel: 1 }
        get_ramp_symmetry:
            template: "SOUR{channel}:FUNC:RAMP:SYMMetry?"
            defaults: { channel: 1 }

simulation:
    initial_state:
        function_ch1: SIN
        function_ch2: SIN
        frequency_ch1: 1000.0
        frequency_ch2: 1000.0
        amplitude_ch1: 1.0
        amplitude_ch2: 1.0
        offset_ch1: 0.0
        offset_ch2: 0.0
        load_ch1: 50
        load_ch2: 50
        voltage_limits_state_ch1: OFF
        voltage_limits_state_ch2: OFF
        voltage_limit_high_ch1: 10.0
        voltage_limit_high_ch2: 10.0
        voltage_limit_low_ch1: -10.0
        voltage_limit_low_ch2: -10.0
        output_ch1: OFF
        output_ch2: OFF
        polarity_ch1: NORM
        polarity_ch2: NORM
        sample_rate_ch1: 1000.0
        sample_rate_ch2: 1000.0
        waveform_ch1: { name: "", format: DAC, values: [], points: 0, csv: "" }
        waveform_ch2: { name: "", format: DAC, values: [], points: 0, csv: "" }
    scpi:
        "*IDN?": "Simulated,PyTestLab,EDU33212A-SIM,1.0"
        "*RST":
            set: { "": "" }
        "*CLS": ""
        "*OPC?": "1"
        "SOUR1:FUNC *":
            set:
                function_ch1: "$1"
        "SOUR2:FUNC *":
            set:
                function_ch2: "$1"
        "SOUR1:FUNC?":
            get: function_ch1
        "SOUR2:FUNC?":
            get: function_ch2
        "SOUR1:FREQ *":
            set:
                frequency_ch1: "$1"
        "SOUR2:FREQ *":
            set:
                frequency_ch2: "$1"
        "SOUR1:FREQ?":
            get: frequency_ch1
        "SOUR2:FREQ?":
            get: frequency_ch2
        'SOUR1:FREQ\? MINimum': "1.0e-6"
        'SOUR1:FREQ\? MAXimum': "2.0e7"
        'SOUR2:FREQ\? MINimum': "1.0e-6"
        'SOUR2:FREQ\? MAXimum': "2.0e7"
        "SOUR1:VOLTage *":
            set:
                amplitude_ch1: "$1"
        "SOUR2:VOLTage *":
            set:
                amplitude_ch2: "$1"
        "SOUR1:VOLTage?":
            get: amplitude_ch1
        "SOUR2:VOLTage?":
            get: amplitude_ch2
        'SOUR1:VOLTage\? MINimum': "-65.879"
        'SOUR1:VOLTage\? MAXimum': "26.99"
        'SOUR2:VOLTage\? MINimum': "-65.879"
        'SOUR2:VOLTage\? MAXimum': "26.99"
        "SOUR1:VOLTage:UNIT?": "VPP"
        "SOUR2:VOLTage:UNIT?": "VPP"
        "SOUR1:VOLTage:UNIT *":
            set:
                unit_ch1: "$1"
        "SOUR2:VOLTage:UNIT *":
            set:
                unit_ch2: "$1"
        "SOUR1:VOLTage:LIMit:STATe *":
            set:
                voltage_limits_state_ch1: "$1"
        "SOUR2:VOLTage:LIMit:STATe *":
            set:
                voltage_limits_state_ch2: "$1"
        "SOUR1:VOLTage:LIMit:STATe?":
            get: voltage_limits_state_ch1
        "SOUR2:VOLTage:LIMit:STATe?":
            get: voltage_limits_state_ch2
        "SOUR1:VOLTage:LIMit:HIGH *":
            set:
                voltage_limit_high_ch1: "$1"
        "SOUR2:VOLTage:LIMit:HIGH *":
            set:
                voltage_limit_high_ch2: "$1"
        "SOUR1:VOLTage:LIMit:HIGH?":
            get: voltage_limit_high_ch1
        "SOUR2:VOLTage:LIMit:HIGH?":
            get: voltage_limit_high_ch2
        "SOUR1:VOLTage:LIMit:LOW *":
            set:
