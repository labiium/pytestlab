        ':?SOUR(?:CE)?([12]):FUNC(?:TION)?:ARB(?:ITRARY)?\?$':
            get: waveform_ch$1.name
        ':?SOUR(?:CE)?([12]):FUNC(?:TION)?:ARB(?:ITRARY)?:POIN(?:TS)?\?$':
