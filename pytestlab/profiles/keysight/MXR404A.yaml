        min: 1
        max: 4
        bindings:
        - alias: write
          parameter: channel
      bandwidth:
        kind: enum
        required: false
        constraints: *mxr_full_bandwidth_sensitivity
        options:
        - value: 20MHz
          aliases: [20M, 20E6, "20000000"]
          unit: Hz
          transport:
            value: 20e6
        - value: 200MHz
          aliases: [200M, 200E6, "200000000"]
          unit: Hz
          transport:
            value: 200e6
        - value: full
          aliases: [FULL, "OFF", "0"]
          transport:
            value: 'OFF'
        bindings:
        - alias: write
          parameter: bandwidth
  wave_generator_frequency:
    transport:
      write: wgen_set_freq
