        max: 4
      output_channel:
        kind: range
        bindings:
        - alias: output
          parameter: channel
        min: 1
        max: 4
      start_freq:
        kind: range
        bindings:
        - alias: start
          parameter: value
        min: 5.0e-08
        max: 50000000.0
      stop_freq:
        kind: range
        bindings:
        - alias: stop
          parameter: value
        min: 5.0e-08
        max: 50000000.0
      amplitude:
        kind: range
        bindings:
        - alias: amplitude
          parameter: value
        min: 0.002
        max: 10.0
      points:
        kind: range
        bindings:
        - alias: points
          parameter: value
        min: 2
        max: 1000
        required: false
        default: 10
      trace:
        kind: enum
        transport_parameter: false
        options:
        - value: none
        required: false
        default: none
      load:
        kind: enum
        bindings:
        - alias: load
          parameter: value
        options:
        - value: fifty
          transport:
            value: FIFTy
        - value: onemeg
          transport:
            value: ONEMeg
        required: false
        default: fifty
      disable_on_complete:
        kind: bool
        strict: false
        default: true
        transport_parameter: false
        required: false
        options:
        - value: true
        - value: false
  time_axis_read:
    transport:
      scale: get_timebase_scale
      position: get_timebase_position
    parameters: {}
  channel_axis_read:
    transport:
      scale: get_channel_scale
      offset: get_channel_offset
    parameters:
      channel:
        kind: range
        required: false
        min: 1
        max: 4
        bindings:
        - alias: scale
          parameter: channel
        - alias: offset
          parameter: channel
  waveform_acquisition:
    transport: {}
    parameters:
      channels:
        kind: open_string
        required: false
        transport_parameter: false
      run_after:
        kind: bool
        required: false
        default: true
        transport_parameter: false
        options:
        - value: true
        - value: false
      timebase:
        kind: range
        required: false
        transport_parameter: false
      timeout_ms:
        kind: range
        required: false
        min: 1
        transport_parameter: false
  probe_read:
    transport:
      read: probe_get
    parameters:
      channel:
        kind: range
        required: false
        min: 1
        max: 4
        bindings:
        - alias: read
          parameter: channel
  probe_write:
    transport:
      write: probe_set
    parameters:
      channel:
        kind: range
        required: false
        min: 1
        max: 4
        bindings:
        - alias: write
          parameter: channel
      scale:
        kind: range
        required: false
        bindings:
        - alias: write
          parameter: scale
  acquisition_time:
    transport:
      write: timebase_main_range
    parameters:
      time:
        kind: range
        min: 5.0e-11
        max: 200
        unit: s
        description: Full-screen duration, ten horizontal divisions (50 ps to 200 s).
        required: false
        bindings:
        - alias: write
          parameter: time
  sample_rate:
    transport:
      write: acquire_set_rate
    parameters:
      rate:
        kind: range
        required: false
        bindings:
        - alias: write
          parameter: rate
  bandwidth_limit:
    transport:
      write: channel_bandwidth
