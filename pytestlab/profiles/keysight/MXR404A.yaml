        transport_parameter: false
      freq:
        kind: range
        required: false
        transport_parameter: false
  wave_generator_ramp:
    transport: {}
    parameters:
      v0:
        kind: range
        required: false
        transport_parameter: false
      v1:
        kind: range
        required: false
        transport_parameter: false
      freq:
        kind: range
        required: false
        transport_parameter: false
      symmetry:
        kind: range
        required: false
        transport_parameter: false
  wave_generator_pulse:
    transport: {}
    parameters:
      v0:
        kind: range
        required: false
