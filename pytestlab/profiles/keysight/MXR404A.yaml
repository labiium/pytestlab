manufacturer: Keysight
model: MXR404A
device_type: oscilloscope
role: measurement
measurement_accuracy:
  waveform_ch1: &id001
    model: linear
    reading_percent: 1.0
    offset: 0.005
    offset_unit: V
    distribution: rectangular
    source: Keysight MXR404A specifications
  waveform_ch2: *id001
  waveform_ch3: *id001
  waveform_ch4: *id001
bandwidth: 4000000000.0
sampling_rate: 16000000000.0
memory: 200000000.0
waveform_update_rate: 200000.0
waveform_source_separator: ", "
fft:
  window_types:
  - RECTangular
  - HANNing
  - FLATtop
  - BHARris
  - HAMMing
  units:
  - DECibel
  - DB
  - DBMV
  - DBUV
  - WATT
  - VRMS
  - DBMHZ
  - WATTHZ
  - VRTHZ
function_generator:
  waveform_types:
  - SINusoid
  - SQUare
  - RAMP
  - PULSe
  - DC
  - NOISe
  - SINC
  - EXPRise
  - EXPFall
  - CARDiac
  - GAUSsian
  - PRBS
  - ARBitrary
  supported_states:
  - Normal
  - Single shot
  offset:
    min_val: -8.0
    max_val: 8.0
  frequency:
    min_val: 5.0e-8
    max_val: 50000000.0
  amplitude:
    min_val: 0.002
    max_val: 10.0
franalysis:
  sweep_points:
    min_val: 1
    max_val: 1000
  load:
  - FIFTy
  - ONEMeg
  trace:
  - GAIN
  - PHASe
  mode:
  - SWEep
  - SINGle
trigger:
  sources:
    channel_1: CHANnel1
    channel_2: CHANnel2
    channel_3: CHANnel3
    channel_4: CHANnel4
    external: EXTernal
    line: LINE
    wgen: WGEN
  types:
  - EDGE
  - PULSE
  - TIMEOUT
  - WINDOW
  modes:
  - EDGE
  - PULSE
  slopes:
  - POS
  - NEG
  - EITH
  level_range:
    min_val: -5
    max_val: 5
channels:
- description: Input Channel 1
  channel_range:
    min_val: -5.0
    max_val: 5.0
  input_coupling:
  - AC
  - DC
  input_impedance: 1000000.0
  probe_attenuation:
  - 1
  - 10
  - 100
  timebase:
    range:
      min_val: 5.0e-12
      max_val: 20
    horizontal_resolution: 1.0e-12
- description: Input Channel 2
  channel_range:
    min_val: -5.0
    max_val: 5.0
  input_coupling:
  - AC
  - DC
  input_impedance: 1000000.0
  probe_attenuation:
  - 1
  - 10
  - 100
  timebase:
    range:
      min_val: 5.0e-12
      max_val: 20
    horizontal_resolution: 1.0e-12
- description: Input Channel 3
  channel_range:
    min_val: -5.0
    max_val: 5.0
  input_coupling:
  - AC
  - DC
  input_impedance: 1000000.0
  probe_attenuation:
  - 1
  - 10
  - 100
  timebase:
    range:
      min_val: 5.0e-12
      max_val: 20
    horizontal_resolution: 1.0e-12
- description: Input Channel 4
  channel_range:
    min_val: -5.0
    max_val: 5.0
  input_coupling:
  - AC
  - DC
  input_impedance: 1000000.0
  probe_attenuation:
  - 1
  - 10
  - 100
  timebase:
    range:
      min_val: 5.0e-12
      max_val: 20
    horizontal_resolution: 1.0e-12
operation_options:
  run_self_test:
    transport:
      self_test: self_test
    parameters:
      timeout_ms: {kind: range, unit: ms, integer: true, min: 1, max: 600000, default: 240000, required: false, transport_parameter: false}
  reset:
    transport:
      write: reset
  channel_axis:
    transport:
      write: set_channel_axis
      scale_only: set_channel_scale
      offset_only: set_channel_offset
    context_queries:
      probe_attenuation: probe_get
      input_impedance: channel_input
      current_offset: get_channel_offset
      current_scale: get_channel_scale
    parameters:
      channel:
        kind: range
        min: 1
        max: 4
        bindings:
        - alias: write
          parameter: channel
      scale:
        kind: range
        unit: V/div
        dependencies: [probe_attenuation, input_impedance]
        multiplier_parameter: probe_attenuation
        description: >-
          Displayed probe-corrected volts per division. The 1:1 limit depends on input impedance;
          the driver multiplies both limits by the current positive finite probe
          attenuation before writing. Discovery requires current probe attenuation
          and input impedance context.
        contextual_ranges:
        - when: {input_impedance: 50}
          min: 0.001
          max: 1
        - when: {input_impedance: 1000000}
          min: 0.001
          max: 5
        bindings:
        - alias: write
          parameter: scale
      offset:
        kind: range
        unit: V
        description: >-
          Probe-corrected offset limits depend on effective scale and input impedance.
          The 50-ohm transition bands are qualified for MXR404A firmware 11.40:
          3.2 V starts at representable scale 0.122 V/div and 4 V at 0.262 V/div.
          The driver checks effective scale readback before a nonzero offset write.
        constraints:
          neutralize_offset_on_scale_change: true
        dependencies: [scale, probe_attenuation, input_impedance]
        multiplier_parameter: probe_attenuation
        contextual_ranges:
        - when:
            input_impedance: 50
            scale: {max: 0.055, multiplier_parameter: probe_attenuation}
          min: -0.8
          max: 0.8
        - when:
            input_impedance: 50
            scale: {exclusive_min: 0.055, max: 0.121, multiplier_parameter: probe_attenuation}
          min: -1.6
          max: 1.6
        - when:
            input_impedance: 50
            scale: {exclusive_min: 0.121, max: 0.261, multiplier_parameter: probe_attenuation}
          min: -3.2
          max: 3.2
        - when:
            input_impedance: 50
            scale: {exclusive_min: 0.261, multiplier_parameter: probe_attenuation}
          min: -4
          max: 4
        - when:
            input_impedance: 1000000
            scale: {exclusive_max: 0.01, multiplier_parameter: probe_attenuation}
          min: -5
          max: 5
        - when:
            input_impedance: 1000000
            scale: {min: 0.01, max: 0.2, multiplier_parameter: probe_attenuation}
          min: -20
          max: 20
        - when:
            input_impedance: 1000000
            scale: {exclusive_min: 0.2, multiplier_parameter: probe_attenuation}
          min: -40
          max: 40
        bindings:
        - alias: write
          parameter: offset
      probe_attenuation:
        kind: range
        required: false
        transport_parameter: false
        positive: true
        unit: ratio
      input_impedance:
        kind: enum
        required: false
        transport_parameter: false
        options:
        - value: 50
          aliases: [FIFTy, DC50]
        - value: 1000000
          aliases: [ONEMeg, AC, DC]
  channel_setup:
    transport:
      coupling: set_channel_coupling
      probe: probe_set
      bandwidth: channel_bandwidth
    parameters:
      channel:
        kind: range
        min: 1
        max: 4
        bindings:
        - alias: coupling
          parameter: channel
        - alias: probe
          parameter: channel
        - alias: bandwidth
          parameter: channel
      coupling:
        kind: enum
        options:
        - value: ac
          constraints: {input_impedance: 1000000}
          aliases:
          - AC
          transport:
            value: AC
        - value: dc
          constraints: {input_impedance: 1000000}
          aliases:
          - DC
          transport:
            value: DC
        - value: dc50
          aliases: [DCFifty]
          constraints: {input_impedance: 50}
          transport:
            value: DC50
        bindings:
        - alias: coupling
          parameter: coupling
      probe_attenuation:
        kind: range
        min: 0.0001
        max: 1000
        bindings:
        - alias: probe
          parameter: scale
      bandwidth_limit:
        kind: enum
        constraints: &mxr_full_bandwidth_sensitivity
          full_bandwidth_minimum_input_referred_scale:
            value: 0.003
            input_impedance: 1000000
            unit: V/div
            description: >-
              Full bandwidth requires at least 3 mV/div input-referred scale at 1 MOhm.
        options:
        - value: 20MHz
          aliases: [20M, 20E6, "20000000"]
          unit: Hz
          transport:
            value: 20e6
        - value: 200MHz
          aliases: [200M, 200E6, "200000000"]
          unit: Hz
          transport:
            value: 200e6
        - value: full
          aliases: [FULL, "OFF", "0"]
          transport:
            value: 'OFF'
        bindings:
        - alias: bandwidth
          parameter: bandwidth
  auto_scale:
    transport:
      write: auto_scale
      channel_selection_query: autoscale_channels_query
      channel_display_query: display_channel_query
  run:
    transport:
      write: run
  stop:
    transport:
      write: stop
  measure_phase:
    transport:
      read: measure_phase
    parameters:
      channel:
        kind: range
        min: 1
        max: 4
        bindings:
        - alias: read
          parameter: channel
      uncertainty:
        kind: bool
        strict: false
        default: true
        transport_parameter: false
  measure_frequency:
    transport:
      read: measure_frequency
    parameters:
      channel:
        kind: range
        min: 1
        max: 4
        bindings:
        - alias: read
          parameter: channel
      uncertainty:
        kind: bool
        strict: false
        default: true
        transport_parameter: false
  fft_display:
