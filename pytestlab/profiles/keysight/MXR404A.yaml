  fft_read:
    transport: {}
    parameters:
      channel:
        kind: range
        required: false
        min: 1
        max: 4
        transport_parameter: false
      window:
        kind: open_string
        required: false
        transport_parameter: false
      timeout_ms:
        kind: range
        required: false
        min: 1
        transport_parameter: false
scpi:
  commands:
    identify:
      template: '*IDN?'
    clear:
      template: '*CLS'
    reset:
      template: '*RST'
    opc:
      template: '*OPC'
    system_lock:
      template: :SYSTem:LOCK {state}
      parameters:
        state:
          kind: enum
          strict: true
          choices: &id002
          - token: 'ON'
            label: 'ON'
            aliases:
            - 'on'
            - 'true'
            - '1'
          - token: 'OFF'
            label: 'OFF'
            aliases:
            - 'off'
            - 'false'
            - '0'
          description: Instrument-accepted state token used for command-build smoke validation.
    header_off:
      template: :SYSTem:HEADer OFF
    auto_scale:
      template: :AUToscale
    autoscale_channels_query:
      template: :AUToscale:CHANnels?
      response:
        type: str
    run:
      template: :RUN
    stop:
      template: :STOP
    set_time_axis:
      sequence:
      - :TIMebase:SCALe {scale}
      - :TIMebase:POSition {position}
      parameters:
        scale:
          kind: raw
          allow_raw: true
          description: Horizontal timebase scale value in seconds/division.
          examples:
          - 1.0
        position:
          kind: raw
          allow_raw: true
          description: Horizontal timebase position value in seconds.
          examples:
          - 0.0
    set_channel_axis:
      sequence:
      - :CHANnel{channel}:SCALe {scale}
      - :CHANnel{channel}:OFFSet {offset}
      validators:
        channel:
          min: 1
          max: 4
      enums:
        mode:
          edge: EDGE
          pulse: PULSE
          timeout: TIMEOUT
          window: WINDOW
      parameters:
        scale:
          kind: raw
          allow_raw: true
          description: Vertical scale value for the selected channel.
          examples:
          - 1.0
        offset:
          kind: raw
          allow_raw: true
          description: Vertical offset value for the selected channel.
          examples:
          - 0.0
    set_channel_coupling:
      template: :CHANnel{channel}:INPut {coupling}
      validators:
        channel:
          min: 1
          max: 4
      parameters:
        coupling:
          kind: raw
          allow_raw: true
          description: Instrument-accepted coupling token used for command-build smoke validation.
          examples:
          - DC
    display_channel:
      template: :CHANnel{channel}:DISPlay {state}
      validators:
        channel:
          min: 1
          max: 4
      enums:
        state:
          true: 'ON'
          false: 'OFF'
          '1': 'ON'
          '0': 'OFF'
      parameters:
        state:
          kind: enum
          strict: true
          choices: *id002
          description: Instrument-accepted state token used for command-build smoke validation.
    probe_set:
      template: :CHANnel{channel}:PROBe:USER VOLTage,RATio,{scale}
      validators:
        channel:
          min: 1
          max: 4
      parameters:
        scale:
          kind: raw
          allow_raw: true
          description: Numeric scale example used for command-build smoke validation.
          examples:
          - 1.0
    set_channel_offset:
      template: :CHANnel{channel}:OFFSet {offset}
      validators:
        channel: {min: 1, max: 4}
    set_channel_scale:
      template: :CHANnel{channel}:SCALe {scale}
      validators:
        channel: {min: 1, max: 4}
    channel_bandwidth:
      template: :CHANnel{channel}:BWLimit {bandwidth}
      validators:
        channel:
          min: 1
          max: 4
      parameters:
        bandwidth:
          kind: raw
          allow_raw: true
          description: Bandwidth example in Hz used for command-build smoke validation.
          examples:
          - 20000000
    channel_bandwidth_full:
      template: :CHANnel{channel}:BWLimit OFF
      validators:
        channel:
          min: 1
          max: 4
    configure_trigger:
      sequence:
      - :TRIGger:MODE {mode}
      - :TRIGger:EDGE:SOURce {source}
      - :TRIGger:LEVel CHANnel{channel},{level}
      - :TRIGger:EDGE:SLOPe {slope}
      validators:
        channel:
          min: 1
          max: 4
      parameters:
        mode:
          kind: raw
          allow_raw: true
          description: Instrument-accepted trigger mode SCPI token.
          examples:
          - EDGE
        source:
          kind: raw
          allow_raw: true
          description: Instrument-accepted trigger source SCPI token.
          examples:
          - CHAN1
        level:
          kind: raw
          allow_raw: true
          description: Trigger level numeric value.
          examples:
          - 0.0
        slope:
          kind: raw
          allow_raw: true
          description: Instrument-accepted trigger slope SCPI token.
          examples:
          - POS
    set_trigger_coupling:
      template: :TRIGger:{mode}:COUPling {coupling}
      enums:
        mode:
          edge: EDGE
          pulse: PULSE
          timeout: TIMEOUT
          window: WINDOW
        coupling:
          ac: AC
          dc: DC
      parameters:
        coupling:
          kind: raw
          allow_raw: true
          description: Instrument-accepted coupling token used for command-build smoke validation.
          examples:
          - DC
        mode:
          kind: raw
          allow_raw: true
          description: Instrument-accepted mode token used for command-build smoke validation.
          examples:
          - EDGE
    acq_set_type:
      template: :ACQuire:AVERage {value}
      parameters:
        value:
          kind: raw
          allow_raw: true
          description: Averaging state; OFF selects normal acquisition and ON enables averaging.
          examples:
          - 'OFF'
          - 'ON'
    acq_set_mode:
      template: :ACQuire:MODE {value}
      parameters:
        value:
          kind: raw
          allow_raw: true
          description: Instrument-accepted acquisition mode SCPI token.
          examples:
          - RTIMe
    acq_set_count:
      template: :ACQuire:COUNt {count}
      parameters:
        count:
          kind: raw
          allow_raw: true
          description: Acquisition count numeric value.
          examples:
          - 1
    acquire_set_rate:
      template: :ACQuire:SRATe:ANALog {rate}
      parameters:
        rate:
          kind: raw
          allow_raw: true
          description: Sample-rate example in samples per second used for command-build smoke validation.
          examples:
          - 1000000
    timebase_main_range:
      template: :TIMebase:RANGe {time}
      parameters:
        time:
          kind: raw
          allow_raw: true
          description: Time value example in seconds used for command-build smoke validation.
          examples:
          - 0.001
    set_timebase_scale:
      template: :TIMebase:SCALe {scale}
    set_timebase_position:
      template: :TIMebase:POSition {position}
    seg_set_count:
      template: :ACQuire:SEGMented:COUNt {count}
      parameters:
        count:
          kind: raw
          allow_raw: true
          description: Integer count example used for command-build smoke validation.
          examples:
          - 1
    seg_set_index:
      template: :ACQuire:SEGMented:INDex {index}
      parameters:
        index:
          kind: raw
          allow_raw: true
          description: Integer index example used for command-build smoke validation.
          examples:
          - 1
    seg_analyze:
      template: :ACQuire:SEGMented:ANALyze
    set_wave_source:
      template: :WAVeform:SOURce {source}
      parameters:
        source:
          kind: raw
          allow_raw: true
          description: Instrument-accepted waveform source SCPI token.
          examples:
          - CHAN1
    set_wave_points_max:
      template: :ACQuire:POINts:ANALog MAX
    set_acquisition_points:
      template: :ACQuire:POINts:ANALog {points}
      parameters:
        points:
          kind: raw
          allow_raw: true
          description: Integer count validated against the current device point limits.
          examples: [2000]
    acquisition_points_limits_query:
      template: :ACQuire:POINts:TESTLIMITS?
    set_wave_format_byte:
      template: :WAVeform:FORMat BYTE
    set_wave_format_word:
      template: :WAVeform:FORMat WORD
    set_wave_byteorder_lsb:
      template: :WAVeform:BYTeorder LSBFirst
    set_wave_points_mode_raw:
      template: :WAVeform:VIEW ALL
    digitize:
      template: :DIGitize {sources}
      parameters:
        sources:
          kind: raw
          allow_raw: true
          description: Instrument-accepted digitize source list or token.
          examples:
          - CHAN1
    fft_display:
      template: :FUNCtion1:DISPlay {state}
    fft_source:
      template: :FUNCtion1:FFTMagnitude CHANnel{channel}
      validators:
        channel:
          min: 1
          max: 4
    fft_window:
      template: :FUNCtion1:FFT:WINDow {window}
      enums:
        window:
          rect: RECTangular
          rectangular: RECTangular
          hann: HANNing
          hanning: HANNing
          flat: FLATtop
          flat top: FLATtop
          flattop: FLATtop
          bhar: BHARris
          blackman-harris: BHARris
          blackman harris: BHARris
          hamm: HAMMing
          hamming: HAMMing
    fft_span:
      template: :FUNCtion1:FFT:SPAN {span}
    fft_vtype:
      template: :FUNCtion1:FFT:VUNits {units}
      enums:
        units:
          dec: DB
          decibel: DB
          db: DB
          dbm: DB
          dbmv: DBMV
          dbuv: DBUV
          watt: WATT
          vrms: VRMS
          dbmhz: DBMHZ
          watthz: WATTHZ
          vrthz: VRTHZ
    fft_scale:
      template: :FUNCtion1:VERTical:RANGe {scale}
    fft_offset:
      template: :FUNCtion1:VERTical:OFFSet {offset}
    function_display:
      template: :FUNCtion1:DISPlay {state}
    wgen_output:
      template: :WGEN:OUTPut {state}
      enums:
        state:
          'true': 'ON'
          'false': 'OFF'
    wgen_set_func:
      template: :WGEN:FUNCtion {func}
      enums:
        func:
          sin: SINusoid
          sinusoid: SINusoid
          squ: SQUare
          square: SQUare
          ramp: RAMP
          puls: PULSe
          pulse: PULSe
          dc: DC
          nois: NOISe
          noise: NOISe
          sinc: SINC
          expr: EXPRise
          expf: EXPFall
          card: CARDiac
          gaus: GAUSsian
          prbs: PRBS
          arb: ARBitrary
          arbitrary: ARBitrary
    wgen_set_freq:
      template: :WGEN:FREQuency {frequency}
    wgen_set_volt:
      template: :WGEN:VOLTage {amplitude}
    wgen_set_offset:
      template: :WGEN:VOLTage:OFFSet {offset}
    wgen_set_low:
      template: :WGEN:VOLTage:LOW {value}
    wgen_set_high:
      template: :WGEN:VOLTage:HIGH {value}
    wgen_set_square_duty:
      template: :WGEN:FUNCtion:SQUare:DCYCle {duty}
    wgen_set_ramp_symmetry:
      template: :WGEN:FUNCtion:RAMP:SYMMetry {symmetry}
    wgen_set_period:
      template: :WGEN:PERiod {period}
    wgen_set_pulse_width:
      template: :WGEN:FUNCtion:PULSe:WIDTh {width}
    wgen_output_mode:
      template: :WGEN:OUTPut:MODE {mode}
      enums:
        mode:
          normal: NORMal
          norm: NORMal
          single: SINGle
    wgen_output_load:
      template: :WGEN:OUTPut:LOAD {load}
      enums:
        load:
          onemeg: ONEMeg
          '1m': ONEMeg
          '1 mOhm': ONEMeg
          fifty: FIFTy
          '50': FIFTy
          '50 ohm': FIFTy
    fran_mode:
      template: :POWer:CLResponse:FREQuency:MODE {mode}
      defaults: {mode: sweep}
      enums:
        mode:
          sweep: SWEep
          swe: SWEep
          single: SINGle
          sing: SINGle
    fran_select:
      template: :POWer:ANALysis CLResponse
    fran_input_source:
      template: :POWer:CLResponse:SOURce:INPut CHANnel{channel}
      validators:
        channel:
          min: 1
          max: 4
    fran_output_source:
      template: :POWer:CLResponse:SOURce:OUTPut CHANnel{channel}
      validators:
        channel:
          min: 1
          max: 4
    fran_start:
      template: :POWer:CLResponse:FREQuency:STARt {value}
    fran_stop:
      template: :POWer:CLResponse:FREQuency:STOP {value}
    fran_amplitude:
      template: :POWer:CLResponse:WGEN:VOLTage {value}
    fran_points:
      template: :POWer:CLResponse:SWEep:POINts {value}
      validators:
        value:
          min: 1
          max: 1000
    fran_load:
      template: :POWer:CLResponse:WGEN:LOAD {value}
      enums:
        value:
          onemeg: ONEMeg
          '1m': ONEMeg
          '1 mOhm': ONEMeg
          fifty: FIFTy
          '50': FIFTy
          '50 ohm': FIFTy
    fran_run:
      template: :POWer:CLResponse:APPLy
  queries:
    self_test: {template: "*TST?"}
    opc_query:
      template: '*OPC?'
      response:
        type: int
    esr_query:
      template: '*ESR?'
      response:
        type: int
    get_error:
      template: :SYSTem:ERRor?
      response:
        type: str
    scpi_version:
      template: :SYSTem:VERSion?
      response:
        type: str
    header_query:
      template: :SYSTem:HEADer?
      response:
        type: str
    get_timebase_scale:
      template: :TIMebase:SCALe?
      response:
        type: scpi_float
    get_timebase_position:
      template: :TIMebase:POSition?
      response:
        type: scpi_float
    get_channel_scale:
      template: :CHANnel{channel}:SCALe?
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    channel_input:
      template: :CHANnel{channel}:INPut?
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: str
    get_channel_offset:
      template: :CHANnel{channel}:OFFSet?
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    probe_get:
      template: :CHANnel{channel}:PROBe?
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    measure_vpp:
      template: :MEASure:VPP? CHANnel{channel}
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    measure_phase:
      template: :MEASure:PHASe? CHANnel{channel}
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    measure_frequency:
      template: :MEASure:FREQuency? CHANnel{channel}
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    measure_vrms:
      template: :MEASure:VRMS? CYCLe,AC,CHANnel{channel}
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    acquire_points:
      template: :ACQuire:POINts:ANALog?
      response:
        type: int
    acquire_sample_rate:
      template: :ACQuire:SRATe:ANALog?
      response:
        type: scpi_float
    acq_get_type:
      template: :ACQuire:AVERage?
      response:
        type: str
        numeric_map:
          "0": NORMAL
          "1": AVERAGE
    acq_get_mode:
      template: :ACQuire:MODE?
      response:
        type: str
    acq_get_count:
      template: :ACQuire:COUNt?
      response:
        type: int
    seg_get_count:
      template: :ACQuire:SEGMented:COUNt?
      response:
        type: int
    seg_get_index:
      template: :ACQuire:SEGMented:INDex?
      response:
        type: int
    wave_data:
      template: :WAVeform:DATA?
      response:
        type: binblock
    wave_source:
      template: :WAVeform:SOURce?
      response:
        type: str
