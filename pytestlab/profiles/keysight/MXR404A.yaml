scpi:
  commands:
    identify:
      template: "*IDN?"
    clear:
      template: "*CLS"
    reset:
      template: "*RST"
    opc:
      template: "*OPC"
    system_lock:
      template: ":SYSTem:LOCK {state}"
    header_off:
      template: ":SYSTem:HEADer OFF"
    auto_scale:
      template: ":AUToscale"
    set_time_axis:
      sequence:
        - ":TIMebase:SCALe {scale}"
        - ":TIMebase:POSition {position}"
    set_channel_axis:
      sequence:
        - ":CHANnel{channel}:SCALe {scale}"
        - ":CHANnel{channel}:OFFSet {offset}"
      validators:
        channel: { min: 1, max: 4 }
    set_channel_coupling:
      template: ":CHANnel{channel}:INPut {coupling}"
      validators:
        channel: { min: 1, max: 4 }
    display_channel:
      template: ":CHANnel{channel}:DISPlay {state}"
      validators:
        channel: { min: 1, max: 4 }
      enums:
        state: { on: "ON", off: "OFF", true: "ON", false: "OFF", "1": "ON", "0": "OFF" }
    probe_set:
      template: ":CHANnel{channel}:PROBe:ATTenuation {scale}"
      validators:
        channel: { min: 1, max: 4 }
    channel_bandwidth:
      template: ":CHANnel{channel}:BWLimit {bandwidth}"
      validators:
        channel: { min: 1, max: 4 }
    configure_trigger:
      sequence:
        - ":TRIGger:MODE {mode}"
        - ":TRIGger:EDGE:SOURce {source}"
        - ":TRIGger:LEVel CHANnel{channel},{level}"
        - ":TRIGger:EDGE:SLOPe {slope}"
      validators:
        channel: { min: 1, max: 4 }
    set_trigger_coupling:
      template: ":TRIGger:{mode}:COUPling {coupling}"
    acq_set_type:
      template: ":ACQuire:AVERage {value}"
    acq_set_mode:
      template: ":ACQuire:MODE {value}"
    acq_set_count:
      template: ":ACQuire:COUNt {count}"
    acquire_set_rate:
      template: ":ACQuire:SRATe:ANALog {rate}"
    timebase_main_range:
      template: ":TIMebase:RANGe {time}"
    seg_set_count:
      template: ":ACQuire:SEGMented:COUNt {count}"
    seg_set_index:
      template: ":ACQuire:SEGMented:INDex {index}"
    seg_analyze:
      template: ":ACQuire:SEGMented:ANALyze"
    set_wave_source:
      template: ":WAVeform:SOURce {source}"
    set_wave_points_max:
      template: ":WAVeform:POINts MAX"
    set_wave_format_byte:
      template: ":WAVeform:FORMat BYTE"
    set_wave_points_mode_raw:
      template: ":WAVeform:VIEW ALL"
    digitize:
      template: ":DIGitize {sources}"

  queries:
    opc_query:
      template: "*OPC?"
      response:
        type: int
    esr_query:
      template: "*ESR?"
      response:
        type: int
    get_error:
      template: ":SYSTem:ERRor?"
      response:
        type: str
    scpi_version:
      template: ":SYSTem:VERSion?"
      response:
        type: str
    header_query:
      template: ":SYSTem:HEADer?"
      response:
        type: str
    get_timebase_scale:
      template: ":TIMebase:SCALe?"
      response:
        type: scpi_float
    get_timebase_position:
      template: ":TIMebase:POSition?"
      response:
        type: scpi_float
    get_channel_scale:
      template: ":CHANnel{channel}:SCALe?"
      validators:
        channel: { min: 1, max: 4 }
      response:
        type: scpi_float
    get_channel_offset:
      template: ":CHANnel{channel}:OFFSet?"
      validators:
        channel: { min: 1, max: 4 }
      response:
        type: scpi_float
    probe_get:
      template: ":CHANnel{channel}:PROBe:ATTenuation?"
      validators:
        channel: { min: 1, max: 4 }
      response:
        type: scpi_float
    measure_vpp:
      template: ":MEASure:VPP? CHANnel{channel}"
      validators:
        channel: { min: 1, max: 4 }
      response:
        type: scpi_float
    measure_vrms:
      template: ":MEASure:VRMS? CHANnel{channel}"
      validators:
        channel: { min: 1, max: 4 }
      response:
        type: scpi_float
    acquire_points:
      template: ":ACQuire:POINts:ANALog?"
      response:
        type: int
    acquire_sample_rate:
      template: ":ACQuire:SRATe:ANALog?"
      response:
        type: scpi_float
    acquire_setup:
      template: ":ACQuire?"
      response:
        type: str
    acq_get_type:
      template: ":ACQuire:AVERage?"
      response:
        type: str
    acq_get_mode:
      template: ":ACQuire:MODE?"
      response:
        type: str
    acq_get_count:
      template: ":ACQuire:COUNt?"
      response:
        type: int
    seg_get_count:
      template: ":ACQuire:SEGMented:COUNt?"
      response:
        type: int
    seg_get_index:
      template: ":ACQuire:SEGMented:INDex?"
      response:
        type: int
    wave_data:
      template: ":WAVeform:DATA?"
      response:
        type: binblock
    wave_preamble:
      template: ":WAVeform:PREamble?"
      response:
        type: csv
    screenshot:
      template: ":DISPlay:DATA? PNG, COLor"
      response:
        type: binblock
