  frequency_response_analysis:
    transport:
      start: fran_start
      stop: fran_stop
      amplitude: fran_amplitude
      points: fran_points
      load: fran_load
      fetch: fran_fetch
      input: fran_input_source
      output: fran_output_source
      select: fran_select
      mode: fran_mode
      run: fran_run
    parameters:
