          aliases:
          - 'on'
          transport:
            value: true
        - value: false
          aliases:
          - 'off'
          transport:
            value: false
        bindings:
        - alias: write
          parameter: state
  waveform_readout:
    transport:
      source: set_wave_source
      points_max: set_wave_points_max
      acquisition_points: set_acquisition_points
      acquisition_points_limits_query: acquisition_points_limits_query
      format_byte: set_wave_format_byte
      format_word: set_wave_format_word
      byteorder_lsb: set_wave_byteorder_lsb
      points_raw: set_wave_points_mode_raw
      channel_display_query: display_channel_query
      channel_display: display_channel
    parameters:
      channel:
        kind: enum
        options:
        - value: channel_1
          label: Channel 1
          aliases:
          - ch1
          - chan1
          transport:
            value: CHANnel1
        - value: channel_2
          label: Channel 2
          aliases:
          - ch2
          - chan2
          transport:
            value: CHANnel2
        - value: channel_3
          label: Channel 3
          aliases:
          - ch3
          - chan3
          transport:
            value: CHANnel3
        - value: channel_4
          label: Channel 4
          aliases:
          - ch4
          - chan4
          transport:
            value: CHANnel4
        bindings:
        - alias: source
          parameter: source
      mode:
        kind: enum
        required: false
        default: controlled
        transport_parameter: false
        options:
        - value: controlled
        - value: read_only
      format:
        kind: enum
        required: false
        default: byte
        transport_parameter: false
        options:
        - value: byte
        - value: word
        - value: auto
      points:
        kind: range
        required: false
        min: 1
        description: Acquisition depth requested before digitize; current device limits are queried and effective count is returned.
        transport_parameter: false
      uncertainty:
        kind: bool
        required: false
        default: true
        transport_parameter: false
        options:
        - value: true
        - value: false
      restore_state:
        kind: bool
        required: false
        default: false
        transport_parameter: false
        options:
        - value: true
        - value: false
      timeout_ms:
        kind: range
        required: false
        min: 1
        transport_parameter: false
  wave_generator_basic:
    transport:
      write: wgen_output
    parameters:
      state:
        kind: bool
        options:
        - value: true
          aliases:
          - 'on'
          transport:
