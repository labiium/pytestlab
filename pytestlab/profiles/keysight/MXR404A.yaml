manufacturer: Keysight
model: MXR404A
device_type: oscilloscope
role: measurement
measurement_accuracy:
  waveform_ch1: &id001
    model: linear
    reading_percent: 1.0
    offset: 0.005
    offset_unit: V
    distribution: rectangular
  waveform_ch2: *id001
  waveform_ch3: *id001
  waveform_ch4: *id001
bandwidth: 4000000000.0
sampling_rate: 16000000000.0
memory: 200000000.0
waveform_update_rate: 200000.0
trigger:
  types:
  - EDGE
  - PULSE
  - TIMEOUT
  - WINDOW
  modes:
  - EDGE
  - PULSE
  slopes:
  - POS
  - NEG
  - EITH
channels:
- description: Input Channel 1
  channel_range:
    min_val: -5.0
    max_val: 5.0
  input_coupling:
  - AC
  - DC
  input_impedance: 1000000.0
  probe_attenuation:
  - 1
  - 10
  - 100
  timebase:
    range:
      min_val: 5.0e-12
      max_val: 200
    horizontal_resolution: 1.0e-12
- description: Input Channel 2
  channel_range:
    min_val: -5.0
    max_val: 5.0
  input_coupling:
  - AC
  - DC
  input_impedance: 1000000.0
  probe_attenuation:
  - 1
  - 10
  - 100
  timebase:
    range:
      min_val: 5.0e-12
      max_val: 200
    horizontal_resolution: 1.0e-12
- description: Input Channel 3
  channel_range:
    min_val: -5.0
    max_val: 5.0
  input_coupling:
  - AC
  - DC
  input_impedance: 1000000.0
  probe_attenuation:
  - 1
  - 10
  - 100
  timebase:
    range:
      min_val: 5.0e-12
      max_val: 200
    horizontal_resolution: 1.0e-12
- description: Input Channel 4
  channel_range:
    min_val: -5.0
    max_val: 5.0
  input_coupling:
  - AC
  - DC
  input_impedance: 1000000.0
  probe_attenuation:
  - 1
  - 10
  - 100
  timebase:
    range:
      min_val: 5.0e-12
      max_val: 200
    horizontal_resolution: 1.0e-12
scpi:
  commands:
    identify:
      template: '*IDN?'
    clear:
      template: '*CLS'
    reset:
      template: '*RST'
    opc:
      template: '*OPC'
    system_lock:
      template: :SYSTem:LOCK {state}
      parameters:
        state:
          kind: enum
          strict: true
          choices: &id002
          - token: 'ON'
            label: 'ON'
            aliases:
            - 'on'
            - 'true'
            - '1'
          - token: 'OFF'
            label: 'OFF'
            aliases:
            - 'off'
            - 'false'
            - '0'
          description: Instrument-accepted state token used for command-build smoke validation.
    header_off:
      template: :SYSTem:HEADer OFF
    auto_scale:
      template: :AUToscale
    set_time_axis:
      sequence:
      - :TIMebase:SCALe {scale}
      - :TIMebase:POSition {position}
      parameters:
        scale:
          kind: raw
          allow_raw: true
          description: Horizontal timebase scale value in seconds/division.
          examples:
          - 1.0
        position:
          kind: raw
          allow_raw: true
          description: Horizontal timebase position value in seconds.
          examples:
          - 0.0
    set_channel_axis:
      sequence:
      - :CHANnel{channel}:SCALe {scale}
      - :CHANnel{channel}:OFFSet {offset}
      validators:
        channel:
          min: 1
          max: 4
      parameters:
        scale:
          kind: raw
          allow_raw: true
          description: Vertical scale value for the selected channel.
          examples:
          - 1.0
        offset:
          kind: raw
          allow_raw: true
          description: Vertical offset value for the selected channel.
          examples:
          - 0.0
    set_channel_coupling:
      template: :CHANnel{channel}:INPut {coupling}
      validators:
        channel:
          min: 1
          max: 4
      parameters:
        coupling:
          kind: raw
          allow_raw: true
          description: Instrument-accepted coupling token used for command-build smoke validation.
          examples:
          - DC
    display_channel:
      template: :CHANnel{channel}:DISPlay {state}
      validators:
        channel:
          min: 1
          max: 4
      enums:
        state:
          true: 'ON'
          false: 'OFF'
          '1': 'ON'
          '0': 'OFF'
      parameters:
        state:
          kind: enum
          strict: true
          choices: *id002
          description: Instrument-accepted state token used for command-build smoke validation.
    probe_set:
      template: :CHANnel{channel}:PROBe:ATTenuation {scale}
      validators:
        channel:
          min: 1
          max: 4
      parameters:
        scale:
          kind: raw
          allow_raw: true
          description: Numeric scale example used for command-build smoke validation.
          examples:
          - 1.0
    channel_bandwidth:
      template: :CHANnel{channel}:BWLimit {bandwidth}
      validators:
        channel:
          min: 1
          max: 4
      parameters:
        bandwidth:
          kind: raw
          allow_raw: true
          description: Bandwidth example in Hz used for command-build smoke validation.
          examples:
          - 20000000
    configure_trigger:
      sequence:
      - :TRIGger:MODE {mode}
      - :TRIGger:EDGE:SOURce {source}
      - :TRIGger:LEVel CHANnel{channel},{level}
      - :TRIGger:EDGE:SLOPe {slope}
      validators:
        channel:
          min: 1
          max: 4
      parameters:
        mode:
          kind: raw
          allow_raw: true
          description: Instrument-accepted trigger mode SCPI token.
          examples:
          - EDGE
        source:
          kind: raw
          allow_raw: true
          description: Instrument-accepted trigger source SCPI token.
          examples:
          - CHAN1
        level:
          kind: raw
          allow_raw: true
          description: Trigger level numeric value.
          examples:
          - 0.0
        slope:
          kind: raw
          allow_raw: true
          description: Instrument-accepted trigger slope SCPI token.
          examples:
          - POS
    set_trigger_coupling:
      template: :TRIGger:{mode}:COUPling {coupling}
      parameters:
        coupling:
          kind: raw
          allow_raw: true
          description: Instrument-accepted coupling token used for command-build smoke validation.
          examples:
          - DC
        mode:
          kind: raw
          allow_raw: true
          description: Instrument-accepted mode token used for command-build smoke validation.
          examples:
          - EDGE
    acq_set_type:
      template: :ACQuire:AVERage {value}
      parameters:
        value:
          kind: raw
          allow_raw: true
          description: Instrument-accepted acquisition type SCPI token.
          examples:
          - NORM
    acq_set_mode:
      template: :ACQuire:MODE {value}
      parameters:
        value:
          kind: raw
          allow_raw: true
          description: Instrument-accepted acquisition mode SCPI token.
          examples:
          - NORM
    acq_set_count:
      template: :ACQuire:COUNt {count}
      parameters:
        count:
          kind: raw
          allow_raw: true
          description: Acquisition count numeric value.
          examples:
          - 1
    acquire_set_rate:
      template: :ACQuire:SRATe:ANALog {rate}
      parameters:
        rate:
          kind: raw
          allow_raw: true
          description: Sample-rate example in samples per second used for command-build smoke validation.
          examples:
          - 1000000
    timebase_main_range:
      template: :TIMebase:RANGe {time}
      parameters:
        time:
          kind: raw
          allow_raw: true
          description: Time value example in seconds used for command-build smoke validation.
          examples:
          - 0.001
    seg_set_count:
      template: :ACQuire:SEGMented:COUNt {count}
      parameters:
        count:
          kind: raw
          allow_raw: true
          description: Integer count example used for command-build smoke validation.
          examples:
          - 1
    seg_set_index:
      template: :ACQuire:SEGMented:INDex {index}
      parameters:
        index:
          kind: raw
          allow_raw: true
          description: Integer index example used for command-build smoke validation.
          examples:
          - 1
    seg_analyze:
      template: :ACQuire:SEGMented:ANALyze
    set_wave_source:
      template: :WAVeform:SOURce {source}
      parameters:
        source:
          kind: raw
          allow_raw: true
          description: Instrument-accepted waveform source SCPI token.
          examples:
          - CHAN1
    set_wave_points_max:
      template: :WAVeform:POINts MAX
    set_wave_format_byte:
      template: :WAVeform:FORMat BYTE
    set_wave_points_mode_raw:
      template: :WAVeform:VIEW ALL
    digitize:
      template: :DIGitize {sources}
      parameters:
        sources:
          kind: raw
          allow_raw: true
          description: Instrument-accepted digitize source list or token.
          examples:
          - CHAN1
  queries:
    opc_query:
      template: '*OPC?'
      response:
        type: int
    esr_query:
      template: '*ESR?'
      response:
        type: int
    get_error:
      template: :SYSTem:ERRor?
      response:
        type: str
    scpi_version:
      template: :SYSTem:VERSion?
      response:
        type: str
    header_query:
      template: :SYSTem:HEADer?
      response:
        type: str
    get_timebase_scale:
      template: :TIMebase:SCALe?
      response:
        type: scpi_float
    get_timebase_position:
      template: :TIMebase:POSition?
      response:
        type: scpi_float
    get_channel_scale:
      template: :CHANnel{channel}:SCALe?
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    get_channel_offset:
      template: :CHANnel{channel}:OFFSet?
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    probe_get:
      template: :CHANnel{channel}:PROBe:ATTenuation?
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    measure_vpp:
      template: :MEASure:VPP? CHANnel{channel}
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    measure_vrms:
      template: :MEASure:VRMS? CYCLe,AC,CHANnel{channel}
      validators:
        channel:
          min: 1
          max: 4
      response:
        type: scpi_float
    acquire_points:
      template: :ACQuire:POINts:ANALog?
      response:
        type: int
    acquire_sample_rate:
      template: :ACQuire:SRATe:ANALog?
      response:
        type: scpi_float
    acquire_setup:
      template: :ACQuire?
      response:
        type: str
    acq_get_type:
      template: :ACQuire:AVERage?
      response:
        type: str
    acq_get_mode:
      template: :ACQuire:MODE?
      response:
        type: str
    acq_get_count:
      template: :ACQuire:COUNt?
      response:
        type: int
    seg_get_count:
      template: :ACQuire:SEGMented:COUNt?
      response:
        type: int
    seg_get_index:
      template: :ACQuire:SEGMented:INDex?
      response:
        type: int
    wave_data:
      template: :WAVeform:DATA?
      response:
        type: binblock
    wave_preamble:
      template: :WAVeform:PREamble?
      response:
        type: csv
    screenshot:
      template: :DISPlay:DATA? PNG, COLor
      response:
        type: binblock
