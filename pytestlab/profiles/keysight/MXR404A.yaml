        - value: pulse
          aliases:
          - pulse
          transport:
            value: PULSe
        - value: dc
          aliases:
          - dc
          transport:
            value: DC
        - value: noise
          aliases:
          - noise
          transport:
            value: NOISe
        - value: sinc
          aliases:
          - sinc
          transport:
            value: SINC
        - value: exprise
