manufacturer: Keysight
model: MXR404A
device_type: oscilloscope
role: measurement
bandwidth: 4.e+9  # 4 GHz
sampling_rate: 1.6e+10  # 16 GSa/s
memory: 2.e+8  # 200 Mpts/ch
waveform_update_rate: 2.e+5  # >200,000 wfms/sec

trigger:
  types:
    - EDGE
    - PULSE
    - TIMEOUT
    - WINDOW
  modes:
    - EDGE
    - PULSE
  slopes:
    - POS
    - NEG
    - EITH

channels:
  - description: Input Channel 1
    channel_range:
      min_val: -5.0
      max_val: 5.0
    input_coupling:
      - AC
      - DC
    input_impedance: 1.e+6
    probe_attenuation:
      - 1
      - 10
      - 100
    timebase:
      range:
        min_val: 5.e-12
        max_val: 200
      horizontal_resolution: 1.e-12
  - description: Input Channel 2
    channel_range:
      min_val: -5.0
      max_val: 5.0
    input_coupling:
      - AC
      - DC
    input_impedance: 1.e+6
    probe_attenuation:
      - 1
      - 10
      - 100
    timebase:
      range:
        min_val: 5.e-12
        max_val: 200
      horizontal_resolution: 1.e-12
  - description: Input Channel 3
    channel_range:
      min_val: -5.0
      max_val: 5.0
    input_coupling:
      - AC
      - DC
    input_impedance: 1.e+6
    probe_attenuation:
      - 1
      - 10
      - 100
    timebase:
      range:
        min_val: 5.e-12
        max_val: 200
      horizontal_resolution: 1.e-12
  - description: Input Channel 4
    channel_range:
      min_val: -5.0
      max_val: 5.0
    input_coupling:
      - AC
      - DC
    input_impedance: 1.e+6
    probe_attenuation:
      - 1
      - 10
      - 100
    timebase:
      range:
        min_val: 5.e-12
        max_val: 200
      horizontal_resolution: 1.e-12

