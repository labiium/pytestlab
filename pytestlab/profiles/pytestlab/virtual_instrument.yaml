manufacturer: PyTestLab
model: Virtual-Instrument-1
device_type: virtual_instrument
role: custom
address: "VIRTUAL::INSTRUMENT"

scpi:
    commands:
        set_voltage:
            template: "SET:VOLT {voltage}"
            validators:
                voltage: {min: -1000, max: 1000}
        set_current:
            template: "SET:CURR {current}"
            validators:
                current: {min: -1000, max: 1000}
        set_trigger_state:
            template: "TRIG:STATE {state}"
            parameters:
                state:
                    kind: enum
                    strict: true
                    choices:
                        - {token: "ARMED", label: "Armed", aliases: ["armed"]}
                        - {token: "TRIGGERED", label: "Triggered", aliases: ["triggered"]}
                        - {token: "IDLE", label: "Idle", aliases: ["idle"]}
        increment_counter:
            template: "COUNT:INC"
        decrement_counter:
            template: "COUNT:DEC"
        set_status_message:
            template: "STATUS:MSG {message}"
            parameters:
                message:
                    kind: open_string
                    strict: false
        dynamic_add:
            template: "DYNAMIC:ADD {value}"
            validators:
                value: {min: -1000000, max: 1000000}
        push_error:
            template: "ERROR:PUSH"
    queries:
        measure_voltage:
            template: "MEAS:VOLT?"
            response: {type: float}
        measure_current:
            template: "MEAS:CURR?"
            response: {type: float}
        get_trigger_state:
            template: "TRIG:STATE?"
            response: {type: str}
        get_counter:
            template: "COUNT?"
            response: {type: int}
        get_status_message:
            template: "STATUS:MSG?"
            response: {type: str}
        dynamic_random:
            template: "DYNAMIC:RAND?"
            response: {type: int}
        check_error:
            template: "ERROR:CHECK?"
            response: {type: raw}
        fetch_waveform:
            template: "FETCH:WAV?"
            response: {type: binblock}

simulation:
    initial_state:
        counter: 0
        status_message: "READY"
        voltage: 0.0
        current: 0.0
        trigger_state: "IDLE"
        error_condition: false
        error_code: 0
        error_message: ""
    scpi:
        "*IDN?": "PyTestLab,Virtual-Instrument-1,0,1.0"
        "*RST":
            - "set.voltage = 0"
            - "set.current = 0"
            - "set.trigger_state = 'IDLE'"
            - "set.counter = 0"
            - "set.status_message = 'RESET'"
        "SET:VOLT ([-+]?[0-9]*\\.?[0-9]+)":
            set:
                voltage: "$1"
        "SET:CURR ([-+]?[0-9]*\\.?[0-9]+)":
            set:
                current: "$1"
        "MEAS:VOLT?":
            get: "voltage"
        "MEAS:CURR?":
            get: "current"
        "TRIG:STATE (ARMED|TRIGGERED|IDLE)":
            set:
                trigger_state: "$1"
        "TRIG:STATE?":
            get: "trigger_state"
        "COUNT:INC":
            inc:
                counter: 1
        "COUNT:DEC":
            dec:
                counter: 1
        "COUNT?":
            get: "counter"
        "STATUS:MSG (.*)":
            set:
                status_message: "$1"
        "STATUS:MSG?":
            get: "status_message"
        "DYNAMIC:ADD ([-+]?[0-9]*\\.?[0-9]+)":
            response: "py: str(state.counter + float(g1))"
        "DYNAMIC:RAND?":
            response: "lambda: str(random.randint(1, 100))"
        ":SYSTem:ERRor?": '+0,"No error"'
        "FETCH:WAV?":
            binary: "binary_wave_data.bin"
        "ERROR:PUSH":
            - "set.error_condition = True"
            - "set.error_code = -100"
            - "set.error_message = 'Custom Error'"
        "ERROR:CHECK?":
            response: 'py: f''{state.error_code},"{state.error_message}"'' if state.error_condition else ''+0,"No error"'''
            set:
                error_condition: False
                error_code: 0
                error_message: ""
