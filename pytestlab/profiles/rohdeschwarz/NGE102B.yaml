manufacturer: rohdeschwarz
model: NGE102B
device_type: power_supply
role: stimulus
channels:
  - channel_id: 1
    description: Channel 1
    voltage_range:
      min_val: 0
      max_val: 32
    current_limit_range:
      min_val: 0
      max_val: 3
    slew_rate_range:
      min_val: 0.01
      max_val: 10
      units: s
  - channel_id: 2
    description: Channel 2
    voltage_range:
      min_val: 0
      max_val: 32
    current_limit_range:
      min_val: 0
      max_val: 3
    slew_rate_range:
      min_val: 0.01
      max_val: 10
      units: s
total_power: 66
scpi:
  commands:
    set_voltage:
      sequence:
        - "INST:NSEL {channel}"
        - "VOLT {voltage}"
      defaults: { channel: 1 }
      validators:
        channel: { min: 1, max: 2 }
        voltage: { min: 0, max: 32 }

    set_current:
      sequence:
        - "INST:NSEL {channel}"
        - "CURR {current}"
      defaults: { channel: 1 }
      validators:
        channel: { min: 1, max: 2 }
        current: { min: 0, max: 3 }

    set_output:
      sequence:
        - "INST:NSEL {channel}"
        - "OUTP:STAT {state}"
      defaults: { channel: 1 }
      enums:
        state:
          { "on": "ON", "off": "OFF", "true": "ON", "false": "OFF", "1": "ON", "0": "OFF" }
      validators:
        channel: { min: 1, max: 2 }

    set_slew_rate:
      sequence:
        - "INST:NSEL {channel}"
        - "VOLT:RAMP:DUR {duration_ms}"
      defaults: { channel: 1 }
      validators:
        channel: { min: 1, max: 2 }
        duration_ms: { min: 10, max: 10000 }

    enable_slew_rate:
      sequence:
        - "INST:NSEL {channel}"
        - "VOLT:RAMP:STAT ON"
      defaults: { channel: 1 }
      validators:
        channel: { min: 1, max: 2 }

    disable_slew_rate:
      sequence:
        - "INST:NSEL {channel}"
        - "VOLT:RAMP:STAT OFF"
      defaults: { channel: 1 }
      validators:
        channel: { min: 1, max: 2 }

    reset:
      template: "*RST"
    clear:
      template: "*CLS"
    opc:
      template: "*OPC"

  queries:
    opc_query:
      template: "*OPC?"
      response: {type: str}
    esr_query:
      template: "*ESR?"
      response: {type: str}
    identify:
      template: "*IDN?"
      response:
        type: str

    measure_voltage:
      sequence:
        - "INST:NSEL {channel}"
        - "MEAS:VOLT?"
      defaults: { channel: 1 }
      validators:
        channel: { min: 1, max: 2 }
      response:
        type: float

    measure_current:
      sequence:
        - "INST:NSEL {channel}"
        - "MEAS:CURR?"
      defaults: { channel: 1 }
      validators:
        channel: { min: 1, max: 2 }
      response:
        type: float

    get_output_state:
      sequence:
        - "INST:NSEL {channel}"
        - "OUTP?"
      defaults: { channel: 1 }
      validators:
        channel: { min: 1, max: 2 }
      response:
        type: str

    get_error:
      template: "SYST:ERR?"
      response:
        type: str

simulation:
  scpi:
    "*IDN?": "Rohde&Schwarz,NGE102B-SIM,123456,1.40"
    "SYST:ERR?": '+0,"No error"'
    "INST:NSEL *": ""
    "VOLT *":
      set:
        voltage: "$1"
    "CURR *":
      set:
        current: "$1"
    "OUTP:STAT *":
      set:
        output: "$1"
    "MEAS:VOLT?": "5.0"
    "MEAS:CURR?": "1.0"
    "OUTP?": "1"
    "VOLT:RAMP:DUR *":
      set:
        duration_ms: "$1"
    "VOLT:RAMP:STAT *":
      set:
        state: "$1"
# Semantic operation metadata.  Transport aliases remain private profile data.
operation_options:
  operations:
    identify:
      transport: {main: identify}
    reset:
      transport: {main: reset}
    set_voltage:
      transport: {main: set_voltage}
      parameters:
        channel:
          kind: enum
          transport_identity: true
          options:
            - {value: 1, label: Channel 1}
            - {value: 2, label: Channel 2}
          bindings: [{alias: main, parameter: channel}]
        voltage:
          kind: range
          min: 0
          max: 32
          unit: V
          dependencies: [channel]
          bindings: [{alias: main, parameter: voltage}]
    set_current:
      transport: {main: set_current}
      parameters:
        channel:
          kind: enum
          transport_identity: true
          options:
            - {value: 1, label: Channel 1}
            - {value: 2, label: Channel 2}
          bindings: [{alias: main, parameter: channel}]
        current:
          kind: range
          min: 0
          max: 3
          unit: A
          dependencies: [channel]
          bindings: [{alias: main, parameter: current}]
    set_slew_rate:
      transport: {main: set_slew_rate}
      parameters:
        channel:
          kind: enum
          transport_identity: true
          options:
            - {value: 1, label: Channel 1}
            - {value: 2, label: Channel 2}
          bindings: [{alias: main, parameter: channel}]
        duration_s:
          kind: range
          min: 0.01
          max: 10
          unit: s
          dependencies: [channel]
          bindings: [{alias: main, parameter: duration_ms}]
    set_output:
      transport: {main: set_output}
      parameters:
        channel:
          kind: enum
          transport_identity: true
          options:
            - {value: 1, label: Channel 1}
            - {value: 2, label: Channel 2}
          bindings: [{alias: main, parameter: channel}]
        state:
          kind: bool
          options:
            - {value: true, label: "On", aliases: ["on"] , transport: {value: ON}}
            - {value: false, label: "Off", aliases: ["off"], transport: {value: OFF}}
          bindings: [{alias: main, parameter: state}]
    set_display:
      transport: {main: set_display}
      parameters:
        state:
          kind: bool
          options:
            - {value: true, label: "On", aliases: ["on"], transport: {value: ON}}
            - {value: false, label: "Off", aliases: ["off"], transport: {value: OFF}}
          bindings: [{alias: main, parameter: state}]
    measure_voltage:
      transport: {main: measure_voltage}
      parameters:
        channel:
          kind: enum
          transport_identity: true
          options:
            - {value: 1, label: Channel 1}
            - {value: 2, label: Channel 2}
          bindings: [{alias: main, parameter: channel}]
    measure_current:
      transport: {main: measure_current}
      parameters:
        channel:
          kind: enum
          transport_identity: true
          options:
            - {value: 1, label: Channel 1}
            - {value: 2, label: Channel 2}
          bindings: [{alias: main, parameter: channel}]
    get_output_state:
      transport: {main: get_output_state}
      parameters:
        channel:
          kind: enum
          transport_identity: true
          options:
            - {value: 1, label: Channel 1}
            - {value: 2, label: Channel 2}
          bindings: [{alias: main, parameter: channel}]
    enable_slew_rate:
      transport:
        enable: enable_slew_rate
        disable: disable_slew_rate
      parameters:
        channel:
          kind: enum
          transport_identity: true
          options:
            - {value: 1, label: Channel 1}
            - {value: 2, label: Channel 2}
          bindings: [{alias: enable, parameter: channel}]
        state:
          kind: bool
          transport_parameter: false
          options:
            - {value: true, label: "Enabled", transport: {value: ON}}
            - {value: false, label: "Disabled", transport: {value: OFF}}
    get_configuration:
      transport: {}
