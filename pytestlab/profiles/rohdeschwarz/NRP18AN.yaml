manufacturer: Rohde & Schwarz
model: NRP18AN
device_type: power_meter
role: measurement
power_condition_bits:
  1: sensor measurement corrupt
  5: sensor zeroing needed
calibration_condition_bits:
  1: sensor zero failed

scpi:
  commands:
    reset: {template: "*RST"}
    clear: {template: "*CLS"}
    opc: {template: "*OPC"}
    set_sensor_frequency:
      template: "SENS{channel}:FREQ {frequency}"
      validators:
        channel: {min: 1, max: 1}
        frequency: {min: 8000, max: 18000000000}
    set_averaging_count:
      sequence:
        - "SENS{channel}:POW:AVG:FAST OFF"
        - "SENS{channel}:AVER:COUN:AUTO OFF"
        - "SENS{channel}:AVER:COUN {count}"
        - "SENS{channel}:AVER:TCON REP"
        - "SENS{channel}:AVER:STAT ON"
      validators:
        channel: {min: 1, max: 1}
        count: {min: 1, max: 65536}
    set_power_units:
      template: "UNIT:POW {units}"
      enums:
        units: {dBm: DBM, W: W}
    setup_average:
      sequence:
        - 'SENS{channel}:FUNC "POWer:AVG"'
        - 'INIT:CONT OFF'
        - 'ABOR'
        - 'FORM:DATA ASC,0'
        - 'TRIG:ATR:STAT OFF'
        - 'SENS{channel}:POW:AVG:FAST OFF'
        - 'SENS{channel}:AVER:TCON REP'
        - 'UNIT:POW DBM'
        - 'TRIG:SOUR IMM'
        - 'SENS{channel}:CORR:DCYC:STAT OFF'
        - 'CALC:FEED "POWer:AVERage"'
        - 'SENS{channel}:AUX NONE'
        - 'SENS{channel}:POW:AVG:BUFF:STAT OFF'
        - 'TRIG:COUN 1'
    configure_manual_averaging:
      sequence:
        - 'SENS{channel}:POW:AVG:FAST OFF'
        - 'SENS{channel}:AVER:COUN:AUTO OFF'
        - 'SENS{channel}:AVER:COUN {count}'
        - 'SENS{channel}:AVER:TCON REP'
        - 'SENS{channel}:AVER:STAT ON'
    start_power_single:
      sequence:
        - 'ABOR'
        - 'INIT'
    configure_automatic_averaging:
      sequence:
        - 'SENS{channel}:AVER:COUN:AUTO ON'
        - 'SENS{channel}:AVER:STAT ON'
    configure_disabled_averaging:
      sequence:
        - 'SENS{channel}:AVER:COUN:AUTO OFF'
        - 'SENS{channel}:AVER:STAT OFF'
    set_trigger_edge: {template: "TRIG:SLOP {edge}"}
    setup_buffered_average:
      sequence:
        - 'INIT:CONT OFF'
        - 'ABOR'
        - 'SENS{channel}:FUNC "POWer:AVG"'
        - 'FORM:DATA ASC,0'
        - 'UNIT:POW DBM'
        - 'TRIG:SOUR IMM'
        - 'TRIG:ATR:STAT OFF'
        - 'SENS{channel}:CORR:DCYC:STAT OFF'
        - 'CALC:FEED "POWer:AVERage"'
        - 'SENS{channel}:AUX NONE'
        - 'SENS{channel}:POW:AVG:FAST OFF'
        - 'SENS{channel}:AVER:TCON REP'
        - 'SENS{channel}:POW:AVG:BUFF:STAT OFF'
        - 'SENS{channel}:POW:AVG:BUFF:SIZE {sample_count}'
        - 'SENS{channel}:POW:AVG:BUFF:STAT ON'
        - 'TRIG:COUN {sample_count}'
    start_power_buffer:
      sequence:
        - 'ABOR'
        - 'SENS{channel}:POW:AVG:BUFF:CLE'
        - 'INIT'
    set_aperture: {template: "SENS{channel}:POW:AVG:APER {aperture_s}"}
    set_external_trigger:
      sequence:
        - 'TRIG:SOUR {source}'
        - 'TRIG:DEL:AUTO OFF'
        - 'TRIG:DEL 0'
    zero_once: {template: "CAL{channel}:ZERO:AUTO ONCE"}
    set_duty_cycle:
      sequence:
        - 'SENS{channel}:CORR:DCYC {duty_cycle_percent}PCT'
        - 'SENS{channel}:CORR:DCYC:STAT ON'
    set_peak_feed: {template: 'CALC:FEED "POWer:PEAK"'}
    set_random_feed: {template: 'CALC:FEED "POWer:RANDom"'}
    set_trigger_level:
      sequence:
        - 'TRIG:LEV:UNIT DBM'
        - 'TRIG:LEV {trigger_level_dbm}'
    set_fixed_offset: {template: "SENS{channel}:CORR:OFFS {offset_db}"}
    set_fixed_offset_enabled: {template: "SENS{channel}:CORR:OFFS:STAT {state}"}
    set_s_parameter_enabled: {template: "SENS{channel}:CORR:SPD:STAT {state}"}
    select_s_parameter_set: {template: "SENS{channel}:CORR:SPD:SEL {data_set}"}
    set_source_reflection_enabled: {template: "SENS{channel}:SGAM:CORR:STAT {state}"}
    set_source_reflection:
      sequence:
        - 'SENS{channel}:SGAM:MAGN {magnitude}'
        - 'SENS{channel}:SGAM:PHAS {phase_deg}'
    set_delay_s:
      sequence:
        - 'TRIG:DEL:AUTO OFF'
        - 'TRIG:DEL {delay_s}'
    set_holdoff_s: {template: "TRIG:HOLD {holdoff_s}"}
    set_hysteresis_db: {template: "TRIG:HYST {hysteresis_db}"}
    set_dropout_s: {template: "TRIG:DTIM {dropout_s}"}
    abort_armed_power: {template: "ABOR"}
  queries:
    identify: {template: "*IDN?", response: {type: str}}
    native_power_self_test: {template: "*TST?", response: {type: int}}
    get_error: {template: "SYST:ERR?", response: {type: str}}
    opc_query: {template: "*OPC?", response: {type: str}}
    esr_query: {template: "*ESR?", response: {type: str}}
    fetch_power:
      template: "FETC{channel}:POW:AVG?"
      validators:
        channel: {min: 1, max: 1}
      response: {type: float}
    acquire_power:
      sequence:
        - 'CALC:FEED "POWer:AVERage"'
        - "INIT"
        - "*WAI"
        - "FETC{channel}:POW:AVG?"
      validators:
        channel: {min: 1, max: 1}
      response: {type: float}
    read_unit: {template: "UNIT:POW?", response: {type: str}}
    read_correction_frequency: {template: "SENS{channel}:FREQ?", response: {type: float}}
    read_format: {template: "FORM:DATA?", response: {type: str}}
    read_continuous: {template: "INIT:CONT?", response: {type: str}}
    read_buffered: {template: "SENS{channel}:BUFF:STAT?", response: {type: str}}
    read_quality: {template: "STAT:QUES:POW:COND?", response: {type: int}}

    read_duty_cycle_percent: {template: "SENS{channel}:CORR:DCYC?", response: {type: float}}
    read_duty_cycle: {template: "SENS{channel}:CORR:DCYC:STAT?", response: {type: str}}
    read_detector: {template: "SENS{channel}:FUNC?", response: {type: str}}
    read_feed: {template: "CALC:FEED?", response: {type: str}}
    read_trigger_source: {template: "TRIG:SOUR?", response: {type: str}}
    read_averaging_enabled: {template: "SENS{channel}:AVER:STAT?", response: {type: str}}
    read_auto_average: {template: "SENS{channel}:AVER:COUN:AUTO?", response: {type: str}}
    read_averaging_count: {template: "SENS{channel}:AVER:COUN?", response: {type: str}}
    read_fast: {template: "SENS{channel}:POW:AVG:FAST?", response: {type: str}}
    read_aux: {template: "SENS{channel}:AUX?", response: {type: str}}
    read_repetition: {template: "SENS{channel}:AVER:TCON?", response: {type: str}}
    read_trigger_count: {template: "TRIG:COUN?", response: {type: str}}
    read_aperture: {template: "SENS{channel}:POW:AVG:APER?", response: {type: str}}
    read_calibration_condition: {template: "STAT:QUES:CAL:COND?", response: {type: int}}
    read_calibrating: {template: "STAT:OPER:CAL:COND?", response: {type: int}}
    read_measuring: {template: "STAT:OPER:MEAS:COND?", response: {type: int}}
    read_triggering: {template: "STAT:OPER:TRIG:COND?", response: {type: int}}
    read_static_error: {template: "SYST:SERR?", response: {type: str}}
    read_auto_trigger: {template: "TRIG:ATR:STAT?", response: {type: str}}
    read_gate_edge: {template: "TRIG:SLOP?", response: {type: str}}
    read_gate_delay: {template: "TRIG:DEL?", response: {type: str}}
    read_gate_auto_delay: {template: "TRIG:DEL:AUTO?", response: {type: str}}
    read_buffer_size: {template: "SENS{channel}:POW:AVG:BUFF:SIZE?", response: {type: int}}
    read_buffer_count: {template: "SENS{channel}:POW:AVG:BUFF:COUN?", response: {type: int}}
    fetch_power_buffer: {template: "FETC{channel}:ARR:POW:AVG?", response: {type: str}}
    read_fixed_offset: {template: "SENS{channel}:CORR:OFFS?", response: {type: str}}
    read_fixed_offset_enabled: {template: "SENS{channel}:CORR:OFFS:STAT?", response: {type: str}}
    read_s_parameter_enabled: {template: "SENS{channel}:CORR:SPD:STAT?", response: {type: str}}
    read_s_parameter_set: {template: "SENS{channel}:CORR:SPD:SEL?", response: {type: str}}
    read_trigger_level: {template: "TRIG:LEV?", response: {type: float}}
    read_trigger_level_unit: {template: "TRIG:LEV:UNIT?", response: {type: str}}
    read_trigger_sender: {template: "TRIG:SEND:STAT?", response: {type: str}}
    read_trigger_sync: {template: "TRIG:SYNC:STAT?", response: {type: str}}
    read_source_reflection_enabled: {template: "SENS{channel}:SGAM:CORR:STAT?", response: {type: str}}
    read_source_reflection_magnitude: {template: "SENS{channel}:SGAM:MAGN?", response: {type: float}}
    read_source_reflection_phase: {template: "SENS{channel}:SGAM:PHAS?", response: {type: float}}
    read_input_reflection_magnitude: {template: "SENS{channel}:IGAM:MAGN?", response: {type: float}}
    read_input_reflection_phase: {template: "SENS{channel}:IGAM:PHAS?", response: {type: float}}
    read_input_reflection_uncertainty: {template: "SENS{channel}:IGAM:EUNC?", response: {type: float}}
    read_trigger_holdoff: {template: "TRIG:HOLD?", response: {type: float}}
    read_trigger_hysteresis: {template: "TRIG:HYST?", response: {type: float}}
    read_trigger_dropout: {template: "TRIG:DTIM?", response: {type: float}}

operation_options:
  operations:
    read_power:
      transport: {fetch_power: fetch_power}
      parameters:
        channel:
          kind: range
          min: 1
          max: 1
          bindings: [{alias: fetch_power, parameter: channel}]
    measure_power:
      transport:
        acquire_power: acquire_power
        read_unit: read_unit
        read_correction_frequency: read_correction_frequency
        read_format: read_format
        read_continuous: read_continuous
        read_buffered: read_buffered
        read_quality: read_quality
      parameters:
        channel:
          kind: range
          min: 1
          max: 1
          bindings: [{alias: acquire_power, parameter: channel}]
        unit:
          kind: enum
          options:
            - {value: dBm, transport: {value: dBm}}
            - {value: W, transport: {value: W}}
            - {value: mW, transport: {value: mW}}
            - {value: uW, transport: {value: uW}}
    configure_sensor:
      transport:
        set_sensor_frequency: set_sensor_frequency
        set_averaging_count: set_averaging_count
        set_power_units: set_power_units
      parameters:
        channel:
          kind: range
          min: 1
          max: 1
          bindings:
            - {alias: set_sensor_frequency, parameter: channel}
            - {alias: set_averaging_count, parameter: channel}
        units:
          kind: enum
          options:
            - {value: dBm, transport: {value: DBM}}
            - {value: W, transport: {value: W}}
          bindings: [{alias: set_power_units, parameter: units}]
        freq:
          kind: range
          min: 8000
          max: 18000000000
          bindings: [{alias: set_sensor_frequency, parameter: frequency}]
        averaging_count:
          kind: range
          min: 1
          max: 65536
          bindings: [{alias: set_averaging_count, parameter: count}]
    configure_power:
      transport:
        set_trigger_level: set_trigger_level
        read_trigger_level: read_trigger_level
        read_trigger_level_unit: read_trigger_level_unit
        read_trigger_sender: read_trigger_sender
        read_duty_cycle_percent: read_duty_cycle_percent
        read_duty_cycle: read_duty_cycle
        get_error: get_error
        read_format: read_format
        read_continuous: read_continuous
        read_unit: read_unit
        read_correction_frequency: read_correction_frequency
        read_detector: read_detector
        read_feed: read_feed
        read_trigger_source: read_trigger_source
        read_averaging_enabled: read_averaging_enabled
        read_auto_average: read_auto_average
        read_averaging_count: read_averaging_count
        read_fast: read_fast
        read_aux: read_aux
        read_repetition: read_repetition
        read_trigger_count: read_trigger_count
        read_aperture: read_aperture
        read_buffered: read_buffered
        read_auto_trigger: read_auto_trigger
        read_gate_edge: read_gate_edge
        read_gate_delay: read_gate_delay
        read_gate_auto_delay: read_gate_auto_delay
        read_buffer_size: read_buffer_size
        set_aperture: set_aperture
        set_external_trigger: set_external_trigger
        setup_buffered_average: setup_buffered_average
        setup_average: setup_average
        setup_pulse_average: setup_average
        set_duty_cycle: set_duty_cycle
        setup_peak: setup_average
        setup_random_sample: setup_average
        set_peak_feed: set_peak_feed
        set_random_feed: set_random_feed
        configure_manual_averaging: configure_manual_averaging
        set_sensor_frequency: set_sensor_frequency
        configure_automatic_averaging: configure_automatic_averaging
        configure_disabled_averaging: configure_disabled_averaging
        set_power_units: set_power_units
        set_trigger_edge: set_trigger_edge
      parameters:
        channel: {kind: range, integer: true, min: 1, max: 1, default: 1, required: false, transport_parameter: false}
        mode:
          kind: enum
          default: average
          required: false
          transport_parameter: false
          options:
            - {value: pulse_average, description: Average power corrected using a known RF duty cycle.}
            - {value: peak, description: Sensor-reported peak in the measurement interval.}
            - {value: random_sample, description: Sensor-selected random sample from the measurement interval.}
            - {value: average, description: Immediate-triggered absolute average power.}
            - {value: gated_average, supported: false, reason: NRP18AN does not support time-gated power.}
            - {value: buffered_average, description: Hardware buffer of distinct absolute average-power readings.}
        averaging_mode:
          kind: enum
          default: manual
          required: false
          transport_parameter: false
          options:
            - {value: manual}
            - {value: automatic}
            - {value: disabled}
        native_unit:
          kind: enum
          default: dBm
          required: false
          transport_parameter: false
          options:
            - {value: dBm, transport: {value: DBM}}
            - {value: W, transport: {value: W}}
        trigger_source:
          kind: enum
          required: false
          transport_parameter: false
          options:
            - {value: immediate, transport: {value: IMM}}
            - {value: internal, transport: {value: INT}, description: RF envelope trigger; trigger sender must be off.}
            - {value: external_1, transport: {value: EXT1}}
            - {value: external_2, transport: {value: EXT2}, description: SMB input without verified programmable slope.}
            - {value: external, supported: false, reason: Choose the explicit EXT1 or EXT2 input.}
        trigger_level_dbm: {kind: range, unit: dBm, min: -40, max: 23, required: false, dependencies: [mode, trigger_source], transport_parameter: false}
        trigger_edge:
          kind: enum
          description: Available for internal and EXT1 triggering only. Omit for EXT2.
          required: false
          transport_parameter: false
          options:
            - {value: rising, transport: {value: POS}}
            - {value: falling, transport: {value: NEG}}
        duty_cycle_percent: {kind: range, unit: percent, min: 0.001, max: 100, required: false, dependencies: [mode], transport_parameter: false}
        frequency_hz: {kind: range, unit: Hz, min: 8000, max: 18000000000, transport_parameter: false}
        averaging_count: {kind: range, integer: true, min: 1, max: 65536, default: 8, required: false, transport_parameter: false}
        sample_count: {kind: range, integer: true, min: 2, max: 8192, required: false, dependencies: [mode], transport_parameter: false}
        aperture_s: {kind: range, unit: s, min: 0.00001, max: 2, required: false, transport_parameter: false}
        gate_offset_s:
          kind: range
          unit: s
          min: -0.15
          max: 0.15
          required: false
          dependencies: [mode]
          transport_parameter: false
          supported: false
          reason: NRP18AN does not support time-gated power.
        gate_duration_s:
          kind: range
          unit: s
          min: 0.0001
          max: 0.15
          required: false
          dependencies: [mode]
          transport_parameter: false
          supported: false
          reason: NRP18AN does not support time-gated power.
        timeout_ms: {kind: range, unit: ms, integer: true, min: 1, max: 2147483647, default: 5000, required: false, transport_parameter: false}

    acquire_power:
      transport:
        read_trigger_level: read_trigger_level
        read_trigger_level_unit: read_trigger_level_unit
        read_trigger_sender: read_trigger_sender
        read_trigger_sync: read_trigger_sync
        read_duty_cycle_percent: read_duty_cycle_percent
        read_duty_cycle: read_duty_cycle
        get_error: get_error
        read_format: read_format
        read_continuous: read_continuous
        read_unit: read_unit
        read_correction_frequency: read_correction_frequency
        read_detector: read_detector
        read_feed: read_feed
        read_trigger_source: read_trigger_source
        read_averaging_enabled: read_averaging_enabled
        read_auto_average: read_auto_average
        read_averaging_count: read_averaging_count
        read_fast: read_fast
        read_aux: read_aux
        read_repetition: read_repetition
        read_trigger_count: read_trigger_count
        read_aperture: read_aperture
        read_buffered: read_buffered
        read_auto_trigger: read_auto_trigger
        read_gate_edge: read_gate_edge
        read_gate_delay: read_gate_delay
        read_gate_auto_delay: read_gate_auto_delay
        read_quality: read_quality
        start: start_power_single
        opc_query: opc_query
        fetch_pulse_average: fetch_power
        fetch_peak: fetch_power
        fetch_random_sample: fetch_power
        fetch_average: fetch_power
      parameters:
        channel: {kind: range, integer: true, min: 1, max: 1, default: 1, required: false, transport_parameter: false}
        mode:
          kind: enum
          default: average
          required: false
          transport_parameter: false
          options:
            - {value: pulse_average, description: Average power corrected using a known RF duty cycle.}
            - {value: peak, description: Sensor-reported peak in the measurement interval.}
            - {value: random_sample, description: Sensor-selected random sample from the measurement interval.}
            - {value: average, description: Immediate-triggered absolute average power.}
            - {value: gated_average, supported: false, reason: NRP18AN does not support time-gated power.}
            - {value: buffered_average, supported: false, reason: Use acquire_power_buffer for buffered results.}
        unit:
          kind: enum
          default: dBm
          required: false
          transport_parameter: false
          options:
            - {value: dBm}
            - {value: W}
            - {value: mW}
            - {value: uW}
        timeout_ms: {kind: range, unit: ms, integer: true, min: 1, max: 2147483647, default: 10000, required: false, transport_parameter: false}

    sensor_status:
      transport:
        identify: identify
        read_quality: read_quality
        read_calibration_condition: read_calibration_condition
      parameters:
        channel: {kind: range, integer: true, min: 1, max: 1, default: 1, required: false, transport_parameter: false}
        timeout_ms: {kind: range, unit: ms, integer: true, min: 1, max: 2147483647, default: 2000, required: false, transport_parameter: false}

    zero_sensor:
      transport:
        identify: identify
        read_continuous: read_continuous
        read_calibrating: read_calibrating
        read_measuring: read_measuring
        read_triggering: read_triggering
        get_error: get_error
        perform_zero: zero_once
        read_static_error: read_static_error
      parameters:
        channel: {kind: range, integer: true, min: 1, max: 1, default: 1, required: false, transport_parameter: false}
        mode:
          kind: enum
          default: external
          required: false
          transport_parameter: false
          options:
            - {value: external, transport: {value: EXT}}
            - {value: internal, supported: false, reason: NRP18AN needs a quiet RF input for zeroing.}
        timeout_ms: {kind: range, unit: ms, integer: true, min: 1, max: 2147483647, default: 30000, required: false, transport_parameter: false}

    read_power_settings:
      transport:
        read_trigger_level: read_trigger_level
        read_trigger_level_unit: read_trigger_level_unit
        read_trigger_sender: read_trigger_sender
        read_duty_cycle_percent: read_duty_cycle_percent
        read_duty_cycle: read_duty_cycle
        read_format: read_format
        read_continuous: read_continuous
        read_unit: read_unit
        read_correction_frequency: read_correction_frequency
        read_detector: read_detector
        read_feed: read_feed
        read_trigger_source: read_trigger_source
        read_averaging_enabled: read_averaging_enabled
        read_auto_average: read_auto_average
        read_averaging_count: read_averaging_count
        read_trigger_count: read_trigger_count
        read_fast: read_fast
        read_aux: read_aux
        read_repetition: read_repetition
        read_aperture: read_aperture
        read_buffered: read_buffered
        read_auto_trigger: read_auto_trigger
        read_gate_edge: read_gate_edge
        read_gate_delay: read_gate_delay
        read_gate_auto_delay: read_gate_auto_delay
        read_buffer_size: read_buffer_size
      parameters:
        channel: {kind: range, integer: true, min: 1, max: 1, default: 1, required: false, transport_parameter: false}
        mode:
          kind: enum
          default: average
          required: false
          transport_parameter: false
          options:
            - {value: pulse_average, description: Average power corrected using a known RF duty cycle.}
            - {value: peak, description: Sensor-reported peak in the measurement interval.}
            - {value: random_sample, description: Sensor-selected random sample from the measurement interval.}
            - {value: average, description: Immediate-triggered absolute average power.}
            - {value: gated_average, supported: false, reason: NRP18AN does not support time-gated power.}
            - {value: buffered_average, description: Hardware buffer of distinct absolute average-power readings.}
        timeout_ms: {kind: range, unit: ms, integer: true, min: 1, max: 2147483647, default: 2000, required: false, transport_parameter: false}

    acquire_power_buffer:
      transport:
        read_trigger_level: read_trigger_level
        read_trigger_level_unit: read_trigger_level_unit
        read_trigger_sender: read_trigger_sender
        read_trigger_sync: read_trigger_sync
        read_duty_cycle: read_duty_cycle
        read_format: read_format
        read_continuous: read_continuous
        read_unit: read_unit
        read_correction_frequency: read_correction_frequency
        read_detector: read_detector
        read_feed: read_feed
        read_trigger_source: read_trigger_source
        read_averaging_enabled: read_averaging_enabled
        read_auto_average: read_auto_average
        read_averaging_count: read_averaging_count
        read_trigger_count: read_trigger_count
        read_fast: read_fast
        read_aux: read_aux
        read_repetition: read_repetition
        read_aperture: read_aperture
        read_buffered: read_buffered
        read_auto_trigger: read_auto_trigger
        read_gate_edge: read_gate_edge
        read_gate_delay: read_gate_delay
        read_gate_auto_delay: read_gate_auto_delay
        read_buffer_size: read_buffer_size
        read_buffer_count: read_buffer_count
        start: start_power_buffer
        opc_query: opc_query
        get_error: get_error
        read_quality: read_quality
        fetch_buffered_average: fetch_power_buffer
      parameters:
        channel: {kind: range, integer: true, min: 1, max: 1, default: 1, required: false, transport_parameter: false}
        unit:
          kind: enum
          default: dBm
          required: false
          transport_parameter: false
          options:
            - {value: dBm}
            - {value: W}
            - {value: mW}
            - {value: uW}
        timeout_ms: {kind: range, unit: ms, integer: true, min: 1, max: 2147483647, default: 10000, required: false, transport_parameter: false}

    read_power_corrections:
