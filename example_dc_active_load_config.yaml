# Example DC Active Load Configuration
# This file demonstrates the enhanced SCPI validation system for DC active loads

manufacturer: "Keysight"
model: "N3300A"
device_type: "dc_active_load"
address: "USB0::0x0957::0x0607::MY12345678::INSTR"

# Core SCPI command requirements
core_scpi_commands:
  - "set_input_state"
  - "set_voltage_unit"
  - "set_current_unit"
  - "set_power_unit"
  - "set_voltage_autorange_state"
  - "set_current_autorange_state"
  - "set_power_autorange_state"

# Input functionality SCPI commands
input_scpi_commands:
  - "set_input_polarity"
  - "set_input_protection_state"
  - "set_input_protection_delay"
  - "set_input_protection_clear"
  - "set_input_protection_trip"

# Slew rate functionality SCPI commands
slew_rate_scpi_commands:
  - "set_current_slew_rate"
  - "set_power_slew_rate"
  - "set_voltage_slew_rate"
  - "get_current_slew_rate"
  - "get_power_slew_rate"
  - "get_voltage_slew_rate"

# Measurement functionality SCPI commands
measurement_scpi_commands:
  - "get_input_voltage"
  - "get_input_current"
  - "get_input_power"
  - "get_temperature"
  - "get_measurement_status"
  - "get_measurement_accuracy"

# Operating mode specifications
operating_modes:
  constant_current:
    current_range:
      min: 0.0
      max: 30.0
      units: "A"
    voltage_range:
      min: 0.0
      max: 60.0
      units: "V"
    power_range:
      min: 0.0
      max: 150.0
      units: "W"
    required_scpi_commands:
      - "set_constant_current_mode"
      - "set_current_value"
      - "set_voltage_limit"
      - "set_power_limit"
      - "get_current_value"
      - "get_voltage_limit"
      - "get_power_limit"

  constant_voltage:
    voltage_range:
      min: 0.0
      max: 60.0
      units: "V"
    current_range:
      min: 0.0
      max: 30.0
      units: "A"
    power_range:
      min: 0.0
      max: 150.0
      units: "W"
    required_scpi_commands:
      - "set_constant_voltage_mode"
      - "set_voltage_value"
      - "set_current_limit"
      - "set_power_limit"
      - "get_voltage_value"
      - "get_current_limit"
      - "get_power_limit"

  constant_power:
    power_range:
      min: 0.0
      max: 150.0
      units: "W"
    voltage_range:
      min: 0.0
      max: 60.0
      units: "V"
    current_range:
      min: 0.0
      max: 30.0
      units: "A"
    required_scpi_commands:
      - "set_constant_power_mode"
      - "set_power_value"
      - "set_voltage_limit"
      - "set_current_limit"
      - "get_power_value"
      - "get_voltage_limit"
      - "get_current_limit"

  constant_resistance:
    resistance_range:
      min: 0.001
      max: 1000.0
      units: "Ω"
    voltage_range:
      min: 0.0
      max: 60.0
      units: "V"
    current_range:
      min: 0.0
      max: 30.0
      units: "A"
    required_scpi_commands:
      - "set_constant_resistance_mode"
      - "set_resistance_value"
      - "set_voltage_limit"
      - "set_current_limit"
      - "get_resistance_value"
      - "get_voltage_limit"
      - "get_current_limit"

  required_scpi_commands:
    - "set_operating_mode"
    - "get_operating_mode"
    - "set_mode_transition"
    - "get_mode_transition"

# Transient capabilities
transient:
  enabled: true
  time_range:
    nominal: 1.0
    min: 0.000001
    max: 1000.0
    units: "s"
  level_range:
    min: 0.0
    max: 100.0
    units: "%"
  required_scpi_commands:
    - "enable_transient"
    - "set_transient_time"
    - "set_transient_level"
    - "set_transient_mode"
    - "get_transient_time"
    - "get_transient_level"
    - "get_transient_mode"

# Battery testing capabilities
battery_test:
  enabled: true
  test_modes:
    - "CONSTANT_CURRENT"
    - "CONSTANT_POWER"
    - "CONSTANT_RESISTANCE"
  discharge_curves:
    - "LINEAR"
    - "STEP"
    - "CUSTOM"
  required_scpi_commands:
    - "start_battery_test"
    - "stop_battery_test"
    - "set_battery_test_mode"
    - "set_battery_test_parameters"
    - "get_battery_test_status"
    - "get_battery_test_data"

# Data acquisition capabilities
data_acquisition:
  enabled: true
  sampling_rate:
    min: 1
    max: 100000
    units: "Sa/s"
  buffer_size:
    min: 1000
    max: 1000000
    units: "samples"
  trigger_sources:
    - "IMMEDIATE"
    - "EXTERNAL"
    - "BUS"
    - "VOLTAGE"
    - "CURRENT"
  required_scpi_commands:
    - "start_data_acquisition"
    - "stop_data_acquisition"
    - "set_sampling_rate"
    - "set_buffer_size"
    - "set_trigger_source"
    - "get_data_acquisition_status"
    - "get_acquired_data"

# SCPI section with detailed command specifications
scpi:
  commands:
    set_operating_mode:
      template: "LOAD:MODE {mode}"
      description: "Set the operating mode of the load"
      category: "mode"
      feature: "operating_modes"
      parameters:
        mode:
          name: "mode"
          type: "enum"
          required: true
          allowed_values: ["CC", "CV", "CP", "CR"]
          description: "Operating mode"

    set_current_value:
      template: "LOAD:CURR {current}"
      description: "Set the current value for constant current mode"
      category: "current"
      feature: "operating_modes"
      parameters:
        current:
          name: "current"
          type: "float"
          required: true
          min_value: 0.0
          max_value: 30.0
          description: "Current value"
          units: "A"

    set_voltage_limit:
      template: "LOAD:VOLT:LIM {voltage}"
      description: "Set the voltage limit for the load"
      category: "voltage"
      feature: "operating_modes"
      parameters:
        voltage:
          name: "voltage"
          type: "float"
          required: true
          min_value: 0.0
          max_value: 60.0
          description: "Voltage limit"
          units: "V"

    set_constant_current_mode:
      sequence: ["LOAD:MODE CC", "LOAD:CURR {current}"]
      description: "Set constant current mode with specified current"
      category: "mode"
      feature: "operating_modes"
      parameters:
        current:
          name: "current"
          type: "float"
          required: true
          min_value: 0.0
          max_value: 30.0
          description: "Current value"
          units: "A"

  queries:
    get_operating_mode:
      sequence: ["LOAD:MODE?"]
      description: "Get the current operating mode"
      category: "mode"
      feature: "operating_modes"
      response:
        type: "string"
        units: null

    get_current_value:
      sequence: ["LOAD:CURR?"]
      description: "Get the current current value"
      category: "current"
      feature: "operating_modes"
      response:
        type: "float"
        units: "A"

    get_input_voltage:
      sequence: ["LOAD:VOLT?"]
      description: "Get the input voltage"
      category: "measurement"
      feature: "measurement"
      response:
        type: "float"
        units: "V"

    get_input_current:
      sequence: ["LOAD:CURR?"]
      description: "Get the input current"
      category: "measurement"
      feature: "measurement"
      response:
        type: "float"
        units: "A"

    get_input_power:
      sequence: ["LOAD:POW?"]
      description: "Get the input power"
      category: "measurement"
      feature: "measurement"
      response:
        type: "float"
        units: "W"

  feature_mappings:
    core_dc_active_load:
      required_scpi:
        - "set_operating_mode"
        - "set_input_state"
        - "get_operating_mode"
        - "get_input_voltage"
        - "get_input_current"
      optional_scpi:
        - "set_voltage_unit"
        - "set_current_unit"
        - "set_power_unit"

    constant_current_mode:
      required_scpi:
        - "set_constant_current_mode"
        - "set_current_value"
        - "set_voltage_limit"
        - "set_power_limit"
      optional_scpi:
        - "get_current_value"
        - "get_voltage_limit"
        - "get_power_limit"

    constant_voltage_mode:
      required_scpi:
        - "set_constant_voltage_mode"
        - "set_voltage_value"
        - "set_current_limit"
        - "set_power_limit"
      optional_scpi:
        - "get_voltage_value"
        - "get_current_limit"
        - "get_power_limit"

    constant_power_mode:
      required_scpi:
        - "set_constant_power_mode"
        - "set_power_value"
        - "set_voltage_limit"
        - "set_current_limit"
      optional_scpi:
        - "get_power_value"
        - "get_voltage_limit"
        - "get_current_limit"

    constant_resistance_mode:
      required_scpi:
        - "set_constant_resistance_mode"
        - "set_resistance_value"
        - "set_voltage_limit"
        - "set_current_limit"
      optional_scpi:
        - "get_resistance_value"
        - "get_voltage_limit"
        - "get_current_limit"

    transient:
      required_scpi:
        - "enable_transient"
        - "set_transient_time"
        - "set_transient_level"
      optional_scpi:
        - "set_transient_mode"
        - "get_transient_time"
        - "get_transient_level"

    battery_test:
      required_scpi:
        - "start_battery_test"
        - "stop_battery_test"
        - "set_battery_test_mode"
      optional_scpi:
        - "set_battery_test_parameters"
        - "get_battery_test_status"
        - "get_battery_test_data"

    data_acquisition:
      required_scpi:
        - "start_data_acquisition"
        - "stop_data_acquisition"
        - "set_sampling_rate"
        - "set_buffer_size"
      optional_scpi:
        - "set_trigger_source"
        - "get_data_acquisition_status"
        - "get_acquired_data"
