[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "pytestlab"
description = "Scientific test & measurement toolbox"
authors = [{ name = "Emmanuel Olowe", email = "e.a.olowe@ed.ac.uk" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "numpy",
    "polars",
    "pyvisa",
    "pydantic",
    "uncertainties",
    "cryptography",
    "pyyaml",
    "tqdm",
    "pyscpi",
    "requests",
    "pyusb",
    "httpx",
    "aiofiles",
    "typer",
    "Pillow",
    "ruff>=0.12.9",
    "mypy>=1.17.1",
    "types-pyyaml>=6.0.12.20250809",
    "types-tqdm>=4.67.0.20250809",
    "types-pillow>=10.2.0.20240822",
    "types-requests>=2.32.4.20250809",
]

[tool.hatch.version]
path = "pytestlab/__init__.py"

[project.optional-dependencies]
docs = [
    "ghp-import>=2.1.0",
    "matplotlib>=3.10.3",
    "mkdocs-autorefs>=1.4.2",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7",
    "mkdocs-i18n>=0.4.6",
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-material>=9.6.15",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=0.29.1",
    "plotly>=6.2.0",
    "pymdown-extensions>=10.16",
    "watchdog>=6.0.0",
]
plot = ["matplotlib", "plotly"]
full = ["pytestlab[plot]", "uncertainties", "pydantic"]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "httpx",
    "aiofiles",
]

[project.scripts]
pytestlab = "pytestlab.cli:main"
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.5"
version_files = [
    "pytestlab/__init__.py:__version__", # For __version__ = "..."
]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
[tool.hatch.build]
# Explicitly exclude the tests directory if it's part of the pytestlab source package
exclude = [
    "/pytestlab/tests", # Ensure this path correctly targets tests within the package
    # "/examples", # Top-level examples are not included by `packages = ["pytestlab"]`
    # "/docs"      # Docs are not typically included in wheels
]
[tool.hatch.build.targets.wheel]
packages = ["pytestlab"]
[tool.mypy]
python_version = "3.11"

# Focus type checking on the library package only
files = ["pytestlab"]

# Ignore missing third-party typing information
ignore_missing_imports = true
follow_imports = "silent"
disable_error_code = ["annotation-unchecked"]  # Silence notes about skipped untyped defs

# Allow gradual typing within the package
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = true
warn_return_any = false
warn_unused_ignores = true
show_error_codes = true

[tool.ruff]
line-length = 100
# (Deprecated keys removed: use [tool.ruff.lint] for rule selection and ignores)

[tool.ruff.lint] # Specific lint settings
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
] # Repeat or refine selection for lint explicitly
ignore = ["E501"]

[tool.ruff.lint.isort] # isort specific settings if using ruff for import sorting
force-single-line = true
# known-first-party = ["pytestlab"] # Helps isort group project imports

[tool.ruff.format]
quote-style = "double"
# Other formatting options as desired

[tool.coverage.run]
branch = true

[dependency-groups]
dev = ["ruff>=0.12.9"]
