# Example Waveform Generator Configuration
# This file demonstrates the enhanced SCPI validation system for waveform generators

manufacturer: "Keysight"
model: "EDU33210"
device_type: "waveform_generator"
address: "USB0::0x0957::0x0607::MY12345678::INSTR"

# Core SCPI command requirements
core_scpi_commands:
  - "set_output_state"
  - "set_voltage_unit"
  - "set_load_impedance"
  - "set_voltage_limits_state"
  - "set_voltage_limit_high"
  - "set_voltage_limit_low"
  - "set_voltage_autorange_state"

# Output functionality SCPI commands
output_scpi_commands:
  - "set_output_polarity"
  - "set_sync_output_state"
  - "set_sync_output_mode"
  - "set_sync_output_polarity"
  - "set_sync_output_source"

# Synchronization functionality SCPI commands
sync_scpi_commands:
  - "set_phase_reference"
  - "synchronize_phase_all_channels"
  - "set_phase_unlock_error_state"
  - "get_phase_unlock_error_state"

# Memory management SCPI commands
memory_scpi_commands:
  - "list_directory"
  - "delete_file_or_folder"

# Channel specifications
channels:
  - description: "Channel 1 - Main output"
    frequency_range:
      min: 0.000001
      max: 20000000
      units: "Hz"
    amplitude_range:
      min: 0.001
      max: 10.0
      units: "V"
    offset_range:
      min: -5.0
      max: 5.0
      units: "V"
    phase_range:
      min: -180.0
      max: 180.0
      units: "degrees"
    required_scpi_commands:
      - "set_function"
      - "set_frequency"
      - "set_amplitude"
      - "set_offset"
      - "set_phase"

  - description: "Channel 2 - Secondary output"
    frequency_range:
      min: 0.000001
      max: 20000000
      units: "Hz"
    amplitude_range:
      min: 0.001
      max: 10.0
      units: "V"
    offset_range:
      min: -5.0
      max: 5.0
      units: "V"
    phase_range:
      min: -180.0
      max: 180.0
      units: "degrees"
    required_scpi_commands:
      - "set_function"
      - "set_frequency"
      - "set_amplitude"
      - "set_offset"
      - "set_phase"

# Waveform specifications
waveforms:
  built_in:
    - "SIN"
    - "SQU"
    - "RAMP"
    - "PULS"
    - "NOIS"
    - "ARB"
    - "DC"
  required_scpi_commands:
    - "set_function"
    - "get_function"
    - "apply_waveform_settings"
    - "get_channel_configuration_summary"
  arbitrary:
    max_length: 16384
    memory_size: 16384
    sampling_rate:
      min: 1000
      max: 200000000
      units: "Sa/s"
    required_scpi_commands:
      - "select_arbitrary_waveform"
      - "set_arbitrary_waveform_sample_rate"
      - "get_arbitrary_waveform_points"
      - "download_arbitrary_waveform_data"
      - "clear_volatile_arbitrary_waveforms"
      - "get_free_volatile_arbitrary_memory"

# Modulation capabilities
modulation:
  am_depth_range:
    min: 0.0
    max: 120.0
    units: "%"
  fm_deviation_range:
    min: 0.0
    max: 1000000.0
    units: "Hz"
  required_scpi_commands:
    - "enable_modulation"
    - "set_am_depth"
    - "set_am_source"
    - "set_fm_deviation"

# Sweep capabilities
sweep:
  time_range:
    min: 0.001
    max: 1000.0
    units: "s"
  frequency_range:
    min: 0.000001
    max: 20000000
    units: "Hz"
  required_scpi_commands:
    - "enable_sweep"
    - "set_sweep_time"
    - "set_sweep_start_frequency"
    - "set_sweep_stop_frequency"
    - "set_sweep_spacing"

# Burst capabilities
burst:
  cycles_range:
    min: 1
    max: 100000000
    units: "cycles"
  period_range:
    min: 0.001
    max: 1000.0
    units: "s"
  required_scpi_commands:
    - "enable_burst"
    - "set_burst_mode"
    - "set_burst_cycles"
    - "set_burst_period"

# Trigger capabilities
trigger:
  sources:
    - "IMM"
    - "EXT"
    - "BUS"
  slopes:
    - "POSITIVE"
    - "NEGATIVE"
    - "EITHER"
  required_scpi_commands:
    - "set_trigger_source"
    - "set_trigger_slope"
    - "trigger_now"

# SCPI section with detailed command specifications
scpi:
  commands:
    set_function:
      template: "SOUR{channel}:FUNC {function}"
      description: "Set the waveform function for a channel"
      category: "waveform"
      feature: "channels"
      parameters:
        channel:
          name: "channel"
          type: "int"
          required: true
          min_value: 1
          max_value: 2
          description: "Channel number"
          units: "channel"
        function:
          name: "function"
          type: "enum"
          required: true
          allowed_values: ["SIN", "SQU", "RAMP", "PULS", "NOIS", "ARB", "DC"]
          description: "Waveform function type"

    set_frequency:
      template: "SOUR{channel}:FREQ {frequency}"
      description: "Set the frequency for a channel"
      category: "waveform"
      feature: "channels"
      parameters:
        channel:
          name: "channel"
          type: "int"
          required: true
          min_value: 1
          max_value: 2
          description: "Channel number"
          units: "channel"
        frequency:
          name: "frequency"
          type: "float"
          required: true
          min_value: 0.000001
          max_value: 20000000
          description: "Frequency in Hz"
          units: "Hz"

    set_amplitude:
      template: "SOUR{channel}:VOLT {amplitude}"
      description: "Set the amplitude for a channel"
      category: "waveform"
      feature: "channels"
      parameters:
        channel:
          name: "channel"
          type: "int"
          required: true
          min_value: 1
          max_value: 2
          description: "Channel number"
          units: "channel"
        amplitude:
          name: "amplitude"
          type: "float"
          required: true
          min_value: 0.001
          max_value: 10.0
          description: "Amplitude in volts"
          units: "V"

  queries:
    get_function:
      sequence: ["SOUR{channel}:FUNC?"]
      description: "Get the current waveform function for a channel"
      category: "waveform"
      feature: "channels"
      parameters:
        channel:
          name: "channel"
          type: "int"
          required: true
          min_value: 1
          max_value: 2
          description: "Channel number"
          units: "channel"
      response:
        type: "string"
        units: null

    get_frequency:
      sequence: ["SOUR{channel}:FREQ?"]
      description: "Get the current frequency for a channel"
      category: "waveform"
      feature: "channels"
      parameters:
        channel:
          name: "channel"
          type: "int"
          required: true
          min_value: 1
          max_value: 2
          description: "Channel number"
          units: "channel"
      response:
        type: "float"
        units: "Hz"

  feature_mappings:
    core_waveform_generator:
      required_scpi:
        - "set_function"
        - "set_frequency"
        - "set_amplitude"
        - "set_offset"
        - "set_output_state"
      optional_scpi:
        - "set_phase"
        - "set_voltage_unit"
        - "set_load_impedance"

    arbitrary_waveform:
      required_scpi:
        - "select_arbitrary_waveform"
        - "set_arbitrary_waveform_sample_rate"
        - "download_arbitrary_waveform_data"
      optional_scpi:
        - "get_arbitrary_waveform_points"
        - "clear_volatile_arbitrary_waveforms"

    modulation:
      required_scpi:
        - "enable_modulation"
        - "set_am_depth"
        - "set_fm_deviation"
      optional_scpi:
        - "set_am_source"

    sweep:
      required_scpi:
        - "enable_sweep"
        - "set_sweep_time"
        - "set_sweep_start_frequency"
        - "set_sweep_stop_frequency"
      optional_scpi:
        - "set_sweep_spacing"

    burst:
      required_scpi:
        - "enable_burst"
        - "set_burst_mode"
        - "set_burst_cycles"
      optional_scpi:
        - "set_burst_period"

    trigger:
      required_scpi:
        - "set_trigger_source"
        - "set_trigger_slope"
      optional_scpi:
        - "trigger_now"
