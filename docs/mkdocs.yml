    code_showcase_subtitle: Follow the journey from a single command to a complete, automated experiment.
    step_1_title: 1. Hello, Instrument
    step_1_desc: Start simple. Connect to any instrument with one line. PyTestLab's `AutoInstrument` handles the backend, even providing a full simulation for development and CI.
    step_2_title: 2. Define Your Bench
    step_2_desc: Describe your entire lab bench in a simple, readable YAML file. Specify instruments, connection details, and even safety limits to prevent accidents.
    step_3_title: 3. Run Your Bench
    step_3_desc: Bring your bench to life. The `Bench` context manager handles all connections and provides access to your instruments by the aliases you defined. Safety limits are enforced automatically.
    step_4_title: 4. Design Experiments
    step_4_desc: Go beyond simple commands. Use the declarative `MeasurementSession` to design complex experiments, sweep multiple parameters, and automatically collect structured data, ready for analysis.
