theme:
  name: null
  custom_dir: themes/labiium_photon
  logo: img/pytestlab_logo.png
  favicon: img/favicon.ico
  search_index_only: true
  static_templates:
    - 404.html

plugins:
  - search:
      indexing: full
  - mkdocstrings:
      handlers:
        python:
          paths: [..]
          options:
            show_root_heading: true
            show_category_heading: true
            docstring_section_style: "spacy"
            merge_init_into_class: true
            show_if_no_docstring: false
            show_source: false
            separate_signature: true
            members_order: source
            filters:
              - "!^_"
  - mkdocs-jupyter

hooks:
  - hooks.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: false
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
      permalink_title: Copy link to this section

extra_css:
  - stylesheets/docs-redesign.css

