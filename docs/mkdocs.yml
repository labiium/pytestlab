    feature_1_title: Extensible by Design
    feature_1_desc: Maximize instrument uptime and slash test execution times.
    feature_2_title: Unified Driver Layer
    feature_2_desc: A consistent, high-level API across oscilloscopes, PSUs, DMMs, and more. Swap instruments without rewriting your test logic.
    feature_3_title: Declarative & Validated
    feature_3_desc: Define instruments and benches with simple YAML files, validated by Pydantic. Catch configuration errors before they hit the hardware.
