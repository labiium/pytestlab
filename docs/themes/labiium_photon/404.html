{% set t = config.extra.t %}
{% extends "main.html" %}

{% block content %}
<div class="error-page">
    <div class="error-container">
        <div class="error-code" aria-hidden="true">404</div>
        <h1 class="error-title">{{ t['404_title'] or 'Signal Lost' }}</h1>
        <p class="error-message">{{ t['404_message'] or 'The pathway you were looking for seems to have scattered through the quantum foam.' }}</p>
        <div class="error-illustration" aria-hidden="true">
            <span class="error-wave"></span><span class="error-wave"></span><span class="error-wave"></span>
        </div>
        <div class="error-actions">
            <a href="{{ nav.homepage.url|url }}" class="beam-button">{{ t.return_button or 'Return to Safe Space' }}</a>
            <button type="button" class="text-button" data-history-back>{{ t.back_button or 'Step Back' }}</button>
        </div>
    </div>
</div>
{% endblock %}
