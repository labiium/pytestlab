bench_name: "Parallel Sweep Example Bench"
description: "A bench with two simulated power supplies for parallel testing."
simulate: true  # Use simulation for this example

devices:
  psu:
    profile: "keysight/EDU36311A"
    address: "SIM_PSU"
  load:
    profile: "keysight/EDU36311A"  # Using PSU as simulated load
    address: "SIM_LOAD"
